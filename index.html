<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>論文とスライドの書き方</title>
<meta name="theme-color" content="#f7f7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="論文スライド">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.offline{max-width:680px;margin-inline:auto;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.offline b{color:var(--c2)}
</style>
<style>
/* Layout: 家計簿の方眼ノートの上に、1枚ずつめくる問題カード。採点は赤ペンの○ */
:root{
  --paper:#f5f4ee; --grid:rgba(31,107,92,.07); --card:#ffffff; --ink:#1f2a2a; --muted:#5b6866; --line:#d9ddd6;
  --acc:#1f6b5c; --acc-soft:#e1efeb; --maru:#cf3b2a; --maru-soft:#fbe7e3; --batsu:#46566a; --batsu-soft:#e8ecf1;
  --hl:#ffe9a0; --hl-ink:#1f2a2a; --hl-fill:#fff7d6;
  --c1:#1f6b5c; --c2:#2c5d8a; --c3:#a5661a; --c4:#7a4f8f; --c5:#8a5a3c; --c6:#b0405a;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121716; --grid:rgba(120,200,180,.06); --card:#1a2221; --ink:#e4ecea; --muted:#9aa9a6; --line:#2e3a38;
  --acc:#7cc7b3; --acc-soft:#1b332e; --maru:#ff7b67; --maru-soft:#3a201c; --batsu:#a9b8cc; --batsu-soft:#253039;
  --hl:#5c4e10; --hl-ink:#fff6cf; --hl-fill:#332c12;
  --c1:#7cc7b3; --c2:#82b2df; --c3:#e3a75c; --c4:#c59ed8; --c5:#d9a27e; --c6:#ec8ea3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121716; --grid:rgba(120,200,180,.06); --card:#1a2221; --ink:#e4ecea; --muted:#9aa9a6; --line:#2e3a38;
  --acc:#7cc7b3; --acc-soft:#1b332e; --maru:#ff7b67; --maru-soft:#3a201c; --batsu:#a9b8cc; --batsu-soft:#253039;
  --hl:#5c4e10; --hl-ink:#fff6cf; --hl-fill:#332c12;
  --c1:#7cc7b3; --c2:#82b2df; --c3:#e3a75c; --c4:#c59ed8; --c5:#d9a27e; --c6:#ec8ea3; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.8;
  padding-inline:16px; padding-block:12px 48px;
}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
mark{background:linear-gradient(transparent 45%,var(--hl) 45%);color:inherit;padding:0 2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .seal{width:40px;height:40px;border-radius:50%;border:3px solid var(--maru);color:var(--maru);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;line-height:1;transform:rotate(-8deg);flex:none}
.brand b{font-family:var(--display);font-size:20px;font-weight:900;letter-spacing:.02em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-block:8px}
.hero h1{font-size:clamp(26px,6vw,34px);font-weight:900}
.hero h1 .ox{color:var(--maru)}
.hero p{margin:0;color:var(--muted);max-width:34em}
.total{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;font-size:14px;color:var(--muted)}
.total strong{font-family:var(--display);font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--maru);border-radius:99px;transition:width .4s}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;border-top:5px solid var(--fc)}
.field:hover{border-color:var(--fc)}
.field .tag{font-size:12px;letter-spacing:.08em;color:var(--fc);font-weight:700}
.field h3{font-size:19px}
.field p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.field .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.field .meter i{background:var(--fc)}
.field .go{margin-top:2px;font-family:var(--display);font-weight:700;color:var(--fc);font-size:15px}

.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:16px;background:var(--acc);color:var(--card)}
.btn.sub{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel summary{font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer}
.panel[open] summary{margin-bottom:10px}
.panel p{margin:.4em 0}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0 6px}
.stack span{display:grid;place-items:center;color:var(--card);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;font-size:13px}
.legend div{display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.qhead .fl{color:var(--fc);font-weight:700}
.qhead .n{margin-left:auto;font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;position:relative}
.qno{font-family:var(--display);font-size:13px;color:var(--fc);letter-spacing:.1em;font-weight:700}
.qtext{font-size:clamp(18px,4.6vw,21px);line-height:1.75;font-weight:700;font-family:var(--body)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.choice:active{transform:scale(.97)}
.choice .mk{font-family:var(--display);font-size:46px;font-weight:900;line-height:1}
.choice .lb{font-size:13px;color:var(--muted)}
.choice.o .mk{color:var(--maru)}
.choice.x .mk{color:var(--batsu)}
.choice:hover{border-color:var(--acc)}
.choice.picked{border-color:var(--ink)}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.4}

.verdict{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px}
.verdict.ok{background:var(--maru-soft)}
.verdict.ng{background:var(--batsu-soft)}
.verdict .big{font-family:var(--display);font-weight:900;font-size:52px;line-height:1;flex:none;width:58px;text-align:center}
.verdict.ok .big{color:var(--maru)}
.verdict.ng .big{color:var(--batsu)}
.verdict h3{font-size:20px}
.verdict p{margin:0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.verdict .big{animation:stamp .35s ease-out}}
@keyframes stamp{from{transform:scale(1.8) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}

.exp{display:flex;flex-direction:column;gap:14px}
.exp h4{font-family:var(--display);font-size:15px;margin:0;color:var(--acc);letter-spacing:.04em}
.exp .body p{margin:0 0 .6em}
.point{border:2px dashed var(--maru);border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.point::before{content:"覚える";flex:none;font-size:11px;background:var(--maru);color:var(--card);border-radius:6px;padding:2px 6px;margin-top:4px;letter-spacing:.06em}
.hon{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.75}
.hon .lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.words{display:flex;flex-direction:column;gap:6px;font-size:14px}
.words div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.words dt{font-weight:700;margin:0}
.words dt rt{font-size:10px;color:var(--muted);font-weight:400}
.words dd{margin:0;color:var(--muted)}
.fig{border:1px solid var(--line);border-radius:12px;padding:14px 10px;background:var(--paper);overflow-x:auto}
.fig .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.qnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.qnav .btn{flex:1 1 auto}
.kbd{font-size:12px;color:var(--muted);text-align:center}

/* figures */
.fig-svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.fig-svg text{fill:var(--ink);font-size:13px;font-family:var(--body)}
.fig-svg text.sm{font-size:11px;fill:var(--muted)}
.fig-svg text.b{font-weight:700}
.fig-svg text.red{fill:var(--maru);font-weight:700}
.fig-svg text.acc{fill:var(--acc);font-weight:700}
.fig-svg .bx{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
.fig-svg .ax{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.4}
.fig-svg .hx{fill:var(--hl-fill);stroke:var(--maru);stroke-width:1.6}
.fig-svg .gx{fill:var(--line);stroke:none}
.fig-svg .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.fig-svg .ln.d{stroke-dasharray:5 4}
.fig-svg .ln.red{stroke:var(--maru);stroke-width:2}
.fig-svg .ln.thick{stroke-width:5}
.fig-svg .ah{fill:var(--ink)}
.fig-svg .ah.red{fill:var(--maru)}
.fig-svg .dot{fill:var(--maru)}
.fig-svg .tree{fill:var(--c2)}
.ft{width:100%;border-collapse:collapse;font-size:14px;min-width:300px;background:var(--card)}
.ft th,.ft td{border:1px solid var(--line);padding:7px 8px;text-align:center;vertical-align:middle;line-height:1.5}
.ft th{background:var(--acc-soft);font-weight:700}
.ft td.l,.ft th.l{text-align:left}
.ft .y{color:var(--maru);font-weight:700;font-size:17px}
.ft .n{color:var(--batsu);font-weight:700;font-size:17px}
.ft .hit{background:var(--hl-fill)}

/* end */
.end{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.score{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;color:var(--maru);font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.miss{display:flex;flex-direction:column;gap:8px;width:100%}
.miss button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.miss button b{color:var(--batsu);margin-right:6px}
.foot{font-size:12px;color:var(--muted);line-height:1.7}

/* levels */
.lvls{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.lvbtn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-size:14px;text-align:left;line-height:1.3}
.lvbtn:hover{border-color:var(--fc)}
.lvbtn .nm{font-weight:700}
.lvbtn .nm small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.lvbtn .sc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvbtn .done{color:var(--maru)}
.lvdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;color:var(--card);flex:none}
.lvdot.l1,.chip.l1{background:var(--c2)}
.lvdot.l2,.chip.l2{background:var(--c3)}
.lvdot.l3,.chip.l3{background:var(--maru)}
.chip{color:var(--card);font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px}
.lvsum{font-size:13px}
.steps{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step{display:flex;align-items:center;gap:8px;min-width:0}
.step b{display:block;font-family:var(--display);font-size:15px;line-height:1.2}
.step small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.steps .arrow{color:var(--muted)}
.goro8{font-family:var(--display);font-size:clamp(16px,4.2vw,19px);line-height:1.7;text-align:center;padding:10px 8px 14px}
.goro8 b{color:var(--maru)}
.goro{border-radius:12px;padding:10px 14px;background:var(--hl-fill);font-size:14px;line-height:1.75}
.goro .lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em}
.goro .g{font-family:var(--display);font-size:16px}
.goro .g b{color:var(--maru)}
.resume{display:flex;flex-direction:column;gap:8px}
.resume h2{font-size:16px}
.resitem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:12px;padding:10px 12px}
.resitem .t{font-weight:700;font-size:15px;line-height:1.4;min-width:0}
.resitem .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.resitem .btn{padding:8px 14px;font-size:14px}
.resitem .ghost{font-size:12px}
.qtools{display:flex;justify-content:flex-end;gap:8px;margin-top:-10px}
.qtools .ghost{font-size:12px;padding:4px 12px}

.flead{margin:0 4px 10px;font-weight:700;font-size:15px;line-height:1.6}
.fnote{margin:8px 4px 0;font-size:13px;color:var(--muted);line-height:1.6}
.point::before{content:none}
.point{flex-direction:column;gap:2px}
.plbl{display:inline-block;font-size:11px;background:var(--maru);color:var(--card);border-radius:6px;padding:1px 8px;margin-bottom:4px;letter-spacing:.06em}
.point > span{display:flex;flex-direction:column;align-items:flex-start}
.ft td{text-align:left}
.ft td:has(.y:only-child),.ft td:has(.n:only-child){text-align:center}
.ft{font-size:13.5px}
.ft th:not(:first-child),.ft td{min-width:5.2em}
.ft tbody th.l{min-width:7em;max-width:14em}
/* 第5版：今日のおすすめ・本番形式 */
.today{background:var(--card);border:2px solid var(--maru);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tdhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tdlbl{font-family:var(--display);font-weight:900;font-size:20px}
.tdsub{font-size:13px;color:var(--muted)}
.btn.big{font-size:18px;padding:14px 18px;background:var(--maru)}
.tdstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tdstats div{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:var(--paper);border-radius:10px;padding:8px 10px;min-width:0}
.tdstats b{font-family:var(--display);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tdstats span{font-size:12px;color:var(--muted);line-height:1.4}
.tdstats small{display:block;font-size:10px}
.est{margin:0;font-size:14px}
.est b{font-family:var(--display);font-size:18px;color:var(--maru)}
.est small{color:var(--muted)}
.exam{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.exam h2,.sec{font-size:18px}
.exam p{margin:0;font-size:14px;color:var(--muted)}
.hi{color:var(--c3);font-size:13px;letter-spacing:.05em}
.exhead{font-weight:700;font-size:16px;line-height:1.7}
.stl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.75;padding:10px 12px;border-radius:10px;background:var(--paper)}
.stl li.sf{background:var(--batsu-soft)}
.stl li.st{background:var(--maru-soft)}
.stl .sn{font-family:var(--display);font-weight:900;font-size:16px;min-width:1.4em;text-align:center;color:var(--acc)}
.stl .tx{min-width:0}
.stl .tv{display:block;font-size:13px;margin-top:2px}
.stl li.sf .tv{color:var(--batsu)}
.stl li.st .tv{color:var(--maru)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 4px;font-size:16px;font-family:var(--display);font-weight:700}
.opt:hover{border-color:var(--acc)}
.opt.right{border-color:var(--maru);background:var(--maru-soft);color:var(--maru)}
.opt.wrongpick{border-color:var(--batsu);background:var(--batsu-soft)}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}
.exexp{display:flex;flex-direction:column;gap:8px}
.stexp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.stexp summary{cursor:pointer;font-weight:700;font-size:14px;line-height:1.6}
.stexp summary .y{color:var(--maru)}
.stexp summary .n{color:var(--batsu)}
.stexp .exp{margin-top:10px}
.timer{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.byf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.byf div{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:10px;padding:8px 12px;font-size:14px}
.byf b{font-variant-numeric:tabular-nums}
.qtools{justify-content:space-between;align-items:center}
.qtools .back{font-weight:700}
.seen{font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:0;font-weight:400}
.miss b.okm{color:var(--maru)}
.qnav .btn.sub{flex:0 1 auto}

.rlist{display:grid;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:10px;padding:8px 12px;background:var(--card)}
.rrow span{font-size:14.5px;font-weight:700}.rrow small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.rrow .ghost{min-height:40px;white-space:nowrap}.rrow .ghost:disabled{opacity:.35}
.ghost.danger{color:var(--ng,#c2410c);border-color:var(--ng,#c2410c)}
.selfmark .qclr{display:block;margin-top:8px;font-size:13px;min-height:36px}
.rbar{margin:28px 0 8px;padding-top:14px;border-top:1px dashed var(--line);text-align:center}
.rbar>.ghost{min-height:40px;color:var(--muted)}
.rmenu{margin-top:10px;display:grid;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.rmenu[hidden]{display:none}.rmenu p{margin:0 0 4px;font-size:14px;font-weight:700}.rmenu .ghost{min-height:44px;font-size:15px}

const Q=[{"id":"kiso-03b4ea68","f":"kiso","u":0,"o":0,"lv":1,"q":"医学論文の本文の基本の並び（IMRaD（Introduction, Methods, Results, and Discussion：序論・方法・結果・考察））として正しいものはどれか。","ch":["序論 → 結果 → 方法 → 考察","序論 → 考察 → 方法 → 結果","方法 → 序論 → 考察 → 結果","序論 → 方法 → 結果 → 考察"],"a":3,"cx":["結果は方法の後。何をしたかを先に書かないと、結果の意味が分からない。","考察は最後。結果を出す前に解釈すると順番が逆になる。","序論（なぜこの研究か）が最初。方法から始めると目的が分からない。",""],"core":"IMRaD＝Introduction（なぜ）→ Methods（どうやって）→ Results（何が分かった）→ Discussion（それは何を意味するか）。原著論文はほぼすべてこの型。","e":"前後に付くもの：タイトル → 抄録 → 本文（IMRaD）→ 結論 → 謝辞 → 利益相反 → 文献 → 図表と図の説明（凡例）。\n症例報告は IMRaD の変形で「緒言（はじめに）→ 症例 → 考察 → 結語」。方法と結果が「症例」1つにまとまる。\n読む人の多くはタイトル → 抄録 → 図表 の順にしか読まない。だから図表とタイトル・抄録に最も時間をかける。","tg":[],"fig":["imrad"]},{"id":"kiso-d8f746f0","f":"kiso","u":0,"o":1,"lv":1,"q":"IMRaD（Introduction, Methods, Results, and Discussion：序論・方法・結果・考察） の各部分の役割で正しいものはどれか。","ch":["考察には、結果に出していない新しいデータを加える","結果には、その数字が何を意味するかの解釈も書く","方法は、読んだ人が同じ研究をやり直せるように書く","序論には、自分の研究で得られた結果の要約を書く"],"a":2,"cx":["考察で新しいデータを出すのは禁止。出すなら結果に入れる。","解釈は考察に書く。結果は事実（数字・所見）だけ。","","序論は「なぜこの研究が必要か」まで。結果は書かない。"],"core":"方法＝再現できる詳しさ。結果＝事実だけ（解釈しない）。考察＝結果の意味と限界。序論＝分かっていること → 分かっていないこと → 目的。","e":"「結果に解釈を書かない」の例：\n×「治療後に皮疹は著明に改善し、本剤が有効であることが示された」（後半は解釈）\n○ 結果「治療開始4週後に EASI は 24 から 6 に低下した」／考察「本剤が奏効したと考えられる」\n考察で結果をもう一度全部くり返すのも悪い書き方。要点を1〜2文でまとめてから解釈に入る。","tg":[],"fig":["funnel"]},{"id":"kiso-b38d8715","f":"kiso","u":0,"o":2,"lv":1,"q":"皮膚科の論文の種類と特徴の組み合わせで正しいものはどれか。","ch":["総説：自分の施設のデータを統計で解析して示す","原著：1例の珍しい病気の経過を詳しく報告する","症例報告：1〜数例から新しい気づきを伝える","レター：数百例の比較研究を長い本文で報告する"],"a":2,"cx":["総説（レビュー）は既報の文献をまとめる。自施設データの解析は原著。","1例の報告は症例報告。原著は複数例のデータを方法・結果で示す研究。","","レター（Letter to the Editor／Research letter）は短い報告。字数・図表・文献数の上限が小さい。"],"core":"症例報告＝1〜数例。症例集積（case series）＝同じ病気の複数例のまとめ。原著＝研究（デザイン・統計あり）。総説＝文献のまとめ。レター＝短い報告や論文への意見。","e":"初めての1本は症例報告が書きやすい：テーマが手元にあり、統計がいらず、型が決まっている。\n皮膚科では「Research letter」「Concise communication」の形で、短い原著を載せる雑誌も多い（例：JAAD・British Journal of Dermatology）。\n和文誌（日本皮膚科学会雑誌・臨床皮膚科・皮膚科の臨床・皮膚病診療・西日本皮膚科など）は症例報告の割合が高い。英文誌では JAAD Case Reports、The Journal of Dermatology、Clinical and Experimental Dermatology などが症例も載せる（受け付ける種類と字数は各誌の投稿規定で必ず確認）。","tg":[],"mt":["kinds"]},{"id":"kiso-0fbcb63b","f":"kiso","u":0,"o":3,"lv":1,"q":"論文を書き始める前に最初にすることとして最もよいのはどれか。","ch":["考察に使う文献をできるだけ多く集める","抄録を規定の字数いっぱいまで先に書く","投稿先を決めて投稿規定を読む","タイトルを英語で考えて最初に決めておく"],"a":2,"cx":["文献集めは必要だが、雑誌によって文献数の上限が違う（症例報告で10〜15本など）。先に規定を見る。","抄録は本文ができてから、最後に書くのが基本。","","タイトルは中身が固まってから最後に磨く。"],"core":"まず投稿先を決め、投稿規定（Instructions for authors／投稿規程）を読む。字数・図表の数・文献の数と書き方・抄録の形式・同意書の要否が雑誌ごとに違う。","e":"投稿規定で見るところ：\n・受け付ける論文の種類（症例報告を載せるか）\n・本文の字数、抄録の字数と形式（構造化かどうか）\n・図表の枚数、写真の解像度とファイル形式\n・文献の上限数と書き方（番号順か、著者名の数）\n・患者同意書の提出、倫理審査の記載\n・カラー写真の料金・掲載料（APC（article processing charge：掲載料））\n規定を読まずに書くと、字数や形式の書き直しで時間を失う。","tg":["gl"]},{"id":"kiso-6e5941b3","f":"kiso","u":1,"o":4,"lv":2,"q":"論文を効率よく書く順番として最もよいのはどれか。","ch":["タイトル → 抄録 → 序論 → 方法 → 結果 → 考察","抄録 → タイトル → 考察 → 結果 → 方法 → 序論","図表 → 方法・結果 → 考察 → 序論 → 抄録","考察 → 序論 → 抄録 → 図表 → 方法・結果"],"a":2,"cx":["読む順に書くと、結果が固まる前に序論や抄録を書くことになり、後で何度も書き直す。","抄録とタイトルは全体の要約なので最後。","","考察は結果（図表）が固まってから。土台の前に屋根を作ることになる。"],"core":"事実（図表・方法・結果）を先に固め、その解釈（考察）、それに合わせた導入（序論）、最後に要約（抄録・タイトル）。症例報告なら「写真と経過図 → 症例 → 考察 → 緒言 → 抄録・タイトル」。","e":"なぜこの順番か：序論は「考察で言いたいこと」に向かって話を絞る部分。考察が決まらないうちに序論を書くと、話がずれて書き直しになる。\n実際のコツ：\n① 言いたいことを1文で書く（take-home message）\n② 図表・写真を並べる（これで話の筋ができる）\n③ 見出しだけの骨組みを作り、各段落の1文目（トピックセンテンス）だけ書く\n④ 中身を埋める\n⑤ 1日以上あけて読み直す","tg":[],"fig":["order"]},{"id":"kiso-b99b6ca0","f":"kiso","u":1,"o":5,"lv":2,"q":"症例報告を書く前に「この症例で伝えたいこと」を1文にする理由として最も適切なのはどれか。","ch":["タイトル・考察・結語の軸がそろい、話がぶれない","1文あれば文献検索をしなくても新しさが示せる","1文にすれば本文の字数制限を気にしなくてよくなる","査読では1文目しか読まれないのでそこに全部入れる"],"a":0,"cx":["","「新しい」と言うには文献検索で既報を確かめることが必須。","字数制限はそのまま守る必要がある。","査読者は全文を読む。1文に詰め込むのは誤り。"],"core":"伝えたいこと（take-home message）を最初に1文で決める。例「デュピルマブ投与中に結膜炎に続いて眼瞼周囲の皮膚炎が悪化した例では、〇〇を鑑別に入れる」。タイトル・考察・結語・発表の最後のスライドがすべてこの1文に向かう。","e":"よい1文の条件：\n・読者（皮膚科医）が明日の診療で使える\n・既報と何が違うか（新しい点）が入っている\n・「珍しかった」だけで終わらない\n悪い例「〇〇の1例を経験したので報告する」：何を学べるかが分からない。\nよい例「〇〇は△△に似た皮疹で始まることがあり、□□の所見が鑑別の手がかりになる」。","tg":[]},{"id":"kiso-2e1f69ab","f":"kiso","u":1,"o":6,"lv":2,"q":"症例報告にする価値が最も高いのはどれか。","ch":["教科書どおりの経過で、よく知られた治療がよく効いた例","典型と違う皮疹で始まり、診断の手がかりを示せる例","診断がつかないまま転院し、その後の経過が分からない例","既報が数百例ある病気で、新しい点が特にない典型例"],"a":1,"cx":["典型例に新しい学びはない。症例報告の価値は「新しい気づき」。","","診断・経過が分からない例は結論が出せず、報告しにくい。","報告が多い典型例は、新しい点がなければ採用されにくい。"],"core":"症例報告の価値＝①新しい病気・新しい症状 ②まれな合併 ③新しい治療の効果 ④予想外の副作用 ⑤診断の落とし穴（間違えやすい点）⑥しくみ（病態）の手がかり。「珍しいだけ」では弱い。","e":"「まれ」の確かめ方：PubMed と医中誌Webで病名＋特徴の語を検索し、既報の数と内容を表にする（考察で使う）。\n皮膚科で報告になりやすい例：新しい生物学的製剤・JAK 阻害薬の副作用、免疫チェックポイント阻害薬による皮膚障害（irAE）、典型と違う部位・年齢の発症、病理で初めて分かった例。\n既報が多くても「〇〇の所見が早期診断に役立つ」など新しい切り口があれば価値がある。","tg":[]},{"id":"kiso-6a02de59","f":"kiso","u":1,"o":7,"lv":1,"q":"投稿先の雑誌を選ぶときに最初に確かめることとして最も適切なのはどれか。","ch":["その雑誌のインパクトファクターの高さだけ","その雑誌の編集長や編集委員が知り合いかどうか","採用されやすい雑誌であれば内容や範囲は問わない","その雑誌の扱う範囲と、受け付ける論文の種類"],"a":3,"cx":["IF（impact factor：インパクトファクター） だけで選ぶと、範囲外・種類外で読まずに不採用（desk reject）になりやすい。","知り合いかどうかで選ぶのは不適切。審査は公正に行われる。","「必ず採用」をうたう雑誌は、ハゲタカジャーナルの可能性がある。",""],"core":"雑誌選び＝①範囲（scope）が合うか ②症例報告を受け付けるか ③字数・図の数 ④掲載料（APC（article processing charge：掲載料））と審査期間 ⑤読んでほしい読者がいるか。同じテーマの論文が最近載っているかも目安。","e":"初めての症例報告の目安：\n・和文：所属する地方会の雑誌、臨床皮膚科、皮膚科の臨床、皮膚病診療 など\n・英文：The Journal of Dermatology（日本皮膚科学会の英文誌）、JAAD Case Reports（オープンアクセス・掲載料あり）など\n不採用（reject）になったら、指摘を直して次の雑誌へ。不採用は珍しくなく、査読者の意見で論文はよくなる。\n同時に2つの雑誌に投稿するのは二重投稿で禁止。","tg":[],"mt":["kinds"]},{"id":"kiso-d96ef8c8","f":"kiso","u":2,"o":8,"lv":3,"q":"「伝えたいこと（take-home message）」として最もよいのはどれか。","ch":["帯状疱疹のまれで興味深い症例を経験したので、これを報告したい","帯状疱疹の発症前に、皮疹のない片側の頭痛だけが数日続くことがある","帯状疱疹という病気について、いろいろなことを学ぶことができた","帯状疱疹はよくある病気だが、まれな経過をとることもある"],"a":1,"cx":["何がまれで、読者が何をすればよいか分からない。","","書き手の感想。読者の学びではない。","具体的な経過がなく、一般論にとどまる。"],"core":"伝えたいこと＝具体的で、読者の診療に役立つ1文。これがタイトル・考察・結語・最後のスライドの軸。","e":"帯状疱疹（herpes zoster）は、皮疹の数日前から痛みや違和感が先行することがある（前駆痛）。","tg":["cs"]},{"id":"kiso-69a79ba1","f":"kiso","u":2,"o":9,"lv":3,"q":"症例報告の書き始めとして最もよい進め方はどれか。","ch":["まず考察を書き、文献をたくさん集めてから症例を思い出して書く","抄録を先に完成させ、それに合わせて写真を選び直す","伝えたいこと1文を決め、写真と経過図を並べてから症例を書き始める","とりあえず緒言から最後まで一気に書き、後で全部見直す"],"a":2,"cx":["症例（事実）が固まる前に考察を書くと、書き直しが増える。","抄録は全体の要約なので最後。","","軸が決まらないまま書くと、話がぶれる。"],"core":"書き始め＝伝えたいこと1文 → 写真・経過図 → 症例（事実）→ 考察 → 緒言 → 抄録・タイトル。","e":"このアプリの実践ワーク「症例報告の下書き」は、この順番で欄が並んでいる。","tg":["cs"],"fig":["timeline","funnel"]},{"id":"case-62c32847","f":"case","u":3,"o":10,"lv":1,"q":"和文の症例報告の本文の並びとして一般的なのはどれか。","ch":["考察 → 症例 → 緒言 → 結語","症例 → 緒言 → 結語 → 考察","緒言 → 症例 → 考察 → 結語","結語 → 緒言 → 症例 → 考察"],"a":2,"cx":["考察は症例の後。症例を見せる前に解釈はできない。","緒言（なぜ報告するか）が先。いきなり症例から入ると読む目的が分からない。","","結語は最後のまとめ。最初に置くのは抄録の役目。"],"core":"症例報告＝緒言（はじめに：病気の短い説明と、報告する理由）→ 症例（事実）→ 考察（意味・既報との比較）→ 結語（伝えたいこと1〜2文）。","e":"「症例」の中の並び（皮膚科）：\n患者：〇歳、男性／女性\n初診：20XX年X月（日付は年月まで）\n主訴：〇〇\n既往歴・家族歴・内服歴（薬疹なら薬と開始時期は必須）\n現病歴：いつから・どこに・どう変わったか\n現症：皮疹の部位・分布・形・色・大きさ・数（臨床写真）\n臨床検査所見：診断に関係する値（基準値外・陰性も大事な値は書く）\n病理組織学的所見（病理写真）\n診断\n治療および経過（経過図）","tg":[],"fig":["caseflow"]},{"id":"case-fda9ef67","f":"case","u":3,"o":11,"lv":1,"q":"症例報告の「緒言（はじめに）」に書く内容として最も適切なのはどれか。","ch":["既報例すべての年齢と性別の一覧","症例の検査値と治療経過のくわしい説明","考察で述べる結論の根拠となる文献の詳しい紹介","病気の短い説明と、この例を報告する理由"],"a":3,"cx":["既報の一覧は考察（表）に置く。","検査値と経過は「症例」に書く。","文献の詳しい議論は考察。緒言は短く。",""],"core":"緒言は3〜5文で短く：①この病気は何か（1〜2文）②何が分かっていないか・まれか ③本例の特徴と報告する理由（「今回、〇〇を呈した△△の1例を経験したので報告する」）。","e":"緒言の型（和文の例）：\n「〇〇は△△を特徴とする自己免疫性水疱症である。□□を伴う例はまれで、本邦での報告は少ない。今回、□□を初発症状とした〇〇の1例を経験したので、文献的考察を加えて報告する。」\n英文の case report では Introduction を2〜3文にする雑誌が多く、字数の大半は症例と考察に回す。","tg":[],"fig":["funnel"]},{"id":"case-9a115e32","f":"case","u":3,"o":12,"lv":1,"q":"症例報告の「症例」の部分の書き方で正しいものはどれか。","ch":["皮疹の部位・形・色・大きさを具体的に書く","検査値は正常のものも含めて全項目を書き並べる","診断に至った自分の推論や感想を交えながら書く","患者の住所と初診日の年月日を正確にすべて書く"],"a":0,"cx":["","全項目を並べると要点が埋もれる。診断に関係する値（陽性・陰性の両方）に絞る。","推論や解釈は考察に書く。症例は事実だけ。","住所や詳しい日付は個人の特定につながるので書かない（日付は年月まで）。"],"core":"症例＝事実だけを時間の順に。皮疹は「部位・分布・形・大きさ・色・表面の性状・数」を記載（例：「両下腿に径5〜10 mm の浸潤を触れる紫斑が多発」）。","e":"皮疹の記載の練習：\n×「足に赤いブツブツ」\n○「両下腿伸側に、米粒大から小豆大の、わずかに隆起する紫紅色の丘疹が散在し、一部は融合していた」\n検査値は「診断を支える値」「除外に使った陰性の値」を書く。例：類天疱瘡なら抗 BP180 抗体の値、蛍光抗体直接法の結果。\n数値には単位と、必要なら基準値を付ける。","tg":[]},{"id":"case-6e56c624","f":"case","u":3,"o":13,"lv":2,"q":"症例報告の考察の組み立てとして最もよいのはどれか。","ch":["本例の要点 → 既報との比較 → しくみ → 限界","病気の教科書的な説明 → 治療の一般論 → 今後の展望","既報の詳しい紹介 → 自分の感想 → 本例の要点","本例の経過のくり返し → 結論 → 既報の一覧"],"a":0,"cx":["","教科書的な一般論ばかりでは、本例から何を学べるかが分からない。","感想は書かない。本例の要点を先に言う。","経過のくり返しは不要。症例で書いたことは1〜2文の要約にとどめる。"],"core":"考察＝①本例の要点と新しい点（1段落目）②既報との比較（表にまとめると説得力が出る）③なぜそうなったか（しくみ）と臨床での意味 ④限界（1例であること等）→ 結語。","e":"各段落の1文目（トピックセンテンス）で言いたいことを先に言う。\n例：\n第1段落「本例は、〇〇の治療中に△△を生じた点が特徴である。」\n第2段落「PubMed と医中誌Webで検索した範囲では、同様の報告は自験例を含め7例であった（表）。」\n第3段落「△△が生じたしくみとして、□□が考えられる。」\n第4段落「本例から、〇〇の治療中は△△に注意が必要と考えた。」\n断定しすぎない：1例から「〜である」とは言えない。「〜と考えられた」「〜の可能性がある」。","tg":[],"fig":["discuss"],"mt":["litrev"]},{"id":"case-f74fbaa1","f":"case","u":3,"o":14,"lv":2,"q":"症例報告の考察で既報をまとめるとき最も適切なのはどれか。","ch":["既報例は論文の数だけ書き、内容には触れない","検索方法を書き、既報例を表にまとめる","総説の記述だけを引用し、もとの症例報告は読まない","検索せずに思いつく文献を数本挙げて「まれ」と書く"],"a":1,"cx":["数だけでは比較にならない。年齢・部位・治療・経過など比べる項目を表にする。","","総説だけを引用するのは孫引き。もとの論文（一次資料）を読んで引用する。","検索の範囲を示さないと「まれ」の根拠にならない。"],"core":"「〇〇データベースで〇〇の語を用いて〇年〇月までを検索した範囲では、△例の報告があった」と検索方法を書く。既報例の表（年齢・性別・部位・治療・経過）を作ると考察の柱になる。","e":"表の列の例：報告者（年）／年齢・性別／発症部位／きっかけ（薬など）／病理／治療／経過。最終行に自験例を入れて比べる。\n英文の既報は PubMed、和文の既報は医中誌Web で探す。会議録（学会抄録）は内容が少ないので、表に入れるかは分けて書く（「会議録を除く」など）。\n「本邦初」「世界初」は、検索の範囲を書いても見落としの可能性がある。「検索した範囲では報告がない」と控えめに書く。","tg":[],"mt":["litrev"]},{"id":"case-4cdabf9b","f":"case","u":3,"o":15,"lv":1,"q":"症例報告の「結語」として最も適切なのはどれか。","ch":["今後の研究計画を詳しく述べる","新しい文献を引用して議論を加える","本例の経過を最初から最後まで要約する","本例から学べることを1〜2文で述べる"],"a":3,"cx":["研究計画の詳細は不要。","結語で新しい文献や議論は出さない。","経過の要約は抄録の役目。結語は学びに絞る。",""],"core":"結語＝take-home message。例「〇〇の治療中に△△が出たときは、□□を鑑別に挙げる必要がある」。最初に決めた「伝えたいこと1文」と一致させる。","e":"和文誌では「結語」の見出しを置かず、考察の最後の段落でまとめる雑誌もある。投稿規定に従う。\n×「貴重な症例と考え報告した」（何を学べるか書いていない）\n○「〇〇では△△が先行することがあり、早期の皮膚生検が診断に有用である」","tg":[]},{"id":"case-d8657cd3","f":"case","u":3,"o":16,"lv":1,"q":"症例報告のタイトルとして最も適切なのはどれか。","ch":["抗ラミニン332 抗体陽性の粘膜類天疱瘡の1例","非常に興味深い経過をたどった水疱症の1例","水疱症の診断と治療についての考察と文献の紹介","私たちが当科で経験したまれな一例の報告"],"a":0,"cx":["","「興味深い」は中身が分からない。何が珍しいのかを具体的に。","短すぎて症例報告であることも特徴も分からない。","検索されても内容が分からない。病名と特徴を入れる。"],"core":"タイトル＝病名＋本例の特徴（新しい点）。検索で見つかる語（病名・薬の一般名・所見）を入れる。「興味深い」「まれな」など評価の語だけのタイトルは避ける。","e":"和文：「〇〇を呈した△△の1例」「□□投与中に生じた△△」\n英文：“Mucous membrane pemphigoid with anti-laminin 332 antibodies: a case report” のように病名と特徴を入れ、雑誌が求めれば “a case report” を付ける。\n薬は一般名（商品名ではなく）。略語はタイトルではなるべく使わない。","tg":[]},{"id":"case-47c10a3d","f":"case","u":3,"o":17,"lv":1,"q":"CARE（CAse REport：症例報告の報告ガイドライン） ガイドライン（症例報告の報告ガイドライン）が求める項目に含まれるものはどれか。","ch":["研究費の金額の内訳の表","経過の時系列（タイムライン）","対照群の患者背景の表","統計解析に使ったソフトの名前"],"a":1,"cx":["研究費は資金の記載として書くが、金額の内訳の表は求めていない。","","症例報告には対照群がない。","症例報告には通常、統計解析がない。"],"core":"CARE の主な項目：タイトル・キーワード・抄録・はじめに・患者情報・臨床所見・時系列（タイムライン）・診断の評価・治療・経過と転帰・考察・患者の視点・同意。","e":"「患者の視点（patient perspective）」：治療についての患者自身の感想・意見を短く載せる項目。求める雑誌は多くないが、CARE には入っている。\n「診断の評価」には、鑑別に挙げた病気と、それをどう除外したかを書く。\n投稿時に CARE のチェックリスト（どのページに書いたか）の提出を求める英文誌がある。","tg":["gl"],"mt":["guidelines"],"fig":["timeline"]},{"id":"case-e6bf2840","f":"case","u":3,"o":18,"lv":2,"q":"症例報告の「症例」で、鑑別診断の扱いとして最も適切なのはどれか。","ch":["鑑別に挙げた病気の教科書的な説明を症例に並べる","最終診断だけを書き、迷った過程は一切書かない","鑑別は考察で長く論じ、症例には何も書かない","挙げた鑑別と、除外した根拠（検査）を書く"],"a":3,"cx":["教科書的な説明は不要。除外の根拠だけ書く。","何を除外したかが分からないと、診断の確かさを読者が判断できない。","鑑別の根拠（検査結果）は事実なので症例に書く。考察で長く論じすぎない。",""],"core":"診断の確かさ＝「何を考え、何で除外したか」。例「蛍光抗体間接法で抗デスモグレイン抗体は陰性で、天疱瘡は否定的であった」。","e":"皮膚科の例：\n・水疱症：蛍光抗体直接法・間接法、ELISA（BP180、デスモグレイン1/3 など）\n・薬疹：薬剤リンパ球刺激試験（DLST）・パッチテスト・再投与の有無（再投与は危険なので原則しない）\n・感染症：真菌鏡検・培養・PCR\n除外の根拠が不十分なときは、考察の限界に書く。","tg":[]},{"id":"case-bfcdf5e4","f":"case","u":3,"o":19,"lv":2,"q":"学会で発表した症例を論文にするときの注意として最も適切なのはどれか。","ch":["学会抄録を少し長くして、そのまま本文として投稿する","発表後の経過と文献を加え、規定どおり書き直す","発表スライドの画像をそのまま論文の図として出す","学会で発表ずみなので、論文用の同意書は必要ない"],"a":1,"cx":["抄録は短すぎ、論文の型（緒言・症例・考察）になっていない。","","スライドの画像は解像度が低い。元の写真から図を作り直す。","論文の同意は別に必要なことが多い（雑誌の書式があればそれで取る）。"],"core":"学会発表 → 論文化はよい流れ（発表は二重出版に当たらない）。発表で受けた質問を考察に生かし、その後の経過・文献検索を最新にし、投稿規定の形に書き直す。","e":"地方会の発表から半年以内に論文にする、と決めておくと進めやすい。時間がたつと経過の情報や写真が見つけにくくなる。\n投稿時に「〇〇学会で発表した」と書くよう求める雑誌がある。","tg":["gl"]},{"id":"case-863871d9","f":"case","u":4,"o":20,"lv":2,"q":"症例報告の抄録（要旨）の書き方で最も適切なのはどれか。","ch":["年齢・性別、所見、診断と治療、学びを短くまとめる","考察で引用した文献の番号を抄録にも同じように付ける","本文に書いていない新しい検査結果を抄録だけに加える","緒言を長めに書き、症例の内容は本文を読むよう促す"],"a":0,"cx":["","抄録には原則として文献を引用しない。","本文にない内容を抄録に書いてはいけない。","抄録だけ読む人が多い。症例の要点を必ず入れる。"],"core":"抄録＝それだけ読んで内容が分かる要約。症例報告なら「〇歳、女性。主訴〜。所見〜。病理〜。診断〜。治療〜で改善。考察：〜」。最後の1文に伝えたいことを置く。","e":"抄録で避けること：文献の引用、本文にない情報、定義していない略語、図表の参照。\n字数は雑誌ごとに決まっている（和文400〜600字、英文150〜250語など）。字数を数えながら削る。\nキーワード：MeSH（Medical Subject Headings：PubMed の統制語、決まった見出し語） や医中誌のシソーラスにある語を選ぶと検索されやすい。","tg":[]},{"id":"case-d933ef4a","f":"case","u":4,"o":21,"lv":1,"q":"症例報告の患者同意について最も適切なのはどれか。","ch":["患者が亡くなった場合は誰の同意も考えなくてよい","同意は口頭で得たことにすれば記録はいらない","個人名を出さなければ同意は一切考えなくてよい","写真や経過を載せることに書面で同意を得る"],"a":3,"cx":["亡くなった場合は遺族（代理人）の同意を考える。","同意の記録（書面）を残し、雑誌によっては提出する。","多くの雑誌は、匿名化しても同意書の提出や記載を求める。",""],"core":"症例報告は、患者本人（未成年は保護者、亡くなった方は遺族）から書面で同意を得て、本文に「本報告について患者から書面で同意を得た」と書く。雑誌の同意書の書式があればそれを使う。","e":"症例報告は、国の「人を対象とする生命科学・医学系研究に関する倫理指針」の「研究」には一般に当たらないとされるが、施設の決まりで倫理審査や届出が必要なことがある（施設の規則を確認）。\n顔の写真・陰部の写真・入れ墨など本人と分かる写真は、同意があっても載せる必要があるかをまず考え、必要な範囲だけ切り取る。\n同意書には「どの雑誌・学会で」「写真を含むこと」「インターネットで公開され得ること」を書いておく。","tg":["gl"]},{"id":"case-ac78ba39","f":"case","u":4,"o":22,"lv":2,"q":"症例報告で患者の個人情報を守る書き方として正しいものはどれか。","ch":["画像に写った ID 番号は資料として残しておく","紹介元の病院名と所在地をできるだけ詳しく書く","日付は特定されない範囲で年月までにする","イニシャルなら名前ではないので書いてよい"],"a":2,"cx":["病理標本・画像の番号は特定につながるので消す。","他院の施設名・所在地は原則書かない（「近医」「前医」など）。","","イニシャルも書かない（外科関連学会協議会の患者プライバシー保護の指針）。"],"core":"書かない：氏名・イニシャル・住所・ID・詳しい日付（年月まで）・他院の名前。画像の番号や撮影日も消す。それでも特定のおそれがあれば、本人の同意（または倫理委員会の承認）を得る。","e":"「症例報告を含む医学論文及び学会研究会発表における患者プライバシー保護に関するガイドライン」（外科関連学会協議会）が基本で、皮膚科を含む多くの学会が準じている。\n要点：氏名・イニシャル・呼び名は書かない／住所は書かない（病気と地域が関係するときは市町村まで）／日付は年月まで／他院の名前・所在地は書かない／顔写真は目を隠す（眼の病気なら眼だけを拡大）／標本・画像の番号は消す／それでも特定されうるときは同意か倫理委員会の承認。\nICMJE（医学雑誌編集者国際委員会）は「目の部分を隠すだけでは匿名化として不十分」としており、顔が写る写真は本人の同意を得るのが原則。","tg":["gl"],"mt":["privacy"]},{"id":"case-f631fd9e","f":"case","u":5,"o":23,"lv":3,"q":"症例報告の緒言の最後の1文として最もよいのはどれか。","ch":["今回の症例は我々にとって初めての経験であり、大変勉強になった","尋常性天疱瘡について文献を調べたので、その結果を詳しく述べる","今回、口腔のびらんで始まった尋常性天疱瘡の1例を報告する","今回、我々は非常に興味深く貴重な尋常性天疱瘡の1例を経験した"],"a":2,"cx":["書き手の感想。読者が学べる点を書く。","症例報告の目的は文献の紹介ではない。本例の特徴を書く。","","「興味深く貴重」は評価の言葉だけで、何が特徴か伝わらない。"],"core":"緒言の最後は「本例の特徴＋報告する」。特徴（新しい点）を具体的に1つ入れる。","e":"定番の形：「今回、〇〇を呈した△△の1例を経験したので報告する」「〜した1例を経験したので、文献的考察を加えて報告する」。\n「我々は」は和文では省いてよいことが多い。","tg":["cs"],"fig":["funnel"]},{"id":"case-7151bfe2","f":"case","u":5,"o":24,"lv":3,"q":"症例の現症を書いた次の文のうち、最も適切なものはどれか。","ch":["水疱が多発しており、類天疱瘡に典型的な所見と考えられた","体幹と四肢に母指頭大までの緊満性水疱と紅斑が多発","体幹にいろいろな皮疹があったが、詳細は写真のとおりである","全身にひどい水ぶくれがたくさんあり、かなり重症と思われた"],"a":1,"cx":["「典型的と考えられた」は解釈。現症には所見だけを書く。","","写真に任せず文で書く。写真が小さく印刷されても伝わるように。","「ひどい」「かなり重症と思われた」は感想。大きさ・性状・部位で表す。"],"core":"現症は「部位・大きさ・性状・数」を具体的に。解釈（〜と考えられた）は考察へ。","e":"大きさの言い方：米粒大・小豆大・母指頭大・鶏卵大・手掌大、または mm・cm。\n性状：緊満性/弛緩性（水疱）、浸潤を触れる（紫斑）、鱗屑を付す、痂皮、びらん。\n分布：散在・集簇・融合・左右対称・片側性・帯状・線状。","tg":["cs"]},{"id":"case-60ba4a1a","f":"case","u":5,"o":25,"lv":3,"q":"症例報告の考察の1文として最も適切なものはどれか。","ch":["本例の経験から、デュピルマブは顔面の紅斑を必ず悪化させると結論した","本例は、デュピルマブ開始2か月後に顔面の紅斑が悪化した点が特徴である","デュピルマブについては多くの論文があるが、ここでは触れないこととする","デュピルマブはとても良い薬なので、今後もどんどん使うべきと考える"],"a":1,"cx":["1例から「必ず」とは言えない。1例でわかるのは「起こりうる」まで。","","考察で必要な既報との比較を放棄している。","「とても良い」「どんどん」は感想と主張の飛躍。"],"core":"考察の1段落目は「本例の特徴」を1文で言い切る。1例から一般化しない（「〜の可能性がある」「〜に注意を要する」）。","e":"デュピルマブ（デュピクセント）の顔面・頸部の紅斑（head and neck dermatitis）は既報があり、比較することで本例の位置づけが分かる。\n控えめな表現の使い分け：〜と考えられる（根拠あり）／〜の可能性がある（根拠が弱い）／〜が示唆される（間接的な根拠）。","tg":["cs"],"fig":["discuss"]},{"id":"case-c0000e54","f":"case","u":5,"o":26,"lv":3,"q":"症例報告で、経過を分かりやすく示す方法として最もよいのはどれか。","ch":["経過はすべて文章だけで、受診日ごとに長く書き並べる","検査値を全項目・全日分の表にして、すべて載せる","横軸を時間にし、薬の期間と皮疹の変化を並べた図を作る","受診した日の写真をすべて同じ大きさで並べて載せる"],"a":2,"cx":["長い文章だけでは、薬と症状の時間の関係が読み取りにくい。","全項目の表は読まれない。経過に関係する値だけを図に入れる。","","写真を全部並べると要点が分からない。変化の分かる数枚に絞る。"],"core":"経過図（タイムライン）：横軸＝時間（日・週・月）、上に薬の帯（いつからいつまで、量）、下に症状の重さや検査値の線、イベント（生検・入院）に印。薬疹や治療効果の報告では必須級。","e":"CARE（CAse REport：症例報告の報告ガイドライン） ガイドライン（症例報告の報告ガイドライン）でも「時系列（Timeline）」を項目に入れている。\n薬疹では、薬の開始日・中止日と皮疹の出た日の関係が診断の根拠になる（例：開始から2〜6週で出る DIHS（薬剤性過敏症症候群）など）。","tg":["cs"],"fig":["timeline"]},{"id":"case-b38b4835","f":"case","u":5,"o":27,"lv":3,"q":"症例報告の抄録の最後の1文として最もよいのはどれか。","ch":["本症例は大変まれであり、非常に貴重な経験であったと考えて報告した","今後もこのような症例を経験した場合には、報告していきたいと考える","DPP-4 阻害薬の内服中に水疱が出た高齢者では、類天疱瘡を考えて生検を行う","本症例のような症例は、さらなる症例の集積が待たれるところである"],"a":2,"cx":["「まれ・貴重」だけでは、読者が何を学べるか分からない。","書き手の今後の予定は、読者の役に立たない。","","決まり文句で中身がない。具体的な学びを書く。"],"core":"抄録の最後＝伝えたいこと（読者の行動が変わる1文）。「〜では〇〇を考える」「〜が診断の手がかりになる」の形が使いやすい。","e":"DPP-4 阻害薬（例：ビルダグリプチン〔エクア〕、シタグリプチン〔ジャヌビア・グラクティブ〕など）に関連する水疱性類天疱瘡は、炎症の少ない（非炎症型）水疱で始まることがある。\n「症例の集積が待たれる」は使ってよいが、それだけで締めると弱い。","tg":["cs"]},{"id":"case-a3c61645","f":"case","u":5,"o":28,"lv":3,"q":"症例報告の英文タイトルとして最も適切なのはどれか。","ch":["A very interesting and extremely rare case of an unusual skin disease","Bullous pemphigoid presenting as nodular prurigo: a case report","Bullous pemphigoid: clinical features, diagnosis, and treatment","Our experience with one patient seen in our department this year"],"a":1,"cx":["評価の語だけで、病名も特徴も分からない。","","病名だけでは症例報告であることも新しい点も分からない。","内容が分からず、検索でも見つからない。"],"core":"英文タイトル＝病名＋特徴（presenting as ～, associated with ～, induced by ～）。雑誌の規定があれば “: a case report” を付ける。","e":"使える型：\n・〔病名〕presenting as 〔似た病気・特徴的な症状〕\n・〔薬（一般名）〕-induced 〔病名〕\n・〔病名〕associated with 〔合併症〕\n・〔病名〕successfully treated with 〔治療〕\n“successfully treated” は1例で効いたことを示すだけで、有効性の証明ではない。","tg":["cs"]},{"id":"case-04ab47ac","f":"case","u":5,"o":29,"lv":3,"q":"症例報告のタイトルの直し方として最もよいのはどれか。元：「興味深い経過をたどった薬疹の1例」","ch":["皮膚科で入院加療を要した薬疹の1例とその治療経過について","薬疹についての一考察：当科で経験した症例をもとにして","ラモトリギン開始3週後に発症し肝障害を伴った薬剤性過敏症症候群の1例","非常に興味深い経過をたどった、まれで貴重な重症薬疹の1例"],"a":2,"cx":["入院したことは特徴にならない。病名と新しい点を入れる。","一考察は症例報告のタイトルとして中身が分からない。","","評価の語を増やしただけで、何が特徴か分からない。"],"core":"タイトルは「薬（一般名）＋時期＋病名＋特徴」。病名は「薬疹」より具体的な診断名（DIHS など）にする。","e":"薬剤性過敏症症候群（DIHS）は、原因薬の開始から2〜6週ほどで発症し、発熱・リンパ節腫脹・肝障害・好酸球増多を伴い、ヒトヘルペスウイルス6（HHV-6）の再活性化がみられる重い薬疹。\n原因薬の例：抗てんかん薬（カルバマゼピン・ラモトリギン・フェノバルビタールなど）、アロプリノール、サラゾスルファピリジン、ミノサイクリン。","tg":["cs"]},{"id":"case-d007e92d","f":"case","u":5,"o":30,"lv":3,"q":"症例報告の現病歴として最も適切なものはどれか。","ch":["紫斑が出てIgA血管炎が疑われたため、近医から当科を紹介された","少し前から足にあざのようなものが出て、そのうちお腹も痛くなったらしい","20XX年5月12日に紫斑が出現し、5月26日に腹痛が出現した","初診の3週前から下腿に紫斑が出現し、1週前から腹痛と関節痛を伴った"],"a":3,"cx":["「疑われた」は他院の解釈。現病歴は症状の経過を中心に書く（紹介の理由は最後に短く）。","「少し前」「らしい」は時期と所見があいまい。","日付は年月までにする（個人の特定を防ぐ）。経過は「初診の〇週前」で表す。",""],"core":"現病歴＝「初診の〇日（週・か月）前から、どこに、何が出て、どう変わったか」。相対的な時間で書くと日付を出さずに経過が分かる。","e":"IgA 血管炎（ヘノッホ・シェーンライン紫斑病）：下腿の浸潤を触れる紫斑（palpable purpura）・腹痛・関節痛・腎炎（血尿・蛋白尿）。成人では腎炎の経過観察が重要。","tg":["cs"]},{"id":"case-daadfe48","f":"case","u":5,"o":31,"lv":3,"q":"検査所見の書き方として最も適切なものはどれか。","ch":["抗体はかなり高い値で、天疱瘡として矛盾せず、診断を強く支持する結果であった","血液検査ではひととおり全部の項目を測ったが、異常な値はほとんど見られなかった","抗デスモグレイン3抗体 186 U/mL（基準 20 未満）、抗デスモグレイン1抗体は陰性","Dsg3 が高くて Dsg1 は低かったので、粘膜優位型の天疱瘡と考えられた"],"a":2,"cx":["「かなり高い」では値が分からない。「矛盾しない」は解釈。","「ほとんど」では何が異常で何が正常か分からない。診断に関係する値を具体的に。","","略語が定義されておらず、解釈（〜と考えられた）は考察に書く。"],"core":"検査＝項目名・値・単位・基準値。陰性の結果も、診断や除外に意味があれば書く。解釈は考察へ。","e":"尋常性天疱瘡の型：抗デスモグレイン3抗体だけ陽性 → 粘膜優位型、デスモグレイン1・3の両方 → 粘膜皮膚型。落葉状天疱瘡はデスモグレイン1だけ（粘膜病変なし）。","tg":["cs"]},{"id":"case-8e736852","f":"case","u":5,"o":32,"lv":3,"q":"病理所見の書き方として最も適切なものはどれか。","ch":["基底層直上に裂隙と棘融解細胞を認め、裂隙底部に基底細胞が一列に残る","典型的な天疱瘡の病理像で、教科書に載っている写真ととてもよく似ていた","表皮に水疱らしきものがあり、その中に細胞がいろいろ浮いているのが見えた","天疱瘡に一致する所見を認めたため、最終的に天疱瘡と診断するに至った"],"a":0,"cx":["","「典型的」「教科書と似ている」では所見が分からない。","「らしきもの」「いろいろ」はあいまい。層の名前と所見の用語で書く。","所見そのものが書かれておらず、診断の結論だけになっている。"],"core":"病理＝「どの層に」「何があるか」を用語で。所見と診断を分けて書く。","e":"尋常性天疱瘡の病理：基底層直上の表皮内水疱・棘融解細胞・裂隙底部に基底細胞が一列に残る（墓石状 tombstone appearance）。\n水疱性類天疱瘡：表皮下水疱・好酸球浸潤。","tg":["cs"]},{"id":"case-f01eaea4","f":"case","u":5,"o":33,"lv":3,"q":"治療と経過の書き方として最も適切なものはどれか。","ch":["プレドニゾロン 40 mg/日を開始し、4週後に新生水疱がなくなったため漸減した","適切な治療を行ったところ速やかに改善し、良好な経過をたどった","ステロイドをしっかり使ったところ、だんだん良くなってきたので減らしていった","プレドニン 40 mg を始めたら効いたので、少しずつ減らすことにした"],"a":0,"cx":["","「適切な治療」では何をしたか分からない。","「しっかり」「だんだん」では量も時期も分からない。","商品名（プレドニン）ではなく一般名で書く。「効いた」は何がどう変わったかを書く。"],"core":"治療＝一般名・量・期間。経過＝「何週後に、何が、どうなったか」。減量・中止と、その後の再発の有無まで書く。","e":"ステロイドの減量の書き方の例：「4週ごとに 5 mg ずつ漸減し、開始から 6 か月後に 10 mg/日で維持している」。\n外用薬は一般名と強さのクラス（ストロンゲスト・ベリーストロングなど）を書く。","tg":["cs"]},{"id":"case-bf151293","f":"case","u":5,"o":34,"lv":3,"q":"症例報告の考察で、既報との比較の書き方として最も適切なものはどれか。","ch":["既報例の詳細については、読者が各自で文献を調べていただきたいと考える","本例のような症例は世界で初めての報告であり、学術的に極めて重要である","検索した範囲では同様の報告は自験例を含め8例で、6例が60歳以上であった","過去にも同じような報告がたくさんあるが、本例はそれらとは違う点があると考える"],"a":2,"cx":["比較は考察の中心。読者に任せてはいけない。","検索の範囲を書かずに「世界初」とは言えない。「検索した範囲では報告がない」と控えめに。","","「たくさん」では数が分からず、どこが違うかも示していない。"],"core":"既報の比較＝検索方法＋数＋共通点・違い＋表。数字で示すと説得力が出る。","e":"表1を本文で引用し、表から読み取れる要点を1〜2文で書く（表の中身を全部くり返さない）。","tg":["cs"]},{"id":"case-b1ccc2ed","f":"case","u":5,"o":35,"lv":3,"q":"症例報告の考察の最後の段落として最も適切なものはどれか。","ch":["本例については今後さらに詳しく検討していく予定である","1例の経験であり、外用の効果と自然軽快を区別できない点は限界である","本例は大変まれな症例であり、貴重な経験をすることができた","本例の経験から、この治療法をすべての患者に行うべきであると考える"],"a":1,"cx":["予定だけでは読者の役に立たない。","","感想で終わっている。学びと限界を書く。","1例から全員への治療の推奨はできない。"],"core":"最後の段落＝限界（1例であること・他の要因の可能性）→ 結語へ。限界を書くと、かえって信頼される。","e":"限界の型：「1例の経験であり〜は否定できない」「経過観察期間が短く、長期の再発の有無は不明である」「〜の検査は行っておらず、〜は除外できていない」。","tg":["cs"]},{"id":"case-e0b8c981","f":"case","u":5,"o":36,"lv":3,"q":"症例報告の抄録（要旨）の直し方として最もよいのはどれか。元：「今回我々は興味深い天疱瘡の1例を経験したので、若干の文献的考察を加えて報告する。」","ch":["本文に書いていない新しい検査結果を抄録だけに加える","年齢・性別、所見、診断と治療、学びを短くまとめる","考察で引用した文献の番号を抄録にも同じように付ける","緒言を長めに書き、症例の内容は本文を読むよう促す"],"a":1,"cx":["抄録だけ読む人が多い。中身のない要旨は読まれない。","","抄録には原則として文献を引用しない。","強調しても中身がないことは変わらない。"],"core":"要旨は「何をしたか（報告する）」ではなく「何が分かったか」の要約。決まり文句だけの要旨は、和文誌でもよく指摘される。","e":"直した例：「64歳、女性。口腔内のびらんが3か月続いた後に体幹に弛緩性水疱が出現した。抗デスモグレイン3抗体陽性、抗デスモグレイン1抗体陰性で、尋常性天疱瘡（粘膜優位型）と診断した。……口腔内の難治性びらんでは天疱瘡を考える必要がある。」","tg":["cs"]},{"id":"case-adb98daa","f":"case","u":5,"o":37,"lv":3,"q":"症例報告の結語の直し方として最もよいのはどれか。元：「貴重な症例と考え報告した。」","ch":["今後も同様の症例の集積と、さらなる検討が必要と考えられる","非常に貴重でまれな症例と考え、ここにその詳細を報告した","口腔内の難治性びらんでは、皮疹がなくても天疱瘡を考えて抗体を測定する","本例の詳しい経過については、本文と図表を参照されたい"],"a":2,"cx":["決まり文句で、何を検討すべきか分からない。","評価の語を足しただけで、学びがない。","","結語で本文を参照させるのは役割が違う。"],"core":"結語＝読者の行動が変わる1文（〜では〇〇を考える／〇〇が診断に有用）。","e":"最初に決めた「伝えたいこと1文」と結語がずれていないか、最後に必ず確かめる。","tg":["cs"]},{"id":"photo-299df418","f":"photo","u":6,"o":38,"lv":1,"q":"論文に使う臨床写真の撮り方として最も適切なのはどれか。","ch":["背景に診察室の机や器具が写っていても気にしない","治療前は全体、治療後は拡大と、撮り方を毎回変える","フラッシュの反射で皮疹の一部が白く飛んでもよい","背景を無地にし、治療前後を同じ条件で撮る"],"a":3,"cx":["余計な物が写ると見にくく、施設や個人の特定につながることもある。","前後で距離や角度が違うと比較にならない。","反射（テカリ）で色や鱗屑が見えなくなる。斜めから光を当てるか拡散させる。",""],"core":"臨床写真＝①無地の背景（青・緑・黒など）②全体像（部位が分かる）と近接像（皮疹の性状）の2枚 ③治療前後は同じ距離・角度・明るさ ④必要ならスケール（物差し）を入れる。","e":"コツ：\n・まず部位の分かる遠景、次に皮疹の近接。どこの皮疹か分からない拡大写真だけにしない\n・ピントは皮疹に合わせる。スマホでも明るい場所でなら十分\n・アクセサリー・入れ墨・ほくろの並びなど本人と分かるものは外すか、写らないように切り取る\n・撮影は患者の同意を得て、施設の決まりに沿った機器で保存（私物のスマホに残さない施設も多い）\n・色が変わる加工（彩度を上げる等）はしない。明るさ・切り取りの調整は全体に均一にとどめる。","tg":[]},{"id":"photo-5b59f387","f":"photo","u":6,"o":39,"lv":2,"q":"論文の臨床写真の加工として許されるものはどれか。","ch":["写真全体の明るさを均一に整え、切り取る","別の患者の写真を同じ病気だからと組み合わせて載せる","治療後の写真だけ、残った皮疹をぼかして目立たなくする","皮疹をはっきり見せるため一部分だけ赤みを強くする"],"a":0,"cx":["","別人の写真を本人の経過として載せるのは捏造。","所見を消すのは改ざん。効果を大きく見せることになる。","一部分だけ色を変えるのは改ざん（データの操作）に当たる。"],"core":"許される：写真全体の均一な明るさ・コントラストの調整、切り取り、個人の特定を防ぐ目隠し。許されない：一部だけの色・明るさの変更、所見を消す・足す、別の写真の合成。","e":"多くの雑誌は画像の加工ルールを投稿規定に書いており、加工した場合はその内容を図の説明に書くよう求める。\n病理写真・ゲルの画像（ウエスタンブロット）でも同じ。部分的な加工は研究不正（改ざん）と判断されることがある。\n元の写真（加工前のファイル）は必ず保存しておく。問い合わせで提出を求められることがある。","tg":[],"mt":["privacy"]},{"id":"photo-3f4cc42d","f":"photo","u":6,"o":40,"lv":2,"q":"ダーモスコピー写真を論文に載せるときの注意として最も適切なのはどれか。","ch":["所見の名前は書かず、読者の判断にまかせる","ダーモスコピー写真だけを載せれば臨床写真はいらない","臨床写真と並べ、どの皮疹を撮ったか分かるようにする","偏光か非偏光かは結果に関係しないので書かない"],"a":2,"cx":["見せたい所見（色素ネットワーク・血管のパターンなど）に矢印や記号を付けて説明する。","ダーモスコピーだけでは、全体のどこの所見か分からない。","","偏光・非偏光で見え方が違う所見があるので、機器と方法を書く。"],"core":"ダーモスコピー＝臨床写真（全体・どの皮疹か）＋ダーモスコピー像（所見に矢印・記号）＋図の説明に所見の名前。機器・偏光/非偏光・接触/非接触を方法か図の説明に書く。","e":"図の説明の例：「図2　ダーモスコピー所見（偏光、接触型）。不規則な色素ネットワーク（矢印）と青白色構造（矢頭）を認める。」\n矢印（arrow）と矢頭（arrowhead）、星印（asterisk）などで所見を区別し、説明文で対応を書く。","tg":[]},{"id":"photo-c10122c0","f":"photo","u":6,"o":41,"lv":2,"q":"臨床写真で個人の特定を防ぐ工夫として最も適切なのはどれか。","ch":["顔全体を写し、目の部分にだけ細い黒い線を入れる","病室の名札や窓の景色が写っていてもそのまま使う","必要な部位だけ切り取り、入れ墨などを写さない","撮影日と患者 ID が写った画面をそのまま使う"],"a":2,"cx":["目の細い線だけでは本人と分かることがある。顔は必要な範囲だけにし、同意を得る。","名札・景色は施設や個人の特定につながる。","","ID・撮影日は消す（画像のファイル情報にも残ることがある）。"],"core":"写真の匿名化＝必要な部位だけ切り取る・特徴のあるもの（入れ墨・ほくろの並び・アクセサリー・名札）を写さない・ID や日付を消す。顔が必要なら本人の同意を得る。","e":"スマートフォンの写真には撮影日時や位置情報（Exif）が記録されていることがある。投稿用には書き出し直して情報を消す。\n雑誌によっては、顔写真に専用の同意書を求める。","tg":["gl"]},{"id":"photo-b614d564","f":"photo","u":7,"o":42,"lv":1,"q":"病理組織写真を論文に載せるときに最も適切なのはどれか。","ch":["弱拡大と強拡大を示し、スケールバーを入れる","倍率は写真の大きさで変わらないので本文に書けばよい","強拡大の写真1枚だけにし、全体の構築は示さない","染色の名前は誰でも分かるので図の説明には書かない"],"a":0,"cx":["","印刷・画面で拡大縮小されると「×400」の倍率は合わなくなる。スケールバーが確実。","皮膚病理は全体の構築（どの層に何があるか）が大事。弱拡大が必要。","染色（HE、PAS、免疫染色の抗体名など）は必ず書く。"],"core":"病理写真＝弱拡大（全体の構築）→ 強拡大（所見）の順。スケールバーを入れ、図の説明に染色名と所見を書く。見せたい所見に矢印。","e":"図の説明の例：「図3　病理組織像（HE 染色）。a：表皮下水疱を認める（スケールバー＝500 µm）。b：水疱内と真皮浅層に好酸球の浸潤を認める（矢印）（スケールバー＝50 µm）。」\n蛍光抗体法の写真は「表皮基底膜部に IgG と C3 の線状沈着」など、どの抗体でどこに沈着しているかを書く。\n顕微鏡写真の色合いは全体を均一に調整するだけにする（一部だけの加工は不可）。","tg":[],"fig":["patho"]},{"id":"photo-b4b57123","f":"photo","u":7,"o":43,"lv":2,"q":"図の説明（凡例・figure legend）の書き方で正しいものはどれか。","ch":["図で使った略語は本文で定義したので説明では省く","図の説明は短いほどよいので図の番号だけ書く","本文を読まなくても図が分かるように書く","矢印の意味は読者が見れば分かるので書かない"],"a":2,"cx":["図の説明の中でも略語を定義する（図だけ見る読者が多い）。","番号だけでは何の図か分からない。表題と説明を書く。","","矢印・記号が何を指すかは必ず書く。"],"core":"図の説明＝表題（何の図か）＋説明（何が見えるか）＋記号・矢印の意味＋略語の定義＋染色・スケール。図と説明だけで完結させる。","e":"多くの読者はタイトル・抄録・図表だけを見る。図が独り立ちしていれば、内容が伝わる。\n臨床写真の説明の例：「図1　初診時臨床像。a：体幹に浮腫性紅斑と緊満性水疱が多発。b：aの拡大。水疱の周囲に紅暈を伴う。」","tg":[]},{"id":"photo-7f9a6798","f":"photo","u":7,"o":44,"lv":3,"q":"病理写真の図の説明として最もよいものはどれか。","ch":["表皮下に裂隙、真皮浅層に好酸球浸潤（HE、バー＝100 µm）","病理組織像（×400）。所見の詳細は本文を参照のこと","類天疱瘡の病理で、いろいろな種類の細胞がよく見える","きれいに染まった病理の写真で、教科書どおりの所見である"],"a":0,"cx":["","倍率表記は拡大縮小でずれ、本文参照では図が独り立ちしない。","「いろいろな細胞」では所見が伝わらない。どの細胞がどこにあるか書く。","所見が書かれていない。「教科書どおり」では何を見ればよいか分からない。"],"core":"病理の説明＝どこに（層）何が（所見）＋染色名＋スケール。","e":"層の言葉：角層・顆粒層・有棘層・基底層・表皮真皮境界部・真皮浅層/中層/深層・皮下脂肪織。\n所見の言葉：表皮下水疱・棘融解・液状変性・苔癬型の浸潤・血管周囲性・帯状・結節状・びまん性。","tg":["cs"]},{"id":"photo-2a2b6709","f":"photo","u":7,"o":45,"lv":2,"q":"複数の写真を1つの図（パネル）にまとめるときの作り方として最も適切なのはどれか。","ch":["記号は付けず、本文で「左上の写真」のように説明する","大きさや向きをそろえず、空いた所に詰めて並べる","a・b・c の記号を付け、説明で各内容を書く","同じ所見を違う倍率で何枚も重ねて並べて載せる"],"a":2,"cx":["位置の言葉だけでは、組版で配置が変わると合わなくなる。","ばらばらに並べると見にくい。大きさと間隔をそろえる。","","同じ所見の重複は枚数制限の無駄。必要な写真に絞る。"],"core":"図のパネル＝a・b・c… の記号を左上に置き、大きさ・間隔をそろえ、図の説明で「a：〜。b：〜」と書く。本文では「図1a」と引用する。","e":"臨床写真のパネルの例：a 全体像 → b 近接像 → c ダーモスコピー → d 治療後（同じ距離・角度）。\n多くの雑誌は図の枚数に上限がある（症例報告で2〜4枚など）。パネルにまとめれば1枚として数えられることが多い。","tg":[]},{"id":"photo-e4a40462","f":"photo","u":8,"o":46,"lv":3,"q":"治療前後の臨床写真の直し方として最もよいのはどれか。元：「治療前は遠くから暗い部屋で、治療後は近くから明るい窓辺で撮影」","ch":["治療前の写真を切り取り、治療後と同じくらいの大きさにする","撮り方は違っても改善は分かるので、そのまま並べて載せる","同じ距離・角度・明るさ・背景で撮り直し、同じ大きさで並べる","治療後の写真だけ明るさを上げて、さらに改善を目立たせる"],"a":2,"cx":["切り取っても明るさ・角度の違いは残る。","条件が違うと、写り方の違いか改善か区別できない。","","一部だけの加工は効果を大きく見せる改ざんになりうる。"],"core":"前後比較＝同じ条件（距離・角度・光・背景）。撮る前に「次も同じに撮れるか」を考える。","e":"コツ：撮影の位置（床の印）・カメラの設定を記録しておく。","tg":["cs"]},{"id":"photo-e31bc7ac","f":"photo","u":8,"o":47,"lv":3,"q":"ダーモスコピー写真の説明の直し方として最もよいのはどれか。元：「図3　ダーモスコピー。特徴的な所見がみられる」","ch":["図3　ダーモスコピー。所見については、熟練した医師なら一目で分かる","図3　ダーモスコピー（偏光）。樹枝状血管（矢印）と青灰色の胞巣（矢頭）","図3　ダーモスコピー。非常に特徴的で典型的な所見がとてもよく見えている","図3　ダーモスコピー。所見の説明は、考察の第2段落を参照されたい"],"a":1,"cx":["読者に判断を任せている。所見の名前を書く。","","評価の語だけで、何が見えるか書いていない。","図の説明だけで分かるように書く。"],"core":"ダーモスコピーの説明＝機器の方法（偏光など）＋所見の名前＋矢印・記号の意味。","e":"基底細胞癌のダーモスコピー所見の例：樹枝状血管（arborizing vessels）、青灰色の卵円形胞巣（blue-gray ovoid nests）、潰瘍化。","tg":["cs"]},{"id":"orig-944ace19","f":"orig","u":9,"o":48,"lv":1,"q":"研究の問いを PICO（または PECO（Patient, Exposure, Comparison, Outcome：対象・曝露・比較・結果））で立てるとき、O に当たるものはどれか。","ch":["対象となる患者（例：中等症以上のアトピー性皮膚炎）","結果として測るもの（例：16週後の皮疹の改善率）","調べたい治療（例：生物学的製剤の追加）","比べる相手（例：外用薬だけの群）"],"a":1,"cx":["対象患者は P（Patient）。","","治療は I（Intervention）。曝露なら E（Exposure）。","比べる相手は C（Comparison）。"],"core":"PICO＝P 誰に（対象）・I 何をすると（介入）・C 何と比べて（比較）・O どうなるか（結果）。観察研究では I の代わりに E（曝露）で PECO。","e":"PICO が決まると、デザイン・必要な人数・統計がほぼ決まる。\nO（アウトカム）は「主要評価項目」を1つに決める。例：EASI-75 の達成率、再発までの期間。\n序論の最後の「目的」は PICO の文にすると明確になる：「中等症以上の AD 患者（P）で、生物学的製剤の追加（I）が外用のみ（C）に比べ16週後の EASI-75 達成率（O）を高めるかを検討した」。","tg":[]},{"id":"orig-5818a7ee","f":"orig","u":9,"o":49,"lv":1,"q":"病気のある人とない人を集め、過去の曝露（薬・生活習慣など）を比べる研究デザインはどれか。","ch":["横断研究","症例対照研究","ランダム化比較試験","前向きコホート研究"],"a":1,"cx":["横断研究は1時点で曝露と病気を同時に調べる。","","ランダム化比較試験は研究者が介入をくじで割り付ける。","コホート研究は曝露の有無で分けた集団を追い、病気の発生を比べる（原因 → 結果の向き）。"],"core":"症例対照研究＝結果（病気あり/なし）から出発して過去をさかのぼる。まれな病気に向く。効果の指標はオッズ比（OR（odds ratio：オッズ比））。","e":"比べ方の指標：\n・コホート研究：リスク比（RR（risk ratio：リスク比、相対危険））・ハザード比（HR（hazard ratio：ハザード比））（発生率が分かるため）\n・症例対照研究：オッズ比（OR）（発生率は分からない）\n・ランダム化比較試験：RR・HR・差・NNT（治療必要数）\n弱点：症例対照研究は思い出しの偏り（recall bias）や対照の選び方の偏りが入りやすい。\n例：「ある薬の内服と水疱性類天疱瘡」の関係を、類天疱瘡の患者と年齢をそろえた対照で比べる → 症例対照研究。","tg":[],"fig":["design","cohortcc"],"mt":["designs"]},{"id":"orig-fd2c9af6","f":"orig","u":9,"o":50,"lv":1,"q":"研究デザインの信頼性（エビデンスの強さ）が一般に最も高いものはどれか。","ch":["ランダム化比較試験のメタ解析","その分野で経験の豊富な専門家の意見","同じ病気の患者をまとめた症例集積（ケースシリーズ）","1施設で行った大規模な後ろ向きコホート研究"],"a":0,"cx":["","もっとも低い位置づけ。","比べる群がないので、効果の有無は言えない。","後ろ向きの観察研究は、偏り（バイアス）や交絡の影響を受けやすい。"],"core":"エビデンスの強さ（一般的な目安）：系統的レビュー・メタ解析 ＞ ランダム化比較試験 ＞ コホート研究 ＞ 症例対照研究 ＞ 症例集積・症例報告 ＞ 専門家の意見。","e":"ただし「デザインが上なら必ず正しい」わけではない。質の低いランダム化比較試験より、よく計画された大きなコホート研究のほうが信頼できることもある（GRADE では研究の質で評価を上げ下げする）。\n症例報告はエビデンスとしては低いが、新しい副作用や病気の最初の発見になる。","tg":[],"mt":["designs"],"fig":["design","cohortcc"]},{"id":"orig-4be11df4","f":"orig","u":9,"o":51,"lv":2,"q":"観察研究で「交絡」を減らす方法として最も適切なのはどれか。","ch":["対象者の数を増やせば交絡は自然になくなる","P 値が十分に小さければ交絡は気にしなくてよい","結果に都合のよい患者だけを選んで解析に入れる","結果に影響する因子で調整した多変量解析を行う"],"a":3,"cx":["人数を増やしても交絡は消えない（偶然のばらつきが減るだけ）。","P 値は偶然かどうかの目安で、交絡の有無とは別。","都合のよい選び方は選択バイアスで、不適切。",""],"core":"交絡＝曝露と結果の両方に関係する第三の因子（例：重症の人ほど強い薬を使い、重症の人ほど経過が悪い）。設計（マッチング・限定・ランダム化）と解析（多変量解析・傾向スコア）で減らす。","e":"ランダム化は、知られていない交絡因子まで均等に分けられる唯一の方法。観察研究では、測っていない因子による交絡（残余交絡）が残ることを限界に書く。\nバイアスの種類：選択バイアス（対象の選び方）・情報バイアス（測り方・思い出し）・交絡。","tg":[]},{"id":"orig-1628188b","f":"orig","u":10,"o":52,"lv":1,"q":"正規分布しないデータ（例：入院日数）の要約として最も適切なのはどれか。","ch":["中央値と四分位範囲","最大値と最小値だけ","平均値と標準誤差","平均値と標準偏差"],"a":0,"cx":["","最大値だけでは分布の真ん中が分からない。","標準誤差は平均値の推定の精度で、ばらつきの要約ではない。","平均値と標準偏差は、左右対称（正規分布）のデータに向く。"],"core":"正規分布する→平均値±標準偏差（SD（standard deviation：標準偏差））。偏っている・外れ値がある→中央値（四分位範囲：IQR（interquartile range：四分位範囲））。カテゴリー→人数（%）。","e":"入院日数・費用・抗体価などは右に裾を引く分布になりやすい（少数の長い人が平均を引き上げる）。\n標準偏差（SD）＝個々のデータのばらつき。標準誤差（SE（standard error：標準誤差））＝平均値の推定のばらつき（SD÷√人数）。ばらつきを示すなら SD。SE は小さく見えるので誤解を招く。\n表1（患者背景）で両方の形が混ざるときは、表の注に「平均値±SD または中央値（IQR）」と書く。","tg":[]},{"id":"orig-a829075b","f":"orig","u":10,"o":53,"lv":1,"q":"2群の平均値を比べる検定で、データが正規分布しないときに使うものはどれか。","ch":["ログランク検定","対応のない t 検定","カイ二乗検定（χ² 検定）","Mann-Whitney U 検定"],"a":3,"cx":["ログランク検定は生存曲線（イベントまでの時間）の比較。","t 検定は正規分布を前提とする。","カイ二乗検定は割合（人数）の比較。",""],"core":"連続量の2群：正規分布→t 検定／正規分布しない→Mann-Whitney U 検定。割合の2群：カイ二乗検定（期待度数が5未満のセルがあれば Fisher の正確検定）。時間→ログランク検定・Cox 回帰。","e":"同じ人の前後比較（対応あり）：正規→対応のある t 検定／正規でない→Wilcoxon の符号付き順位検定。\n3群以上：一元配置分散分析（正規）／Kruskal-Wallis 検定（正規でない）。何度も2群ずつ比べると「たまたま有意」が増える（多重比較）ので補正する。","tg":[],"fig":["stattest"]},{"id":"orig-39e54fe5","f":"orig","u":10,"o":54,"lv":1,"q":"P 値の正しい解釈はどれか。","ch":["P＜0.05 なら臨床的にも重要な差である確率","今回の結果から計算される、差が本当にある確率","治療の効果がどれくらい大きいかを表す値","差がないと仮定したとき、今回以上の差が偶然出る確率"],"a":3,"cx":["統計学的に有意でも、差が小さく臨床的に意味がないことがある。","P 値は「差がある確率」ではない。","効果の大きさは差・比と信頼区間で示す。",""],"core":"P 値＝「差がない」と仮定したときに、今回以上の差が偶然出る確率。小さいほど偶然では説明しにくい。効果の大きさと精度は 95% 信頼区間で示す。","e":"論文では P 値だけでなく「差（または比）と 95% CI（信頼区間）」を書く。例：「改善率の差 15%（95% CI 5〜25%、P＝0.003）」。\nP＝0.06 を「差がない」と書くのは誤り：「統計学的に有意な差は認めなかった」が正しい（差がないことの証明ではない）。\n人数が多いと、臨床的に意味のない小さな差でも P が小さくなる。","tg":[],"fig":["ci"]},{"id":"orig-1bb0e61d","f":"orig","u":10,"o":55,"lv":2,"q":"あるハザード比が 0.70（95% 信頼区間 0.55〜0.89）と報告された。正しい解釈はどれか。","ch":["信頼区間が0をまたがないので有意である","信頼区間の幅が広いので結果は必ず誤りである","ハザード比が1より小さいので有意差はない","信頼区間が1をまたがないので、有意に低い"],"a":3,"cx":["比（ハザード比・オッズ比・リスク比）の「差なし」は1。0 は差（引き算）のときの基準。","幅の広さは精度の低さ（人数が少ない等）を表すが、誤りという意味ではない。","1より小さい＝リスクが低い方向。区間が1を含まなければ有意。",""],"core":"比の指標は「1」、差の指標は「0」が差なし。95% 信頼区間がそれをまたがなければ P＜0.05 に対応する。区間の幅＝推定の精度。","e":"ハザード比 0.70 ＝ そのイベントの起こりやすさが約30%低い、と読める。\nフォレストプロット（森の図）では、各研究や各サブグループの点と横線（CI（confidence interval：信頼区間））が、縦線（1）をまたぐかを見る。","tg":[],"fig":["ci"]},{"id":"orig-f2339570","f":"orig","u":10,"o":56,"lv":2,"q":"研究を始める前に必要な人数（サンプルサイズ）を計算する理由として正しいものはどれか。","ch":["人数が多いほど P 値が必ず大きくなるため","本当にある差を見逃す確率を一定以下にするため","結果を見ながら後から人数を自由に増減するため","計算しておけば結果が有意になることが保証されるため"],"a":1,"cx":["人数が多いほど P 値は小さくなりやすい。","","結果を見ながら人数を増減すると、偶然の有意が増える。","有意になる保証はない。"],"core":"サンプルサイズは、期待する差・ばらつき・α（ふつう 0.05）・検出力（ふつう 80〜90%）から事前に計算する。人数が足りないと、差があっても有意にならない（第2種の過誤：β）。","e":"第1種の過誤（α）＝本当は差がないのに「差あり」とする誤り。第2種の過誤（β）＝本当は差があるのに見逃す誤り。検出力＝1−β。\n後ろ向き研究で人数を計算していないときは、限界として「人数が少なく、差を検出する力が不十分だった可能性」を書く。","tg":[]},{"id":"orig-f1255e73","f":"orig","u":10,"o":57,"lv":2,"q":"生存時間（再発までの期間など）の解析として最も適切な組み合わせはどれか。","ch":["円グラフ、カイ二乗検定、ピアソンの相関係数","Kaplan-Meier 曲線、ログランク検定、Cox 回帰","棒グラフ、対応のない t 検定、重回帰分析","散布図、Mann-Whitney U 検定、ROC（receiver operating characteristic：受信者動作特性） 曲線"],"a":1,"cx":["円グラフ・カイ二乗検定は割合。時間の情報を失う。","","t 検定や重回帰は、途中で追えなくなった人（打ち切り）を扱えない。","ROC 曲線は診断の性能の評価。"],"core":"イベントまでの時間＝Kaplan-Meier 曲線（図）＋ログランク検定（2群の比較）＋Cox 比例ハザードモデル（調整したハザード比）。追跡が途中で切れた人は「打ち切り」として扱える。","e":"Kaplan-Meier 曲線の下には、各時点の「at risk の人数（number at risk）」を入れる（後半は人数が少なく曲線の信頼性が低いことが分かる）。\n打ち切りの印（縦の小さな線）も入れる。","tg":[],"fig":["km"]},{"id":"orig-831c31d2","f":"orig","u":10,"o":58,"lv":1,"q":"診断検査の「感度」の定義として正しいものはどれか。","ch":["検査が陽性の人のうち、本当に病気がある割合","病気がない人のうち、検査が陰性になる割合","病気がある人のうち、検査が陽性になる割合","検査が陰性の人のうち、本当に病気がない割合"],"a":2,"cx":["これは陽性的中率。病気の多さ（有病率）で変わる。","これは特異度。","","これは陰性的中率。"],"core":"感度＝病気ありのうち陽性。特異度＝病気なしのうち陰性。感度が高い検査は「陰性なら除外」に、特異度が高い検査は「陽性なら確定」に使える。","e":"覚え方（英語の頭文字）：SnNout（Sensitivity が高い検査で Negative なら rule out）、SpPin（Specificity が高い検査で Positive なら rule in）。\n陽性的中率は、同じ検査でも病気の多い集団（専門外来）では高く、少ない集団（健診）では低くなる。\n診断精度の研究は STARD（Standards for Reporting Diagnostic accuracy studies：診断精度研究の報告ガイドライン） に沿って書き、ROC（receiver operating characteristic：受信者動作特性） 曲線と AUC（曲線下面積）で性能を示すことが多い。","tg":[],"mt":["diag"]},{"id":"orig-957f2142","f":"orig","u":10,"o":59,"lv":2,"q":"再発率が対照群 20%、治療群 10% だった。治療必要数（NNT（number needed to treat：治療必要数））はいくつか。","ch":["50","5","10","2"],"a":2,"cx":["50 は 1/0.02 で、桁を誤っている。","5 は 1/0.2（対照群の率）で計算した誤り。","","2 は相対リスク減少（50%）と混同している。"],"core":"NNT＝1 ÷ 絶対リスク減少。20%−10%＝10%（0.1）→ 1/0.1＝10。10人治療すると1人の再発を防げる。","e":"同じ結果でも言い方で印象が変わる：\n・相対リスク減少＝(20−10)/20＝50%（「再発が半分に」）\n・絶対リスク減少＝10%\n・NNT＝10\n論文では相対的な指標だけでなく、絶対的な差（または NNT）も示すと誤解が少ない。","tg":[]},{"id":"orig-732b7d34","f":"orig","u":10,"o":60,"lv":2,"q":"ランダム化比較試験の解析で、割り付けられた群のとおりに全員を解析する方法はどれか。","ch":["効果があった人だけを選んだ解析","プロトコル遵守例だけの解析（per-protocol）","ITT（intention-to-treat：割り付けたとおりに解析） 解析（intention-to-treat）","治療を最後まで受けた人だけの解析"],"a":2,"cx":["効果で選ぶと結果がゆがむ（不適切）。","per-protocol 解析は、計画どおり治療を受けた人だけ。脱落の偏りが入りやすい。","","治療を最後まで受けた人は、もともと経過がよい人に偏りやすい。"],"core":"ITT 解析＝割り付けたとおりに解析（途中でやめた人も元の群で）。ランダム化で作った「群の比べやすさ」を保つため、主解析は ITT が基本。","e":"盲検化：患者・医師・評価者が、どちらの群か分からないようにする（二重盲検など）。主観的な評価（かゆみ・皮疹のスコア）では特に大切。\n脱落・欠測の数と理由は、CONSORT（Consolidated Standards of Reporting Trials：ランダム化比較試験の報告ガイドライン） のフローチャートで群ごとに示す。","tg":[]},{"id":"orig-aed73299","f":"orig","u":10,"o":61,"lv":2,"q":"観察研究で「相関がある」という結果の書き方として最も適切なのはどれか。","ch":["相関がなければ、関係は一切ないと断定する","「関連が認められた」と書き、因果関係とは区別する","相関があったので「原因である」と結論する","相関係数が小さくても P が小さければ「強い関連」と書く"],"a":1,"cx":["直線的な相関がなくても、別の形の関係があることがある。","","観察研究の相関だけでは因果は言えない（交絡・逆の因果の可能性）。","相関の強さは相関係数の大きさで表す。P 値は強さを表さない。"],"core":"観察研究では「関連（association）」と書き、「原因（cause）」とは書かない。因果を言うには、時間の前後・用量反応・再現性・しくみなど複数の根拠が必要。","e":"英語でも “was associated with” を使い、“caused” や “led to” は避ける。\n逆の因果の例：皮膚炎の重い人ほど保湿剤をよく使う → 「保湿剤が皮膚炎を悪化させる」ではない。","tg":[]},{"id":"orig-887db892","f":"orig","u":10,"o":62,"lv":2,"q":"多変量のロジスティック回帰で、調整する因子（説明変数）の数について一般的な目安はどれか。","ch":["イベントの数に比べて因子が多すぎないようにする","P 値が小さい因子だけを、何十個でも入れてよい","因子は多ければ多いほど、結果が正確になる","対象者の人数と同じ数まで、因子を入れてよい"],"a":0,"cx":["","機械的に P 値で選ぶ方法は、偶然の関連を拾いやすい。","因子が多すぎると、たまたまのデータに合わせすぎ（過学習）になる。","対象者と同じ数の因子は推定ができなくなる。"],"core":"目安：イベント10件あたり因子1つ程度（events per variable：EPV 10）。調整する因子は、結果に影響すると考えられるもの（既報・臨床的な理由）を事前に選ぶ。","e":"この目安は絶対ではないが、少ないイベントで多くの因子を入れると、オッズ比が不安定（信頼区間が極端に広い）になる。\n方法に「調整した因子とその選び方」を書く。","tg":[]},{"id":"orig-028e78bb","f":"orig","u":11,"o":63,"lv":1,"q":"研究の種類と報告ガイドラインの組み合わせで正しいものはどれか。","ch":["症例報告 ― PRISMA（Preferred Reporting Items for Systematic reviews and Meta-Analyses：系統的レビューの報告ガイドライン）","ランダム化比較試験 ― CARE（CAse REport：症例報告の報告ガイドライン）","系統的レビュー ― STARD（Standards for Reporting Diagnostic accuracy studies：診断精度研究の報告ガイドライン）","観察研究 ― STROBE（Strengthening the Reporting of Observational Studies in Epidemiology：観察研究の報告ガイドライン）"],"a":3,"cx":["症例報告は CARE（CAse REport：症例報告の報告ガイドライン）。PRISMA は系統的レビュー。","ランダム化比較試験は CONSORT（Consolidated Standards of Reporting Trials：ランダム化比較試験の報告ガイドライン）。CARE は症例報告。","系統的レビューは PRISMA（Preferred Reporting Items for Systematic reviews and Meta-Analyses：系統的レビューの報告ガイドライン）。STARD は診断精度研究。",""],"core":"RCT（randomized controlled trial：ランダム化比較試験）＝CONSORT（Consolidated Standards of Reporting Trials：ランダム化比較試験の報告ガイドライン）、観察研究＝STROBE、系統的レビュー＝PRISMA、診断精度＝STARD、症例報告＝CARE、予測モデル＝TRIPOD（Transparent Reporting of a multivariable prediction model for Individual Prognosis Or Diagnosis：予測モデル研究の報告ガイドライン）、試験計画書＝SPIRIT（Standard Protocol Items: Recommendations for Interventional Trials：試験計画書の報告ガイドライン）、質的研究＝COREQ（COnsolidated criteria for REporting Qualitative research：質的研究の報告ガイドライン）。EQUATOR（Enhancing the QUAlity and Transparency Of health Research：報告ガイドラインをまとめたサイト） Network のサイトにまとまっている。","e":"報告ガイドラインは「論文に何を書くべきか」のチェックリスト。多くの雑誌が投稿時にチェックリストの提出を求める。\n書く前に読むと、方法・結果に書き落としがなくなる（例：STROBE なら「対象の選び方」「欠測の扱い」「交絡の調整」）。\nCONSORT は 2025 年版が公表された（それ以前は 2010 年版）。ガイドラインは改訂されるので、投稿時に最新版を確認する。","tg":["gl"],"mt":["guidelines"]},{"id":"orig-17f6a0ff","f":"orig","u":11,"o":64,"lv":2,"q":"臨床試験の登録について正しいものはどれか。","ch":["結果が出てから登録すれば問題なく論文にできる","介入研究は最初の患者の登録前に試験を登録する","観察研究も含め、登録しないと必ず論文にできない","有意な結果が出た試験だけを選んで登録すればよい"],"a":1,"cx":["ICMJE（医学雑誌編集者国際委員会）は、開始前の登録を掲載の条件にしている。","","観察研究の登録は推奨されることはあるが、介入試験ほど一律の条件ではない。","結果を選んで登録すると出版バイアスになる。登録の目的はそれを防ぐこと。"],"core":"介入研究（臨床試験）は開始前に登録（日本：jRCT（Japan Registry of Clinical Trials：臨床研究実施計画・研究概要公開システム）、UMIN-CTR（UMIN 臨床試験登録システム） など）。登録番号を抄録と本文に書く。結果の良し悪しにかかわらず公表されるようにするため。","e":"日本の臨床研究法の対象となる研究（未承認・適応外の医薬品の臨床研究、製薬企業から資金を受けた医薬品の臨床研究など）は jRCT への登録が義務。\n主要評価項目を登録時と変えて報告すると（outcome switching）、査読や読者に気づかれ信頼を失う。","tg":["gl"]},{"id":"orig-4d2e0159","f":"orig","u":11,"o":65,"lv":2,"q":"後ろ向きにカルテを調べる観察研究を始めるときの手続きとして正しいものはどれか。","ch":["カルテは自施設の物なので手続きなしに調べてよい","患者の名前入りの一覧を自宅のパソコンで管理する","計画書を作り、倫理審査の承認後に始める","論文にするときになってから初めて倫理審査を申請する"],"a":2,"cx":["過去のデータでも研究なら「人を対象とする生命科学・医学系研究に関する倫理指針」の対象。","個人情報は施設の決まりに従い、対応表を分けて安全に管理する。","","承認は研究開始前。事後の申請は原則として認められない。"],"core":"研究＝計画書 → 倫理審査の承認 → 開始。既存のカルテ情報を使う研究では、多くの場合、研究の内容を公開して拒否の機会を設ける方法（オプトアウト）で個別の同意に代えられる（倫理審査委員会が判断）。","e":"本文の方法には「本研究は〇〇倫理審査委員会の承認を得て行った（承認番号〇〇）」と書く。同意の取り方（書面・オプトアウト）も書く。\n症例報告と症例集積の境目：施設のルールでは「〇例以上のまとめは研究として倫理審査が必要」と決めていることがある。迷ったら倫理審査の窓口に聞く。","tg":["gl"]},{"id":"orig-32b39de5","f":"orig","u":12,"o":66,"lv":3,"q":"原著論文の序論の最後に置く「目的」の文として最もよいのはどれか。","ch":["本研究では、水疱性類天疱瘡の患者のデータを集めて統計をとってみた","水疱性類天疱瘡は高齢者に多いので、今後ますます重要になると考える","本研究では、類天疱瘡で DPP-4 阻害薬の内服と粘膜病変の関係を検討した","本研究では、水疱性類天疱瘡について気になるいろいろなことを調べた"],"a":2,"cx":["方法の説明で、目的（何を明らかにしたいか）になっていない。","背景の一般論で、目的の文になっていない。","","何を調べたかが分からない。対象・曝露・結果を入れる。"],"core":"目的の文＝対象（P）・曝露/介入（E/I）・結果（O）が入った1文。","e":"DPP-4 阻害薬（グリプチン系の糖尿病薬）と水疱性類天疱瘡の関連は国内外で報告がある。\n序論の流れ：①病気と重要性 ②分かっていること ③分かっていないこと（gap）④だから本研究で〇〇を検討した（目的）。","tg":["cs"]},{"id":"orig-b6f7e617","f":"orig","u":12,"o":67,"lv":3,"q":"結果の書き方として最も適切なものはどれか。","ch":["治療群では再発が少なく、治療が有効であることが明らかになったといえる","再発は治療群 12/60 例（20%）、対照群 21/58 例（36%）（P＝0.048）","再発は治療群で対照群よりも明らかに少なかった（P＜0.05）と考えられる","再発率は治療群で 20.000%、対照群で 36.207% であり差を認めた"],"a":1,"cx":["結果に「有効であることが明らか」と解釈を入れている。さらに1研究で「明らか」は言いすぎ。","","数字（分母・割合）がなく、どれくらい少ないか分からない。P 値は実際の値を書くのがふつう。","桁が多すぎて読みにくい。意味のある桁（整数〜小数1桁）にする。"],"core":"結果＝数字で事実を書く（人数/分母、%、差や比と 95% CI（confidence interval：信頼区間）、P 値の実際の値）。解釈は考察に。","e":"P 値は「P＝0.048」のように実際の値を書き、非常に小さいときは「P＜0.001」。\n割合には分母を付ける（12/60 例）。小さい集団で % だけ書くと誤解を招く。","tg":["cs"]},{"id":"orig-50e20c3e","f":"orig","u":12,"o":68,"lv":3,"q":"原著の考察で「限界（limitation）」の書き方として最も適切なものはどれか。","ch":["本研究の限界は、解析した症例数が多すぎたことである","単施設の後ろ向き研究で、重症度の評価が統一されていない","限界は多数あるが、紙面の都合によりここでは省略する","本研究は十分に計画されており、限界は特にないと考える"],"a":1,"cx":["人数が多いことは通常は限界ではない。","","省略せず、主な限界と、結果への影響の方向を書く。","限界のない研究はない。書かないと査読で必ず指摘される。"],"core":"限界＝①研究デザインの弱点（後ろ向き・単施設・人数）②偏りと交絡の可能性 ③一般化できる範囲。可能なら「結果をどちらの方向に動かしたか」と「それでも言えること」を書く。","e":"限界を書くことは減点ではなく、研究を正しく読んでもらうための情報。\n強み（strength）も1〜2文書く：例「全例で蛍光抗体法により診断を確定している」。","tg":["cs"],"fig":["design"],"mt":["designs"]},{"id":"orig-e6fbd96d","f":"orig","u":12,"o":69,"lv":3,"q":"原著論文の考察の文として最も適切なものはどれか。","ch":["本研究により、DPP-4 阻害薬が粘膜病変を防ぐことが完全に証明された","本研究の結果は有意ではなかったので、DPP-4 阻害薬は粘膜に無関係である","本研究の結果は、DPP-4 阻害薬に関連する例で粘膜病変が少ない可能性を示唆する","本研究の結果から、全ての類天疱瘡で DPP-4 阻害薬を使うべきである"],"a":2,"cx":["1つの観察研究で「完全に証明」は言いすぎ。","有意でないことは「関係がない」ことの証明ではない。","","関連を見ただけで治療の推奨はできない。結果から飛躍している。"],"core":"考察は、デザインに見合った強さで書く。観察研究＝「関連」「示唆」、ランダム化比較試験＝「効果」、有意差なし＝「差を認めなかった」。","e":"強さの順（目安）：suggest（示唆）＜ indicate（示す）＜ demonstrate（実証）＜ prove（証明：医学論文ではほぼ使わない）。","tg":["cs"],"fig":["design"]},{"id":"orig-b7a06907","f":"orig","u":12,"o":70,"lv":3,"q":"方法の「対象」の書き方として最も適切なものはどれか。","ch":["当科に来た乾癬の患者のうち、研究に協力してくれそうな人を何人か選んで対象とした","乾癬の患者で生物学的製剤を使った人を、担当医が思い出せる範囲で集めて対象とした","乾癬の患者をできるだけたくさん集めて、データがそろっている人だけを解析に使った","20XX年1〜12月に当科で乾癬と診断され、生物学的製剤を開始した18歳以上の患者"],"a":3,"cx":["「協力してくれそう」は選択の偏り。基準をはっきり決める。","「思い出せる範囲」は網羅的でない。期間と方法で全例を拾う。","「たくさん」「そろっている人」では基準が分からない。除外の基準として書く。",""],"core":"対象＝期間・場所・選択基準（含める条件）・除外基準。再現できるように書く。","e":"人数の流れ（何人から何人を除外し、何人を解析したか）はフローチャート（図1）で示す。STROBE（Strengthening the Reporting of Observational Studies in Epidemiology：観察研究の報告ガイドライン） の項目。","tg":["cs"]},{"id":"orig-f7374949","f":"orig","u":12,"o":71,"lv":3,"q":"方法の「統計解析」の書き方として最も適切なものはどれか。","ch":["適切な統計手法を用いて解析を行い、その結果から有意差の有無を総合的に判断した","統計の解析は専門家にすべて任せたため、方法の詳細については分からない","統計ソフトを使っていろいろな検定を試し、その中で有意になったものを採用した","連続量は Mann-Whitney U 検定、割合は Fisher の正確検定、P＜0.05 を有意とした"],"a":3,"cx":["「適切な手法」では何をしたか分からない。","著者は方法に責任がある。統計の担当者に確かめて書く。","有意になるまで検定を試すのは不適切（P ハッキング）。",""],"core":"統計解析＝データの種類ごとの検定・調整した因子・有意水準・使ったソフト（名前と版）。","e":"使ったソフトの書き方の例：「解析には EZR（version 1.68）を用いた」「R（version 4.4）を用いた」。","tg":["cs"],"fig":["stattest"]},{"id":"orig-c5cb28e7","f":"orig","u":12,"o":72,"lv":3,"q":"乾癬の治療研究の結果の書き方として最も適切なものはどれか。","ch":["PASI 75 達成率は高く、本剤の高い有効性が明らかとなったといえる","PASI 75 達成率は16週時に 42/60 例（70%）（95% CI（confidence interval：信頼区間） 57〜81%）","ほとんどの患者で PASI がよくなり、満足のいく結果が得られたと考える","PASI 75 達成率は 70.00000% で、これは非常に高い値であった"],"a":1,"cx":["結果に解釈と言いすぎ（明らか）が入っている。","","「ほとんど」「満足」はあいまいで主観。","桁が多すぎ、評価の語（非常に高い）が混ざっている。"],"core":"結果＝時点・分母・割合・信頼区間。解釈は考察。","e":"PASI 75：乾癬の重症度スコア（PASI）が治療前から75%以上改善した割合。","tg":["cs"],"fig":["ci"]},{"id":"orig-585a4e30","f":"orig","u":12,"o":73,"lv":3,"q":"考察の書き方として最も適切なものはどれか（後ろ向きコホート研究）。","ch":["喫煙歴は再発の多さと関連しており、禁煙支援が再発を減らす可能性がある","喫煙者は再発しやすいので、喫煙者には治療をしないほうがよい","喫煙と再発には関連があったが、なぜかは全く分からない","喫煙が再発の原因であることが、本研究によって初めて証明された"],"a":0,"cx":["","関連から治療しないという結論は飛躍で、不適切。","しくみの考察（既報・考えられる理由）を書く。","観察研究で「原因」「証明」は言いすぎ。"],"core":"観察研究の考察＝「関連」と書き、そこから言える範囲（可能性）を示す。交絡の可能性も限界に書く。","e":"書き換えの例：“caused” → “was associated with”、“proves” → “suggests”。","tg":["cs"]},{"id":"orig-b922b336","f":"orig","u":12,"o":74,"lv":3,"q":"序論の書き方として最も適切なものはどれか。","ch":["化膿性汗腺炎について、教科書に書いてあることを最初から順にまとめておく","化膿性汗腺炎は、昔から多くの医師が研究してきた、すでによく知られた病気である","化膿性汗腺炎は痛みを伴う慢性炎症性疾患だが、本邦の実態は十分に分かっていない","化膿性汗腺炎の研究を行ったので、その結果と結論をここで詳しく述べておく"],"a":2,"cx":["序論は教科書のまとめではない。研究の空白まで絞り込む。","よく知られていることだけでは、研究の必要性（空白）が伝わらない。","","序論で結果は書かない。"],"core":"序論＝分かっていること → 分かっていないこと（空白）→ 目的。「しかし〜は分かっていない」が要。","e":"化膿性汗腺炎（hidradenitis suppurativa）：腋窩・鼠径・臀部に痛みを伴う結節・膿瘍・瘻孔をくり返す慢性炎症性疾患。","tg":["cs"],"fig":["funnel"]},{"id":"orig-2f590fd8","f":"orig","u":13,"o":75,"lv":2,"q":"系統的レビュー・メタ解析について正しいものはどれか。","ch":["研究の質は評価せず、すべての研究を同じ重みでまとめる","事前に決めた方法で網羅的に探し、流れを PRISMA（Preferred Reporting Items for Systematic reviews and Meta-Analyses：系統的レビューの報告ガイドライン） で示す","検索したデータベースや検索式は、本文に書かなくてよい","自分の意見に合う論文だけを集めて、まとめればよい"],"a":1,"cx":["研究ごとにバイアスのリスクを評価し、結果の確かさに反映させる。","","検索式とデータベース・検索日は、再現できるように書く。","都合のよい論文だけを集めると、ただの意見になる（選択の偏り）。"],"core":"系統的レビュー＝事前の計画（PROSPERO への登録など）→ 網羅的な検索 → 2人で独立に選ぶ → バイアスの評価 → まとめ（メタ解析）。PRISMA のフローチャートで、何件から何件に絞ったかを示す。","e":"メタ解析の図：フォレストプロット（各研究の効果と信頼区間、全体の推定）。研究間のばらつき（異質性）は I² などで示す。\n出版バイアス（よい結果だけが論文になる）は、ファンネルプロット（漏斗の図）の左右の偏りで調べる。","tg":["gl"],"mt":["guidelines"]},{"id":"lit-a987e890","f":"lit","u":14,"o":76,"lv":1,"q":"英文の医学文献を探すときにまず使うデータベースとして最も適切なのはどれか。","ch":["PubMed","一般の検索エンジンの画像検索","SNS の投稿検索","医中誌Web"],"a":0,"cx":["","画像検索では文献の質も出典も確かめられない。","SNS は文献のデータベースではない。","医中誌Web は和文（日本の雑誌・学会抄録）の文献を探すのに使う。"],"core":"英文＝PubMed（米国国立医学図書館の無料データベース、MEDLINE を含む）。和文＝医中誌Web（有料、施設で契約していることが多い）。系統的レビューでは Embase、Cochrane Library も使う。","e":"症例報告の考察では PubMed と医中誌Web の両方を検索し、検索日と検索語を記録しておく。\nGoogle Scholar は幅広く見つかるが、検索の再現性が低く、系統的な検索の主な手段には向かない。\n和文の症例報告は医中誌Web でしか見つからないことが多い（本邦報告例の表を作るときに必須）。","tg":[]},{"id":"lit-282fed59","f":"lit","u":14,"o":77,"lv":2,"q":"PubMed で「水疱性類天疱瘡」と「DPP-4 阻害薬」の両方に関する文献を探す検索式として正しいものはどれか。","ch":["bullous pemphigoid NOT dipeptidyl peptidase-4 inhibitors","bullous pemphigoid dipeptidyl NOT peptidase-4 inhibitors","bullous pemphigoid OR（odds ratio：オッズ比） dipeptidyl peptidase-4 inhibitors","bullous pemphigoid AND dipeptidyl peptidase-4 inhibitors"],"a":3,"cx":["NOT は後ろの語を含む文献を除く。","NOT の位置が誤りで、意図しない絞り込みになる。","OR はどちらか一方でも含む文献（広がる）。両方を含むのは AND。",""],"core":"AND＝両方を含む（絞る）、OR＝どちらか（広げる。同じ意味の言い換えをまとめる）、NOT＝除く。言い換えは括弧で OR にまとめてから AND でつなぐ。","e":"検索式の例：(bullous pemphigoid[MeSH（Medical Subject Headings：PubMed の統制語、決まった見出し語）] OR \"bullous pemphigoid\") AND (DPP-4 inhibitors OR gliptin OR vildagliptin OR sitagliptin OR linagliptin)\nフレーズは \" \" で囲む。語尾違いは * （例：pemphig*）で拾える。\nMeSH（PubMed の統制語）を使うと、表記ゆれのある文献もまとめて拾える。","tg":[],"fig":["bool"]},{"id":"lit-3e2fcb0e","f":"lit","u":14,"o":78,"lv":2,"q":"PubMed の MeSH（Medical Subject Headings：PubMed の統制語、決まった見出し語） を使う利点として正しいものはどれか。","ch":["MeSH で検索すると、最新の論文が必ず先頭に表示される","別の言い方をした論文も、統一された見出し語で探せる","MeSH は、日本語で書かれた論文を探すための見出し語である","MeSH を使えば、オープンアクセスの論文だけが表示される"],"a":1,"cx":["並び順は MeSH とは関係ない（Best match・新しい順などで変えられる）。","","MeSH は英語の統制語。日本語は医中誌のシソーラス（統制語）を使う。","オープンアクセスかどうかは別の絞り込み（Free full text）。"],"core":"MeSH＝論文ごとに付けられた決まった見出し語。言い換え（例：Stevens-Johnson syndrome と toxic epidermal necrolysis）や表記ゆれを吸収する。ただし最新の論文はまだ MeSH が付いていないので、自由語（テキストの語）と OR（odds ratio：オッズ比） で組み合わせる。","e":"医中誌Web でもシソーラス用語（統制語）とフリーワードを組み合わせる。\n論文タイプの絞り込み：PubMed の Article type で Case Reports、Review、Randomized Controlled Trial などを選べる。","tg":[],"fig":["bool"]},{"id":"lit-1de30ffd","f":"lit","u":14,"o":79,"lv":1,"q":"日本の皮膚科の症例報告（和文）の既報を探すのに最も適したデータベースはどれか。","ch":["医中誌Web","製薬会社の製品紹介ページ","一般向けの医療情報サイト","PubMed だけ"],"a":0,"cx":["","製品紹介は宣伝の性格があり、既報の検索には使えない。","一般向けの情報は学術的な根拠にならない。","PubMed には和文誌の多くや学会抄録が入っていない。"],"core":"和文の論文・学会抄録（会議録）＝医中誌Web（医学中央雑誌刊行会）。「本邦報告例」の表を作るときは必須。英文は PubMed。","e":"医中誌Web の絞り込み：論文の種類（原著論文・会議録除く）、症例報告、年。会議録は内容が短いので、表に入れるかは方針を決めて本文に書く。\n施設で契約していないときは、図書館や医局で使えるか確認する。","tg":[]},{"id":"lit-7c9018a9","f":"lit","u":15,"o":80,"lv":1,"q":"引用のしかたとして最も適切なのはどれか。","ch":["ネット上のまとめ記事を学術的な根拠として引用する","総説に書いてあった内容を、元の論文を読まずに元の論文として引用する","元の論文（一次資料）を読み、その内容を確かめてから引用する","抄録だけ読んで内容を推測し、本文の結果として引用する"],"a":2,"cx":["まとめ記事は根拠として不十分。査読された論文やガイドラインを引く。","孫引きは誤りが伝わる原因になる。元の論文を確かめる。","","抄録だけでは誤解しやすい。本文を読む。"],"core":"引用は一次資料を読んで確かめる。内容は自分の言葉で書き直し（言い換え）、文献番号を付ける。文章をそのまま使うときは引用符で区切って出典を示す。","e":"引用の数は雑誌の上限に合わせる（症例報告で10〜20本程度が多い）。\n古い文献だけでなく、最近5年ほどの文献や最新のガイドラインも入れる。\n生成AI（artificial intelligence：人工知能） が示した文献は実在しないことがある。必ず PubMed で確認してから使う。","tg":[]},{"id":"lit-f1e646f1","f":"lit","u":15,"o":81,"lv":2,"q":"医学雑誌で広く使われる「バンクーバー方式」の文献の書き方について正しいものはどれか。","ch":["本文に出た順に番号を付け、一覧もその順にする","本文中には（著者名、年）を書き、番号は付けない","雑誌名は略さず、必ずすべて書く決まりである","文献一覧は筆頭著者名のアルファベット順に並べる"],"a":0,"cx":["","（著者名、年）を本文に書くのはハーバード方式（APA など）。","バンクーバー方式では雑誌名を NLM の略称（例：J Am Acad Dermatol）で書く。","著者名順に並べるのはハーバード方式など別の方式。"],"core":"バンクーバー方式＝本文に出た順の番号（1, 2, 3…）、文献一覧も番号順。著者は6人まで書き、7人以上なら6人の後に et al.。雑誌名は略称。最終的には投稿先の規定に合わせる。","e":"例（バンクーバー方式）：\nSmith A, Tanaka B, Lee C. Title of the article. J Dermatol. 2024;51:123-30. doi:10.xxxx\n和文誌は独自の書き方（著者は3人まで など）を指定していることが多い。投稿規定の見本をまねる。\n文献管理ソフトを使えば、雑誌ごとの書き方に自動で切り替えられる。","tg":[]},{"id":"lit-d184cf9d","f":"lit","u":15,"o":82,"lv":2,"q":"文献管理ソフト（EndNote、Zotero、Mendeley など）を使う利点として最も適切なのはどれか。","ch":["文献番号と一覧を自動でそろえ、書式も切り替えられる","研究のデータを入れると、論文の本文を自動で書いてくれる","投稿先の雑誌の審査が早く進み、採用されやすくなる","使うだけで、引用した論文の内容が正しいと保証される"],"a":0,"cx":["","本文を書くソフトではない。","採用とは関係ない。","内容の確認は自分で行う必要がある。"],"core":"文献管理ソフト＝文献の保存・PDF の管理・本文への挿入・番号の自動の振り直し・雑誌ごとの書式。順番を入れ替えても番号がずれない。Zotero は無料で使える。","e":"手で番号を付けると、段落を入れ替えたときに番号がずれる誤りが起きやすい。\nPubMed の結果から直接取り込める（DOI（Digital Object Identifier：論文ごとの固有番号） や PMID からも取り込める）。\n共著者と同じソフトを使うと、修正の受け渡しが楽になる。","tg":[]},{"id":"lit-5b859c2f","f":"lit","u":15,"o":83,"lv":2,"q":"インパクトファクター（IF（impact factor：インパクトファクター））について正しいものはどれか。","ch":["個々の論文の重要さを、正確に表す点数である","IF が高い雑誌ほど、症例報告を必ず多く載せている","雑誌の平均的な被引用の指標で、個々の論文の質ではない","IF は著者が自分で申告し、雑誌が決める値である"],"a":2,"cx":["雑誌全体の平均なので、その雑誌の個々の論文の価値とは別。","高 IF 誌には症例報告を載せないものも多い。","","IF は Clarivate 社が引用データから計算して公表する。"],"core":"IF＝ある年に、その雑誌の前2年間の論文が引用された回数 ÷ 前2年間の論文数。雑誌の比較の目安の1つにすぎない。","e":"雑誌選びでは IF より「範囲が合うか」「読んでほしい人が読むか」「審査の速さ・掲載料」を優先する。\n症例報告は引用されにくいため、症例報告を多く載せる雑誌は IF が低めになりやすい。それでも臨床の役に立つ大切な論文である。","tg":[]},{"id":"lit-38627e1a","f":"lit","u":15,"o":84,"lv":2,"q":"オープンアクセス（OA）誌への投稿について正しいものはどれか。","ch":["誰でも無料で読め、著者が掲載料を払うことが多い","掲載料は、採用が決まったあとに必ず無料になる","オープンアクセス誌は、査読をしない決まりになっている","オープンアクセス誌は、すべてハゲタカジャーナルである"],"a":0,"cx":["","掲載料は雑誌ごとに決まっており、採用後に払うのがふつう。","まっとうな OA 誌は通常どおり査読する。","信頼できる OA 誌も多い（JAAD Case Reports など）。OA かどうかと質は別。"],"core":"OA＝読むのが無料、費用は著者の掲載料（APC（article processing charge：掲載料））。投稿前に金額を確認する（数十万円になることもある）。学会員の割引や施設の契約がないかも確かめる。","e":"OA 論文には利用の許可（ライセンス）が付く。CC BY なら、出典を示せば他の人が図を再利用できる。\nプレプリント（査読前の原稿の公開、medRxiv など）を認めるかどうかは雑誌ごとに違う。","tg":[]},{"id":"lit-a5bb64ef","f":"lit","u":16,"o":85,"lv":3,"q":"引用の書き方として最も適切なものはどれか。","ch":["DPP-4 阻害薬は水疱性類天疱瘡の発症との関連が報告されている［1, 2］","DPP-4 阻害薬は類天疱瘡の原因であることが確定している［1］","DPP-4 阻害薬は類天疱瘡を起こすと、どこかで読んだ記憶がある","DPP-4 阻害薬と類天疱瘡の関係はネットで検索すれば誰でも分かる"],"a":0,"cx":["","既報は「関連」。文献の内容を超えて「確定」と書いている。","出典がなく、根拠にならない。","出典を示さず、読者に検索を任せている。"],"core":"引用＝文献の内容を正確に、文献の強さどおりに書き、番号を付ける。","e":"引用した論文が本当にそう言っているか、本文を読んで確かめる（抄録だけで判断しない）。","tg":["cs"]},{"id":"lit-e90a1b87","f":"lit","u":16,"o":86,"lv":3,"q":"検索方法の書き方として最も適切なものはどれか（症例報告の考察）。","ch":["いろいろなデータベースで、関係のありそうな語をたくさん入れて、時間をかけて調べた","検索した結果、似た症例はあまり見当たらなかったので、まれな症例であると考えた","PubMed と医中誌Web で「pemphigoid」「DPP-4」を用い20XX年X月まで検索した","生成AI（artificial intelligence：人工知能） に既報を聞いたところ報告はないと回答されたので、本例を初めての報告とした"],"a":2,"cx":["「いろいろ」「たくさん」では再現できない。","「あまり」では数が分からない。データベースと語を書く。","","生成AI の回答は検索の根拠にならない（文献を作り出すこともある）。"],"core":"検索方法＝データベース・検索語・期間（検索日）。数を表にする。","e":"会議録（学会抄録）を含めたかどうかも書いておく。","tg":["cs"]},{"id":"figtab-52e80d4c","f":"figtab","u":17,"o":87,"lv":1,"q":"論文の表の形として最も一般的なのはどれか。","ch":["線を1本も使わず、空白だけで区切る","横線3本で、縦線を使わない","すべてのマスを縦線と横線で囲む","色の濃い背景を全行に交互に付ける"],"a":1,"cx":["線がないと見出しと中身の境が分からない。","","格子の表は見づらく、多くの雑誌は縦線を使わない形を求める。","濃い色は印刷で読みにくくなる。"],"core":"学術論文の表＝横線3本（上の罫線・見出しの下・表の下）、縦線なし。表題は表の上、略語や記号の説明は表の下（脚注）。","e":"表のコツ：\n・比べたいものを縦に並べる（目は縦に比べやすい）\n・単位は見出しに書く（例：年齢、歳）\n・数字は小数点の位置をそろえる\n・略語は脚注で定義（a, b, c や *, † の記号）\n・Word の表機能で作る（画像にしない。編集部が組版できるように）","tg":[],"fig":["table"]},{"id":"figtab-bb59fbf1","f":"figtab","u":17,"o":88,"lv":2,"q":"原著論文の「表1」に置くことが多い内容はどれか。","ch":["研究費の出どころと金額の内訳","対象者の背景を群ごとに示した表","引用した主な文献の著者と年の一覧","主な結果の P 値だけを並べた表"],"a":1,"cx":["研究費は「研究費・資金」の欄に文章で書く。","","文献は本文の最後の文献一覧に書く。","主な結果は表2以降や図で示す。P 値だけでは効果の大きさが分からない。"],"core":"表1＝患者背景（baseline characteristics）。群ごとに年齢・性別・重症度・併存症・治療歴などを並べ、群が比べられる状態かを読者が判断できるようにする。","e":"ランダム化比較試験の表1では、群の差の P 値を付けないのが推奨（ランダム化の差は偶然であるため。CONSORT（Consolidated Standards of Reporting Trials：ランダム化比較試験の報告ガイドライン） の考え方）。\n観察研究では群の違い（交絡のもと）を示すために表1が特に大事。","tg":[],"fig":["table"]},{"id":"figtab-4214ed6e","f":"figtab","u":17,"o":89,"lv":2,"q":"表の数字の書き方として最も適切なのはどれか。","ch":["同じ列の中で、小数点以下の桁数を行ごとに変える","割合だけを書き、人数（分母）は書かない","意味のある桁にそろえ、割合には分母を付ける","計算ソフトの出した値を小数点以下5桁まで書く"],"a":2,"cx":["同じ列は桁数をそろえると比べやすい。","分母がないと、少ない人数での割合かどうか分からない。","","桁が多すぎると読みにくく、精度があるように誤解される。"],"core":"数字＝意味のある桁（割合は整数〜小数1桁、P 値は2〜3桁）。割合は「12（20%）」や「12/60（20%）」の形で分母を示す。単位は見出しに。","e":"P 値の書き方：P＝0.048、P＜0.001（0.000 とは書かない）。\n平均と SD（standard deviation：標準偏差） は同じ桁数で（72.4 ± 8.9）。","tg":[]},{"id":"figtab-cc367197","f":"figtab","u":18,"o":90,"lv":2,"q":"少人数（各群10人程度）の連続量のデータを2群で比べる図として最も適切なのはどれか。","ch":["一人ひとりの点を打ち、中央値の線を重ねた図","立体（3D）にして見栄えをよくした棒グラフ","各群の割合を色分けして示した円グラフ","各群の平均値だけを示した棒グラフ"],"a":0,"cx":["","3D は値が読みにくく、見た目で大きさが変わって見える。","円グラフは連続量の比較には使えない。","棒グラフは平均だけを示し、分布や外れ値が隠れる。"],"core":"少人数の連続量は、全員の点を見せる（dot plot・箱ひげ図＋点）。棒グラフは「割合・人数」の比較に使う。3D・円グラフは避ける。","e":"グラフの原則：\n・軸に名前と単位を必ず書く\n・棒グラフの縦軸は0から始める（途中から始めると差が大きく見える）\n・色は意味のあるところだけ。赤と緑の組み合わせは色覚の多様性に配慮して避け、形や濃さでも区別できるようにする\n・凡例は図の中、線の近くに直接書くと読みやすい\n・同じ図の中では同じ群に同じ色を使う","tg":[],"mt":["chart"]},{"id":"figtab-43fa4904","f":"figtab","u":18,"o":91,"lv":2,"q":"図を雑誌に提出するときの形式として一般的に正しいものはどれか。","ch":["写真は300 dpi（dots per inch：1インチあたりの点の数、解像度） 以上、線画はさらに高い解像度で出す","スライドの画面をスクリーンショットして貼り付ける","画面で見えれば 72 dpi（dots per inch：1インチあたりの点の数、解像度） の JPEG で十分である","解像度が低い写真は、拡大して大きくすれば使える"],"a":0,"cx":["","スクリーンショットは解像度が低く、文字もつぶれる。","72 dpi は画面用。印刷するとぼやける。","低い解像度を拡大しても細部は戻らない。"],"core":"目安：写真 300 dpi 以上、線画（グラフ）600〜1200 dpi、形式は TIFF・EPS・PDF など。最終的には投稿規定に従う。撮影したときの元の画像を保存しておく。","e":"グラフはベクター形式（PDF・EPS・SVG）で出力すると、拡大しても線や文字がぼやけない。\nカラー印刷に料金がかかる雑誌もある（オンラインはカラー、印刷は白黒、など）。白黒でも区別できる図にしておくと安心。","tg":["gl"]},{"id":"figtab-0d577bb3","f":"figtab","u":18,"o":92,"lv":3,"q":"Kaplan-Meier 曲線を論文に載せるとき、加えると最もよい情報はどれか。","ch":["各時点の at risk の人数","各群の色を5色以上に増やすこと","縦軸の目盛りを取り除いて簡素にすること","曲線を立体的に見せる影の効果"],"a":0,"cx":["","群が2つなら2色で十分。色を増やすと混乱する。","目盛りがないと値が読めない。","影や立体の効果は情報を増やさず、読みにくくする。"],"core":"Kaplan-Meier 曲線＝曲線の下に「at risk の人数」、打ち切りの印、群の名前（直接書き込む）、ハザード比と 95% CI（confidence interval：信頼区間）・P 値。","e":"後半で人数が数人しか残っていないと、曲線の大きな段差は偶然の可能性がある。at risk の人数があれば読者が判断できる。","tg":["cs"],"fig":["km"]},{"id":"figtab-807cb3e0","f":"figtab","u":18,"o":93,"lv":2,"q":"グラフの色の使い方として最も適切なのはどれか。","ch":["赤と緑の2色だけで、2つの群を区別する","すべての線を同じ色にして、凡例も付けない","色に加え、線の種類や点の形でも群を区別する","群ごとに、よく似た淡い色を何色も使い分ける"],"a":2,"cx":["赤と緑は、色覚の多様性により区別しにくい人がいる。","区別も凡例もなければ、どの線がどの群か分からない。","","似た淡い色は、印刷やプロジェクターで区別できなくなる。"],"core":"カラーユニバーサルデザイン：青とオレンジなど区別しやすい組み合わせ、色＋形（実線と破線・丸と三角）、白黒で印刷しても分かるか確認。","e":"日本人男性のおよそ20人に1人は、赤と緑の区別がしにくい色覚の特性がある。\n凡例は図の外に離して置くより、線の端に直接名前を書くと目の往復が減る。","tg":[]},{"id":"figtab-a684f5f0","f":"figtab","u":19,"o":94,"lv":3,"q":"「2群の再発率を比べた棒グラフで、縦軸が 30% から始まっている」。直し方として最もよいのはどれか。","ch":["縦軸の目盛りを消して、棒の高さの違いだけを見せる","縦軸を 0% から始め、各群の分母と割合を棒の上に書く","棒グラフを立体にして、奥行きで差が分かるようにする","差を目立たせるため、縦軸を 35% からに変えて強調する"],"a":1,"cx":["目盛りがないと値が分からない。","","立体は値が読みにくい。","途中から始めると、小さな差が大きく見えて誤解を招く。"],"core":"棒グラフの縦軸は 0 から。差を正確に見せる。割合には分母を添える。","e":"折れ線グラフ（変化を見せる図）は、必ずしも 0 から始めなくてよいが、そのことが分かるように軸を示す。","tg":["cs"],"mt":["chart"]},{"id":"figtab-dfc051f5","f":"figtab","u":19,"o":95,"lv":3,"q":"病理写真の図の説明の直し方として最もよいのはどれか。元：「図2　病理（×200）」","ch":["図2　病理（×400）。倍率を上げて、より詳しく見えるように撮影し直した","図2　病理組織像（HE 染色）。真皮に類上皮細胞肉芽腫（スケールバー＝100 µm）","図2　病理組織像（×200）。きれいに染まっていて、所見がとてもよく分かる","図2　病理。所見については、本文の病理組織学的所見の項を参照のこと"],"a":1,"cx":["倍率を変えても所見が書かれていない。倍率表記は拡大縮小でずれる。","","評価の語だけで、所見も染色名もない。","図の説明だけで分かるように書く。本文参照では独り立ちしない。"],"core":"図の説明＝何の図・染色名・所見・スケールバー・矢印の意味。","e":"サルコイドーシスの病理：乾酪壊死を伴わない類上皮細胞肉芽腫（周りのリンパ球が少ない「裸の肉芽腫」）。","tg":["cs"],"fig":["patho"]},{"id":"figtab-623fbc5a","f":"figtab","u":19,"o":96,"lv":3,"q":"表の直し方として最もよいのはどれか。元：「全マスを罫線で囲み、各行の色を変え、年齢は 72.4583 歳のように表示」","ch":["表は読みにくいので、すべての数字を文章にして本文に書き直す","年齢の桁は正確さを示すため、小数点以下5桁のまま残しておく","横線3本にして縦線と色をなくし、年齢は 72.5 ± 8.9 と桁をそろえる","罫線はそのままにして、行の色をさらに鮮やかにして見やすくする"],"a":2,"cx":["比べる数字は表のほうが読みやすい。文章に全部書くと長くなる。","意味のない桁は誤解を招く。","","格子と色は読みにくく、多くの雑誌の形式に合わない。"],"core":"表＝横線3本・縦線なし・意味のある桁・単位は見出し・略語は脚注。","e":"平均±SD（standard deviation：標準偏差） は同じ桁数で書く（72.5 ± 8.9）。","tg":["cs"],"fig":["table"]},{"id":"write-b43bdb03","f":"write","u":20,"o":97,"lv":1,"q":"読みやすい論文の文章の原則として正しいものはどれか。","ch":["同じものを指す言葉を文ごとに言い換える","主語は省いたほうが格調が高い","内容が多いほど1文を長くつなげる","1つの文には1つのことだけを書く"],"a":3,"cx":["論文では同じものは同じ言葉で書く（言い換えると別のものと誤解される）。","主語を省くと、誰が・何がをしたのかが分からなくなる。","長い文は主語と述語が離れて誤解を生む。短く切る。",""],"core":"一文一義（1文に1つの内容）。1文はおよそ60字以内を目安に。主語と述語を近づけ、同じものは同じ言葉で書く。文末は「である」調にそろえる。","e":"直す例：\n×「患者は2週間前から発熱があり近医を受診し抗菌薬を処方されたが改善せず皮疹も出現したため当科を紹介された。」\n○「2週間前から発熱があり、近医で抗菌薬を処方された。改善せず、皮疹も出現したため、当科を紹介された。」\n「〜と思われる」の多用は自信のなさに見える。根拠があれば「〜と考えられる」。\n数字・単位は半角（5 mm、37.5℃）、略語は初めて出るところでフルスペル。","tg":[]},{"id":"write-acf00bfe","f":"write","u":20,"o":98,"lv":3,"q":"次のうち、論文の文章として最も適切なものはどれか。","ch":["プレドニゾロン 0.5 mg/kg/日を開始し、2週後に水疱の新生は止まった","ステロイドの内服を開始したところ、様々な所見が改善傾向を示すに至った","プレドニンをいっぱい飲んでもらったところ、だいぶ良くなった感じであった","ステロイドを結構な量で始めたら、割とすぐに水ぶくれが出なくなった"],"a":0,"cx":["","何が・どれくらいで・どう変わったかが分からない。","商品名ではなく一般名で書き、量を数字で示す。「感じ」は主観。","「結構な量」「割とすぐ」は量と時間が分からない。話し言葉も避ける。"],"core":"薬は一般名・量・投与経路・期間を数字で。変化は「何が・いつ・どれだけ」。話し言葉（結構・割と・だいぶ）を使わない。","e":"プレドニゾロン（プレドニン）。論文では一般名で書き、必要なら初出で商品名を（）で示す（雑誌の規定に従う）。\n「改善傾向を示すに至った」のような回りくどい言い方は「改善した」でよい。","tg":["cs"]},{"id":"write-399a2491","f":"write","u":20,"o":99,"lv":1,"q":"論文の用語の使い方として最も適切なのはどれか。","ch":["和文の論文でも、専門用語はすべて英語のまま書いておく","単調にならないよう、同じものを毎回別の言葉で言い換える","略語は一般的なので、定義せずに最初から使ってよい","同じものは同じ用語で書き、略語は初出でフルスペル"],"a":3,"cx":["和文誌では日本語の用語を使い、必要なら初出で英語を（）で添える。","言い換えると、別のものを指していると誤解される。","略語は分野で意味が違うことがある（例：AD はアトピー性皮膚炎にもアルツハイマー病にもなる）。初出で定義する。",""],"core":"用語は統一（「皮疹」と書いたら途中で「発疹」「病変」に変えない）。略語は初出で「アトピー性皮膚炎（atopic dermatitis：AD）」。和文の用語は日本皮膚科学会の用語集などで確かめる。","e":"よく混ざる例：「紅斑」と「発赤」、「びらん」と「潰瘍」（深さが違う）、「丘疹」と「結節」（大きさが違う）。意味の違う語は使い分け、同じ意味の語は1つにそろえる。\n抄録・本文・図の説明は、それぞれで略語を定義し直す雑誌が多い。","tg":[]},{"id":"write-eb7abd7a","f":"write","u":21,"o":100,"lv":2,"q":"英文の論文で動詞の時制の使い方として一般的に正しいものはどれか。","ch":["結果は臨場感を出すため現在進行形で書く","自分の方法と結果は過去形、確立した事実は現在形","方法は未来形、結果と考察は現在形で書く","読みやすさのため、すべての文を現在形で書く"],"a":1,"cx":["進行形は論文ではほとんど使わない。","","未来形は研究計画書（プロトコル）の書き方。","すべて現在形だと、自分の結果が一般的な事実のように読める。"],"core":"方法・結果（自分がしたこと・見たこと）＝過去形：\"We enrolled 120 patients.\" \"The rash resolved within 2 weeks.\" 一般的な事実・図表の説明＝現在形：\"Bullous pemphigoid is the most common autoimmune blistering disease.\" \"Table 1 shows ...\"","e":"症例の記載も過去形：\"A 72-year-old man presented with ...\"\n考察で自分の結果を解釈するときは現在形も使う：\"These findings suggest that ...\"\n能動態（We performed ...）は明快で、多くの雑誌が推奨している。受動態だけで書くと主語が分かりにくい。","tg":[]},{"id":"write-cfdc75b5","f":"write","u":21,"o":101,"lv":2,"q":"英語が母語でない著者が英文論文を仕上げるときに最も適切な方法はどれか。","ch":["英文校正を受け、内容は著者全員で確認する","英語の誤りは査読者が直してくれるので気にしない","自動翻訳した文を、確認せずにそのまま投稿する","似たテーマの論文の文章をそのまま並べてつなぐ"],"a":0,"cx":["","英語が読みにくいと、内容を評価される前に不採用になりやすい。","自動翻訳は専門用語や意味の取り違えがある。必ず自分で確かめる。","他人の文章をそのまま使うのは盗用（剽窃）。表現を学ぶのはよいが、文章は自分で書く。"],"core":"英文は「自分で書く → 翻訳・AI（artificial intelligence：人工知能） ツールや英文校正で磨く → 著者が内容を確かめる」。どの道具を使っても、内容の責任は著者にある。生成AI を使ったら、雑誌の規定に従い使ったことを書く。","e":"使える型の表現（自分の内容に合わせて使う）：\n\"To our knowledge, this is the first report of ...\"（控えめに）\n\"These findings suggest that ...\"\n\"This study has several limitations.\"\n\"Further studies are needed to ...\"\n英文校正の証明書を求める雑誌もある。","tg":["ai"]},{"id":"write-93c20305","f":"write","u":21,"o":102,"lv":3,"q":"英文の症例の記載として最も適切なものはどれか。","ch":["The patient is very interesting because blisters are on trunk.","A 72-year-old man presents with tense blisters on the trunk now.","A 72-year-old man presented with tense blisters on the trunk.","We will describe a man who is having blisters on his trunk."],"a":2,"cx":["「interesting」は評価の語で、冠詞も欠けている。","症例の経過は過去形。現在形は一般的な事実に使う。","","未来形・進行形は症例の記載に使わない。"],"core":"症例・方法・結果＝過去形。“presented with”（〜を主訴に受診した）は症例報告の定番。","e":"定番の表現：\n・presented with ～（〜で受診した）\n・was referred to our department for ～（〜のため当科を紹介された）\n・Physical examination revealed ～（診察で〜を認めた）\n・Histopathological examination showed ～（病理組織学的に〜を認めた）\n・The lesions resolved within 4 weeks.（4週以内に消退した）","tg":["cs"]},{"id":"write-9d1d2685","f":"write","u":22,"o":103,"lv":1,"q":"投稿時のカバーレター（編集者への手紙）に書く内容として最も適切なのはどれか。","ch":["他の雑誌で不採用になった経緯と査読者への詳しい不満","要点と新しさ、雑誌に合う理由、二重投稿でないこと","採用してほしいという個人的なお願いと自己紹介だけ","論文の本文と図表の説明をすべて貼り付けた長い文章"],"a":1,"cx":["不満を書くのは不適切。","","中身（新しさ・雑誌との合い方）を伝える。","カバーレターは1ページ程度。本文の貼り付けは不要。"],"core":"カバーレター＝①論文の題名と種類 ②要点と新しさ（2〜3文）③その雑誌の読者に役立つ理由 ④他誌に投稿中でないこと・全著者が同意していること・利益相反 ⑤同意書・倫理審査の有無。","e":"編集者は最初にカバーレターと抄録で、査読に回すかを判断する（範囲外なら desk reject）。\n推薦する査読者や避けてほしい査読者を書ける雑誌もある。","tg":["gl"],"fig":["review"]},{"id":"write-e14baeaa","f":"write","u":22,"o":104,"lv":2,"q":"査読者のコメントへの回答（response letter）の書き方として最も適切なのはどれか。","ch":["査読者の理解不足を指摘して、強い言葉で反論する","同意できないコメントには返事をせずに無視する","直した箇所は示さず「すべて修
