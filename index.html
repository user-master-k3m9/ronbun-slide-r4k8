正しました」と1行だけ書く","コメントごとに感謝し、直した内容と場所を示す"],"a":3,"cx":["感情的な反論は逆効果。礼儀正しく根拠で答える。","返事をしないと再度指摘されたり不採用になったりする。同意できなければ根拠を示して丁寧に説明する。","どこをどう直したか分からないと、確認できない。",""],"core":"回答は1つずつ：コメントを引用 → 感謝 → 回答（直した内容）→ 本文の場所（ページ・行）。本文の修正は色や修正履歴で分かるようにする。反論するときは文献やデータで丁寧に。","e":"例：\nComment 1: \"The authors should describe ...\"\nResponse: Thank you for this helpful comment. We have added ... (page 5, lines 10–14).\n大きな修正（major revision）でも、すべてに答えれば採用されることが多い。期限を守る。\n不採用でも査読コメントは宝物。直して次の雑誌に投稿する。","tg":[],"fig":["review"]},{"id":"write-5980c11b","f":"write","u":22,"o":105,"lv":2,"q":"採用後に届く校正刷り（proof）の確認として正しいものはどれか。","ch":["新しく分かった経過を加えて、本文を大きく書き直す","共著者には知らせず、筆頭著者だけで判断して返す","期限は目安なので、数週間後にまとめて返事をする","誤字や組版の誤りを期限内に直し、内容は足さない"],"a":3,"cx":["校正の段階で内容を加えるのは原則不可（再審査が必要になる）。","共著者にも確認してもらうのが望ましい。","期限（数日のことが多い）を過ぎると、そのまま掲載されることがある。",""],"core":"校正刷り＝組版の誤り・誤字・数字・図の向きや色・著者名と所属のつづりを確認する。内容の追加や書き直しはしない。期限を守る。","e":"とくに見るところ：著者名のローマ字・所属、数値と単位、薬の名前、図の番号と説明の対応、表のずれ、文献番号。\n著作権の譲渡（またはライセンスの選択）の手続きもこの時期にあることが多い。","tg":[]},{"id":"write-4325c14b","f":"write","u":23,"o":106,"lv":3,"q":"次の文の直し方として最もよいのはどれか。元：「患者は皮疹が出現し近医で外用薬を処方されたが改善せず発熱も出現したため精査加療目的に当科を紹介され入院となった。」","ch":["皮疹や発熱などいろいろあって、最終的には当科に入院することになった","皮疹が出現し、近医で外用薬を処方された。改善せず発熱も出たため、当科に入院した","患者は近医で処方された外用薬が効かなかったことが原因で当科に入院した","患者は皮疹が出現し、近医で外用薬を処方されたが、改善せず、発熱も出現し、入院となった"],"a":1,"cx":["「いろいろ」で経過が分からなくなった。","","「外用薬が効かなかったことが原因」は意味が変わっている。","読点を足しただけで、長い1文のまま。"],"core":"長い文は2〜3文に切る（一文一義）。意味は変えない。","e":"目安：1文60字程度まで。「〜が、〜し、〜ため、〜」と続いたら切りどき。","tg":["cs"]},{"id":"write-b4c2f2ca","f":"write","u":23,"o":107,"lv":3,"q":"用語の使い方を直すとき、最もよいのはどれか。元：「皮疹は…。発疹は…。病変は…。」（同じものを指している）","ch":["英語の rash に統一し、日本語は使わない","最初に決めた「皮疹」に統一する","読み手が飽きないよう、そのまま言い換えを続ける","段落ごとに「皮疹」「発疹」「病変」を交互に使う"],"a":1,"cx":["和文誌では日本語の用語で書く。","","論文では言い換えると別のものと誤解される。","交互に使っても同じ問題。"],"core":"同じものは同じ語。意味が違う語（紅斑・紫斑・丘疹など）は正しく使い分ける。","e":"書き終えたら検索機能で用語を拾い、ゆれがないか確かめると早い。","tg":["cs"]},{"id":"write-967235e9","f":"write","u":23,"o":108,"lv":3,"q":"英文の考察の1文として最も適切なものはどれか。","ch":["These findings suggest that dupilumab may be associated with facial erythema.","These findings clearly prove that dupilumab always causes facial erythema in patients.","We think that maybe dupilumab is possibly causing some kind of erythema in some patients.","Dupilumab caused facial erythema in all patients with atopic dermatitis in the world."],"a":0,"cx":["","1例・1研究で “clearly prove” “always” は言いすぎ。","あいまいな語（maybe, possibly, some kind of）を重ねすぎ。","根拠を大きく超えた一般化。"],"core":"英文の控えめな表現は “suggest”“may”“be associated with” を1つずつ使う。重ねすぎもあいまいになる。","e":"強さの目安：may（可能性）＜ suggest（示唆）＜ indicate（示す）＜ demonstrate（実証）。","tg":["cs"]},{"id":"write-de91d719","f":"write","u":23,"o":109,"lv":3,"q":"査読コメントへの回答の書き方として最も適切なものはどれか。コメント：「対照群の選び方を説明してください」","ch":["We do not agree with the reviewer and think this comment is not necessary at all.","The selection of controls is obvious to experts, so we did not change the manuscript.","Revised as suggested. All changes are somewhere in the revised manuscript.","Thank you. We have added a description of control selection (page 6, lines 3–8)."],"a":3,"cx":["根拠なく同意しないのは不適切。反論するなら丁寧に理由を示す。","「明らか」と言って直さないのは、査読者の理解を得られない。","1語では何をどう直したか分からない。",""],"core":"回答＝感謝 → 何をしたか → 本文の場所（ページ・行）。","e":"反論するときの型：“We appreciate this suggestion. However, we believe that ... because ... We have added a sentence to clarify this point (page X, lines Y–Z).”","tg":["cs"],"fig":["review"]},{"id":"write-19b64ac8","f":"write","u":23,"o":110,"lv":3,"q":"カバーレターの1文として最も適切なものはどれか。","ch":["This is a very interesting and extremely rare case, so we hope you will accept our paper.","This case shows that BP should be considered even when NC16a antibodies are negative.","This paper was rejected by another journal, but we still think that it is a good paper.","We hope that you will publish our paper because all of the authors worked very hard on it."],"a":1,"cx":["評価の語とお願いだけでは、新しさが伝わらない。","","他誌の不採用を書く必要はない。","努力は採用の理由にならない。"],"core":"カバーレター＝何が新しく、読者に何の役に立つかを1〜2文で。","e":"カバーレターにはほかに、二重投稿でないこと・全著者の同意・利益相反・同意書の有無を書く。","tg":["cs"],"fig":["review"]},{"id":"ethics-935e875c","f":"ethics","u":24,"o":111,"lv":1,"q":"ICMJE（International Committee of Medical Journal Editors：医学雑誌編集者国際委員会） の著者資格（authorship）について正しいものはどれか。","ch":["研究への貢献・執筆・最終承認・責任の4条件すべてを満たす人","データを集めただけの人も、必ず筆頭著者として載せる","研究費を出した人は、全員を著者にしなければならない","診療科の部長であれば、研究に関わらなくても著者になれる"],"a":0,"cx":["","データ収集だけで4条件を満たさない人は、謝辞に名前を書く。","研究費の提供だけでは著者にならない（謝辞や資金の欄に書く）。","関わっていない上司を入れるのはギフト・オーサーシップで不適切。"],"core":"ICMJE の4条件：①構想・デザイン、またはデータの取得・解析・解釈への十分な貢献 ②原稿の執筆または重要な見直し ③最終稿の承認 ④論文のすべての部分について責任を負うことへの同意。すべて満たす人が著者。","e":"満たさない協力者（病理診断を手伝った先生・データ入力・英文校正など）は「謝辞」に名前を書く（本人の了承を得る）。\nゴースト・オーサーシップ（実際に書いた人が載らない）も不適切。\n著者の順番は、書き始める前に話し合って決めておくとトラブルが少ない。筆頭（first author）は主に書いた人、責任著者（corresponding author）は投稿・問い合わせの窓口。","tg":["gl"]},{"id":"ethics-3991bfd9","f":"ethics","u":24,"o":112,"lv":1,"q":"研究不正のうち「改ざん」に当たるものはどれか。","ch":["データを集めずに、架空の数値を作って載せる","都合の悪いデータを理由なく除いて結果を変える","他人の論文の文章を、出典を示さずに使う","同じ内容の原稿を、2つの雑誌に同時に投稿する"],"a":1,"cx":["存在しないデータを作るのは「捏造」。","","他人の文章・アイデアを出典なしで使うのは「盗用」。","同時投稿は「二重投稿」（不適切な行為）。"],"core":"特定不正行為＝捏造（ないものを作る）・改ざん（あるものを都合よく変える）・盗用（他人のものを無断で使う）。英語の頭文字で FFP（fabrication, falsification, plagiarism：捏造・改ざん・盗用）。","e":"その他の不適切な行為：二重投稿・二重出版、サラミ出版（1つの研究を小分けにして何本も出す）、不適切なオーサーシップ、自分の過去の論文の文章の使い回し（text recycling：出典を示し、雑誌の規定に従う）。\n学会発表した内容を論文にするのは二重出版ではない（抄録の発表は一般に問題にならない）。\n不正が見つかると論文は撤回（retraction）される。","tg":["gl"]},{"id":"ethics-55b3c169","f":"ethics","u":24,"o":113,"lv":2,"q":"学会発表での利益相反（COI（conflict of interest：利益相反））の開示について正しいものはどれか。","ch":["COI があると発表できないので、ないことにして発表する","タイトルの次のスライドで COI の有無を示す","企業の薬を使った症例の発表では、COI は関係ない","COI の開示は論文だけでよく、学会発表には不要である"],"a":1,"cx":["COI があること自体は問題ではない。隠すことが問題。","","企業から講演料・研究費などを受けていれば、症例発表でも基準に従って開示する。","多くの学会が発表でも開示を求めている（日本皮膚科学会を含む）。"],"core":"COI（利益相反）＝企業などとの経済的な関係（講演料・研究費・株・顧問料など）。学会が決めた基準額を超えるものを、発表と論文で開示する。なければ「開示すべき COI はありません」と示す。","e":"開示の書式（スライドの見本）は学会のホームページにあることが多い。基準の項目と金額は学会ごとに違うので、発表する学会の規定を見る。\n論文では投稿時に COI の申告書（ICMJE（International Committee of Medical Journal Editors：医学雑誌編集者国際委員会） の書式など）を出し、本文の最後に COI の記載を入れる。","tg":["gl"]},{"id":"ethics-96b9dc88","f":"ethics","u":24,"o":114,"lv":2,"q":"ハゲタカジャーナル（predatory journal）の特徴として最も当てはまるのはどれか。","ch":["有名な学会が発行し、編集委員の名前と所属が公開されている","投稿規定が詳しく、査読に数か月かけて丁寧に審査する","掲載料がかからず、多くの図書館で長く購読されている","勧誘メールが多く、すぐの掲載をうたい、査読がほぼない"],"a":3,"cx":["学会の公式誌で編集委員が明らかなのは信頼できる目安。","丁寧な査読と詳しい規定は、まっとうな雑誌の特徴。","掲載料目当てがハゲタカジャーナルの特徴。",""],"core":"ハゲタカジャーナル＝掲載料が目的で、査読をほとんど行わない雑誌。特徴：しつこい勧誘メール・数日での採用・実在しない IF（impact factor：インパクトファクター）・雑誌名が有名誌に似ている・編集委員が不明。","e":"確かめ方：雑誌が MEDLINE（PubMed）に収載されているか、学会や信頼できる出版社が発行しているか、所属の先生や図書館に聞く。\nThink. Check. Submit.（雑誌選びのチェックリストのサイト）も参考になる。\nハゲタカジャーナルに載せると業績として評価されず、論文を他の雑誌に出し直すこともできなくなる。","tg":["gl"],"fig":["review"]},{"id":"ethics-1a842a19","f":"ethics","u":24,"o":115,"lv":2,"q":"他の論文や教科書に載っている図を、自分の論文やスライドに使うときの扱いとして正しいものはどれか。","ch":["出典を書けば、論文でも許可は一切いらない","著作権者の許可を得て、出典を明記する","インターネットで見つけた画像は自由に使ってよい","自分が書いた過去の論文の図なら、許可はいらない"],"a":1,"cx":["論文に転載するには、出典の記載に加えて許可が必要なことが多い。","","ネットの画像にも著作権がある。利用条件（ライセンス）を確かめる。","著作権を出版社に譲っていれば、自分の図でも許可が必要。"],"core":"他人の図の転載＝著作権者の許可＋出典の明記。自分で作り直した図でも、元の図に似ていれば「〇〇より改変」と書き、許可が必要か確認する。","e":"CC BY などのライセンスが付いた図は、条件（出典・ライセンスの表示）を守れば使える。\n学会発表のスライドでの引用は、出典を明記したうえで必要な範囲にとどめる。出版物として配布・公開するなら許可が必要になりうる。\n生成AI（artificial intelligence：人工知能） で作った図も、雑誌によっては使用が禁止・制限されている。","tg":[]},{"id":"ethics-13836aa4","f":"ethics","u":24,"o":116,"lv":2,"q":"1つの研究のデータを、内容をほとんど変えずに小分けして何本もの論文にすることを何というか。","ch":["サラミ出版","系統的レビュー","二次解析","プレプリント"],"a":0,"cx":["","系統的レビューは複数の研究をまとめる正当な方法。","二次解析は、既存のデータで別の問いを立てて解析すること。元の論文を明記すれば正当。","プレプリントは査読前の原稿の公開。"],"core":"サラミ出版（分割出版）＝1つの研究を小分けにして業績の数を増やすこと。不適切な行為。別の論文にするなら、問いが明確に違い、元の論文を引用して関係を説明する。","e":"ほかの不適切な行為：二重投稿（同時に2誌）、二重出版（同じ内容を2回）、テキストの使い回し（自分の過去の論文の文章をそのまま使う：方法の説明など一部は許されることがあるが、雑誌の規定と引用が必要）。\n不正かどうか迷ったら、COPE（出版倫理委員会）の流れ図や雑誌の編集部に相談する。","tg":[]},{"id":"ethics-9940adc0","f":"ethics","u":25,"o":117,"lv":1,"q":"論文執筆での生成AI（ChatGPT、Claude など）の扱いについて、ICMJE（International Committee of Medical Journal Editors：医学雑誌編集者国際委員会） の考え方として正しいものはどれか。","ch":["生成AI を使ったことは、論文に書かないのが決まりである","著者にはできず、使ったらその内容を論文に記載する","生成AI が書いた内容は正しいので、確認しなくてよい","文章の半分以上を書かせた場合は生成AI を共著者に入れる"],"a":1,"cx":["多くの雑誌は使用を記載（謝辞・方法・カバーレター）するよう求めている。","","生成AI は事実の誤りや実在しない文献を作ることがある。著者が確かめる責任がある。","生成AI は責任を負えないので著者の条件を満たさない。"],"core":"生成AI＝道具。著者にはしない。使ったときは、どの道具を何に使ったかを書く（文章の校正なら謝辞、データ解析なら方法など）。内容の正しさ・盗用でないこと・文献が実在することは著者が確かめる。","e":"使い方のよい例：英文の言い回しの校正、構成の案出し、要約の下書き、査読コメントの英語の読み取り。\n注意：\n・患者の個人情報（名前・ID・写真・詳しい日付）を一般の生成AI サービスに入力しない\n・生成AI が示す文献は必ず PubMed で実在と内容を確かめる（もっともらしい架空の文献が出ることがある）\n・生成AI で作った画像を臨床写真・データとして使うことは多くの雑誌で禁止\n・査読者が、預かった原稿を生成AI にアップロードするのは守秘義務の違反になりうる\n・雑誌ごとの規定（AI policy）は投稿前に確認する","tg":["gl","ai"]},{"id":"ethics-c49a7037","f":"ethics","u":25,"o":118,"lv":3,"q":"生成AI（artificial intelligence：人工知能） に英文校正を頼むときの使い方として最も適切なのはどれか。","ch":["患者の名前と写真を入れて論文にしてもらい、そのまま投稿する","結果の数値を「もっと有意に見えるように」書き換えてもらう","匿名化した本文で「意味を変えず直して」と指示し、自分で確かめる","考察の文献を生成AI に挙げさせ、確認せずに文献一覧に入れる"],"a":2,"cx":["個人情報を入れてはいけない。出力をそのまま投稿するのも不可。","データの意味を変えるのは改ざん。","","架空の文献が混ざることがある。必ず実在を確認する。"],"core":"生成AI への指示は「何をしてほしいか・何をしてはいけないか」をはっきり書く（例：事実や数値を足さない、意味を変えない、変えた所を一覧にする）。出力は必ず自分で読み、原文と照らし合わせる。","e":"このアプリの「実践ワーク」では、英文校正を頼むための指示文（コピーして使える）を作れる。\n使ったことは雑誌の規定に従って書く（例：謝辞に \"The authors used [ツール名] to improve the English language. The authors reviewed and edited the content and take full responsibility for it.\"）。","tg":["cs","ai"]},{"id":"ethics-bd2c48ed","f":"ethics","u":26,"o":119,"lv":3,"q":"症例報告の同意の記載として最も適切なものはどれか。","ch":["個人名は書いていないため、同意については記載しないでおく","同意は得ていないが、学術目的なので問題はないと判断した","患者は報告に反対しなかったので、同意を得たものとみなした","患者本人から、写真を含めた掲載の同意を書面で得た"],"a":3,"cx":["匿名化しても、多くの雑誌は同意の記載を求める。","学術目的でも同意は必要。","反対しなかった＝同意ではない。書面で明確に得る。",""],"core":"同意の記載＝誰から・何について（写真を含む）・どの形で（書面）。","e":"英文の例：“Written informed consent was obtained from the patient for publication of this case report and the accompanying images.”","tg":["gl","cs"]},{"id":"ethics-61c6bb30","f":"ethics","u":26,"o":120,"lv":3,"q":"謝辞の書き方として最も適切なものはどれか。","ch":["病理診断に助言をいただいた〇〇大学病理診断科の〇〇先生に感謝する（了承済み）","診療科の部長は研究に関わっていないが、日頃の指導への感謝を示すため共著者に加えた","本論文を書くにあたり、多くの文章を考えてくれた生成AI（artificial intelligence：人工知能） の ChatGPT 先生に感謝する","これまでお世話になったすべての先生方に、この場を借りて心より深く感謝申し上げます"],"a":0,"cx":["","関わっていない人を著者にするのはギフト・オーサーシップ。","生成AI は人ではない。使用は所定の場所に事実として記載する。","誰に何を感謝しているか分からない。"],"core":"謝辞＝著者の条件を満たさない協力者を、具体的な貢献とともに書く。本人の了承を得る。","e":"研究費（助成金の名前と番号）は謝辞か「研究資金」の欄に書く（雑誌の規定による）。","tg":["cs"]},{"id":"ethics-400cc5dd","f":"ethics","u":26,"o":121,"lv":3,"q":"生成AI（artificial intelligence：人工知能） を使ったことの記載として最も適切なものはどれか。","ch":["生成AI が書いた部分の内容については、著者は責任を負わない","英文校正に生成AI（ツール名）を使い、著者が確認して責任を負う","本論文は生成AI（ツール名）との共著であり、著者に加えておいた","生成AI を使ったが、使用はごく一部なので記載しないことにした"],"a":1,"cx":["内容の責任はすべて著者にある。","","生成AI は著者にできない。","使ったら規定に従い記載する。量で判断しない。"],"core":"記載＝どのツールを・何に使い・著者が確認して責任を負うこと。場所は雑誌の規定（謝辞・方法など）。","e":"英文の例：“During the preparation of this work, the authors used [tool name] to improve the readability of the manuscript. The authors reviewed and edited the content as needed and take full responsibility for it.”","tg":["cs","ai"]},{"id":"slide-99e96e28","f":"slide","u":27,"o":122,"lv":1,"q":"学会発表のスライドの原則として最も適切なのはどれか。","ch":["1枚にできるだけ多くの情報を詰め込む","目立たせるため1枚に多くの色を使う","1枚で伝えることは1つにする","話すことをすべてスライドに文章で書く"],"a":2,"cx":["詰め込むと聴衆は読むのに追われ、話を聞かなくなる。","色が多いと何が大事か分からない。強調は1〜2色。","","文章をそのまま読む発表は伝わりにくい。スライドは要点、詳しくは口で話す。"],"core":"1スライド1メッセージ。スライドのタイトルに「言いたいこと（結論）」を書き、本体に根拠（写真・図・表）を置く。文字は最小限、話すのは口で。","e":"具体的な目安：\n・文字の大きさは24ポイント以上（会場の後ろからも読める大きさ）\n・1枚の文字は7行程度まで、箇条書きは短い語句で\n・読みやすい書体（メイリオ、游ゴシック、BIZ UD ゴシック、Arial など）\n・背景と文字の明暗の差を大きく（白地に黒・濃い紺など）\n・アニメーションは順に見せたいときだけ\n・ページ番号を入れる（質疑で「〇枚目」と言える）","tg":["sl"],"fig":["slidegood"]},{"id":"slide-1a62956d","f":"slide","u":27,"o":123,"lv":2,"q":"スライドのタイトルの付け方として最も伝わりやすいのはどれか。","ch":["「結果1：病理と蛍光抗体法」","「病理組織学的所見（HE 染色）」","「表皮下水疱と好酸球浸潤を認めた」","「スライド5：検査のまとめ」"],"a":2,"cx":["「結果1」は中身を表していない。","「病理所見」では、何が分かったかを聴衆が自分で読み取る必要がある。","","番号はタイトルにならない。"],"core":"タイトル＝そのスライドの結論を1文で（assertion：主張）。本体はその根拠（evidence）。聴衆はタイトルだけ読めば話についてこられる。","e":"「〇〇所見」「結果」「背景」のような見出しだけのタイトルを、言いたいことの文に変える練習をする。\n例：「臨床経過」→「プレドニゾロン開始後2週で水疱の新生は止まった」\n例：「背景」→「DPP-4 阻害薬は水疱性類天疱瘡の発症と関連する」","tg":["sl"]},{"id":"slide-07f9e501","f":"slide","u":27,"o":124,"lv":2,"q":"7分の発表（症例報告）のスライドの枚数の目安として最も適切なのはどれか。","ch":["表紙と COI（conflict of interest：利益相反） を除いて7〜10枚程度","30枚以上","枚数は時間と関係しないので自由に多く作る","2枚"],"a":0,"cx":["","1枚に数秒しかかけられず、聴衆が理解できない。","枚数は時間でほぼ決まる。超過は他の演者の迷惑になる。","2枚では症例・所見・考察を示しきれない。"],"core":"1枚あたりおよそ1分（写真だけの枚なら30秒程度）。7分なら7〜10枚程度が目安。時間を守ることが最優先。","e":"症例報告7分の配分の例：\n表紙・COI（20秒）→ はじめに（30秒）→ 症例：主訴・現病歴・既往（1分）→ 臨床写真（1分）→ 検査・病理（1分30秒）→ 経過図（1分）→ 考察（1分30秒）→ 結語（20秒）\n地方会では発表5〜7分・討論2〜3分のことが多い。発表要項で時間とスライドの形（16:9／4:3）を確認する。","tg":["gl","sl"],"mt":["slidetime"],"fig":["slidegood"]},{"id":"slide-c3a33a6a","f":"slide","u":27,"o":125,"lv":2,"q":"症例発表のスライドの順番として最も一般的なのはどれか。","ch":["表紙 → COI（conflict of interest：利益相反） → 症例 → 写真 → 経過 → 考察 → 結語","表紙 → 考察 → 結語 → COI（conflict of interest：利益相反） → 症例 → 写真 → 経過","結語 → 考察 → 症例 → 写真 → 経過 → 表紙 → COI（conflict of interest：利益相反）","考察 → 表紙 → 結語 → 症例 → 写真 → 経過 → COI（conflict of interest：利益相反）"],"a":0,"cx":["","症例（事実）を示す前に考察すると、根拠のない話になる。","結語から始めると症例が分からないまま結論を聞くことになる。","COI は表紙の次に置くのが一般的。"],"core":"症例発表＝表紙 → COI 開示 → （はじめに）→ 症例（主訴・現病歴・既往）→ 現症（臨床写真）→ 検査・病理 → 経過（経過図）→ 考察（既報の表）→ 結語（伝えたいこと）。","e":"最後のスライドは「ご清聴ありがとうございました」より「結語（take-home message）」を残すほうがよい。質疑の間、聴衆が要点を見ていられる。\n考察のスライドは「既報例の表」1枚と、「本例から言えること」1枚にまとめると時間内に収まる。","tg":["gl","sl"]},{"id":"slide-17b269f9","f":"slide","u":27,"o":126,"lv":1,"q":"スライドの書体（フォント）の選び方として最も適切なのはどれか。","ch":["細い明朝体を小さく使い、1枚の文字数を多くする","読みやすいゴシック体で、会場の PC にもある書体","自分の PC にしか入っていない珍しい書体を使う","目立つよう、1枚ごとに違う飾り文字の書体を使う"],"a":1,"cx":["細い明朝体は遠くから見えにくい。","","会場の PC に書体がないと、別の書体に置き換わってレイアウトが崩れる。","書体がばらばらだと読みにくく、まとまりがない。"],"core":"スライドの書体＝線の太さが均一なゴシック体（メイリオ、游ゴシック、BIZ UD ゴシック、Arial など）。1つの発表では1〜2種類に絞る。会場の PC で崩れないか試写で確かめる。","e":"自分の PC で作ったファイルは、会場の PC（Windows が多い）で開くと書体や改行が変わることがある。PDF でも持っていくと安心（動画やアニメーションは使えなくなる）。\nBIZ UD ゴシックは読みやすさに配慮した書体で、Windows に標準で入っている。","tg":["sl"]},{"id":"slide-238d6267","f":"slide","u":28,"o":127,"lv":2,"q":"スライドの色の使い方として最も適切なのはどれか。","ch":["赤と緑の文字で、大事な点と大事でない点を区別する","背景に写真を全面に敷き、その上に文字を重ねる","強調は1〜2色に絞り、赤と緑だけに頼らない","すべての文字を蛍光色にして、どこも目立たせる"],"a":2,"cx":["赤と緑は色覚の多様性により区別しにくい人がいる。形・太さ・位置でも区別する。","背景の写真の上の文字は読みにくい。写真と文字は分ける。","","すべてを強調すると、何も強調されない。"],"core":"色は少なく。強調色は1〜2色。色だけでなく、太字・枠・矢印・位置でも区別する（カラーユニバーサルデザイン）。背景と文字の明暗の差を大きくする。","e":"会場のプロジェクターでは、画面より色が薄く見える。薄い黄色の文字や淡い背景は消えやすい。\n臨床写真は暗い背景（黒・濃い灰色）に置くと色が見やすい。\n所見を指すときは、写真の上に矢印・丸を入れる（レーザーポインターは震えて見にくい）。","tg":["sl"]},{"id":"slide-831e9023","f":"slide","u":28,"o":128,"lv":3,"q":"次のスライドの直し方として最もよいのはどれか。「タイトル：検査所見。本体：血液検査の全項目（30項目）を小さな文字の表で載せている」","ch":["タイトルを「抗 BP180 抗体が高値」にし、関係する数項目だけ大きく示す","30項目のまま文字をさらに小さくして、スライドに余白を作る","表を2枚のスライドに分けて、すべての項目を残しておく","表はそのままにして、発表のときに全項目を順に読み上げる"],"a":0,"cx":["","小さい文字は会場で読めない。","2枚にしても要点が埋もれる。時間も増える。","全項目を読み上げると時間が足りなくなり、要点が伝わらない。"],"core":"検査のスライド＝診断に関係する値（異常値と、除外に使った陰性の値）だけを大きく。異常値は色や太字で強調。全項目は論文の付録や抄録には不要。","e":"「載せた情報はすべて読まれる」と思って作る。読まれない情報は、聴衆の注意を奪うだけ。\n数値には単位と基準値を付ける（基準値は小さめでよい）。","tg":["cs","sl"]},{"id":"slide-edbeb667","f":"slide","u":28,"o":129,"lv":3,"q":"臨床写真のスライドの作り方として最もよいのはどれか。","ch":["個人が特定できる顔写真をそのまま全体で載せる","写真を大きくし、所見に矢印と短い言葉を添える","写真を小さく8枚並べ、説明は口頭だけにする","写真の上に長い説明文を重ねて、丁寧に書く"],"a":1,"cx":["顔写真は目を隠すだけでは匿名化として不十分とされる。必要な部分だけ切り取り、同意を得る。","","小さな写真は会場では見えない。枚数を絞って大きく。","文字が写真の所見を隠し、読む負担も大きい。"],"core":"臨床写真＝大きく、少なく、所見を矢印で示し、短い言葉（例：「緊満性水疱」「浮腫性紅斑」）を添える。全体像と近接像を並べるとどこの皮疹か分かる。","e":"学会発表でも患者のプライバシー保護の指針は同じ（日付は年月まで、他院の名前は書かない、画像の番号を消す）。\nスライドを撮影・SNS に載せることを禁止する学会が多い。発表者も聴衆も規定を守る。","tg":["cs","sl"]},{"id":"slide-9652f1d8","f":"slide","u":28,"o":130,"lv":2,"q":"論文に載せたグラフを発表スライドで使うときの工夫として最も適切なのはどれか。","ch":["同じ図を立体にして、動きのあるアニメーションを付ける","論文の図をそのまま縮小して、細かい数字も全部残す","伝えたい線だけ強調し、文字を大きく単純にする","目盛りや軸の名前を消して、見た目だけすっきりさせる"],"a":2,"cx":["立体や動きは読み取りを邪魔する。","論文の図は手元で読む前提。スライドでは小さくて読めない。","","軸の名前と単位は必要。消すと何の図か分からない。"],"core":"スライドのグラフ＝言いたいことを1つに絞り、そこだけ色で強調し、他は灰色。文字（軸・凡例）は大きく、凡例は線の近くに直接書く。","e":"タイトルに結論を書く：「治療群で再発が少なかった（20% 対 36%）」。\n表はスライドでは読まれにくい。大事な数字だけを残すか、グラフにする。","tg":["sl"],"mt":["chart"]},{"id":"slide-ae30511a","f":"slide","u":28,"o":131,"lv":3,"q":"次のスライドの直し方として最もよいのはどれか。「タイトル：考察。本体：文献の文章を引用した12行の文章」","ch":["表はそのままにして、発表のときに全項目を順に読み上げる","タイトルを「抗 BP180 抗体が高値」にし、関係する数項目だけ大きく示す","表を2枚のスライドに分けて、すべての項目を残しておく","30項目のまま文字をさらに小さくして、スライドに余白を作る"],"a":1,"cx":["読み上げは伝わりにくく、時間を超えやすい。","","2枚にしても読まれない。時間も足りなくなる。","文字を小さくすると読めない。量を減らす。"],"core":"考察のスライド＝「本例から言えること」をタイトルに、既報との比較は表、根拠は要点3つ程度。詳しい内容は口で話す。出典は小さく右下に。","e":"よいタイトルの例：「DPP-4 阻害薬の中止だけで軽快した例は既報7例と少ない」。\n文献の出典はスライドの下に小さく（著者, 雑誌, 年）。","tg":["cs","sl"],"mt":["litrev"]},{"id":"slide-dffa45ae","f":"slide","u":29,"o":132,"lv":3,"q":"スライドのタイトルの直し方として最もよいのはどれか。元：「臨床経過」","ch":["「ドキシサイクリン開始4週で膿疱は消失した」","「経過：いろいろあったが最終的に良くなった」","「臨床経過について（詳細は口頭で説明）」","「臨床経過と治療と検査と画像のまとめ」"],"a":0,"cx":["","あいまいで、何がどう良くなったか分からない。","見出しのままで、結論が分からない。","内容を並べただけで、何が言いたいか分からない。"],"core":"タイトル＝そのスライドの結論の文。聴衆はタイトルを読むだけで話についてこられる。","e":"ドキシサイクリン（ビブラマイシン）：テトラサイクリン系抗菌薬。酒皶・痤瘡などに使う（保険適用は疾患ごとに確認）。","tg":["cs","sl"]},{"id":"slide-0ba14d52","f":"slide","u":29,"o":133,"lv":3,"q":"症例スライドの直し方として最もよいのはどれか。元：「現病歴を12行の文章で全部書いている」","ch":["12行の文章はそのままにして、文字を小さくして下に余白をつくる","文章をそのまま読み上げることにして、話す速さで時間内に収める","現病歴のスライドは省いて、いきなり病理のスライドから始める","「3か月前　口腔内びらん」「1か月前　水疱」と時間と所見の語句にする"],"a":3,"cx":["小さい文字は会場で読めない。","読み上げは伝わりにくい。","経過がないと診断の流れが分からない。",""],"core":"症例スライド＝時間＋所見の短い語句（箇条書き）。詳しい説明は口で。","e":"時間の流れは、左から右の矢印や簡単な年表にすると分かりやすい。","tg":["cs","sl"]},{"id":"slide-b1946680","f":"slide","u":29,"o":134,"lv":3,"q":"考察スライドの直し方として最もよいのはどれか。元：「既報10例の詳細な表（12列、小さな文字）」","ch":["比べたい3〜4列に絞り、自験例を最終行で強調する","12列のまま文字をさらに小さくして、1枚に全部収める","表は見せずに、口頭で10例を1例ずつ順に説明していく","表を4枚のスライドに分けて、全部の列を順番に見せる"],"a":0,"cx":["","小さすぎて読めない。","口頭だけでは比べられない。","時間が足りなくなり、要点が埋もれる。"],"core":"スライドの表＝言いたいことに必要な列だけ。自験例を色や太字で強調。","e":"全部の列は論文の表に入れればよい。発表と論文で見せ方を変える。","tg":["cs","sl"]},{"id":"slide-683c7719","f":"slide","u":29,"o":135,"lv":3,"q":"結語スライドの直し方として最もよいのはどれか。元：「ご清聴ありがとうございました」だけ","ch":["最後に新しい臨床写真を追加して、強い印象を残す","「ご清聴ありがとうございました」を大きくして目立たせる","結語は不要なので、考察のスライドで発表を終える","伝えたいことを1〜2行で示す結語にする"],"a":3,"cx":["最後に新しい情報を出すと混乱する。","質疑の間、聴衆が要点を見ていられない。","結語で要点をくり返すことで記憶に残る。",""],"core":"最後のスライドは結語。質疑応答の間ずっと映るので、要点を残す。","e":"礼の言葉は口で言えばよい。","tg":["cs","sl"]},{"id":"slide-4e58af1a","f":"slide","u":29,"o":136,"lv":3,"q":"グラフのスライドの直し方として最もよいのはどれか。元：「論文の図をそのまま貼り、凡例と軸の字が小さい」","ch":["図はそのままにして、レーザーポインターで細かく説明する","伝えたい線だけ色を付けて他は灰色にし、文字を大きくする","図を削除して、数値だけを文章で並べて読み上げる","図を2枚並べて、同じ図を大きさを変えて見せて強調する"],"a":1,"cx":["読めない字はポインターでも読めない。","","数値の羅列は比較しにくい。","同じ図をくり返しても情報は増えない。"],"core":"スライドのグラフ＝言いたいことを1つに絞り、そこを強調。文字は大きく、凡例は線の近くに直接。","e":"タイトルに結論（例：「治療群で再発が少なかった」）を書けば、聴衆はどこを見ればよいか分かる。","tg":["cs","sl"],"mt":["chart"]},{"id":"slide-5e848697","f":"slide","u":29,"o":137,"lv":3,"q":"臨床写真のスライドの直し方として最もよいのはどれか。元：「顔全体の写真に目の部分だけ細い黒線」","ch":["病変の部位だけを切り取り、同意を確認して大きく示す","目の黒線を少し太くすれば、顔全体の写真のままでよい","写真は使わずに、「顔に皮疹」と文字だけで書いておく","写真全体を強くぼかして、全体を見えにくくしておく"],"a":0,"cx":["","目の黒線だけでは本人と分かることがある。","写真がないと所見が伝わらない。必要な範囲で使う。","全体をぼかすと所見も見えなくなる。"],"core":"写真＝必要な部位だけ切り取る。顔が必要なら同意を得る。学会発表でも論文と同じ配慮。","e":"発表スライドは撮影・拡散されるおそれがある。学会の撮影禁止の規定があっても、配慮は自分でする。","tg":["gl","cs","sl"]},{"id":"talk-b4d7988e","f":"talk","u":30,"o":138,"lv":1,"q":"学会に演題を応募するときの抄録の書き方として最も適切なのはどれか。","ch":["発表と違う内容になってもよいので大きく書く","字数の上限の中に、症例の要点と伝えたいことを入れる","字数を超えても大事なことは全部書く","結果はまだ分からないので「当日発表する」とだけ書く"],"a":1,"cx":["抄録と発表の内容は一致させる。","","字数超過は受け付けられないことがある。","結果のない抄録は採択されにくい（研究なら少なくとも途中の結果を書く）。"],"core":"学会抄録＝決められた字数（例：400〜800字）で、症例なら「年齢・性別・主訴・所見・病理・診断・治療と経過・考察（伝えたいこと）」、研究なら「目的・方法・結果（数字）・結論」。","e":"抄録は学会誌や抄録集に残り、検索もされる。演題名は抄録の中身と合わせる。\n締め切り直前は応募システムが混む。数日前に出す。\n共同演者の了承を得てから応募する。","tg":["sl"]},{"id":"talk-e4affa03","f":"talk","u":30,"o":139,"lv":3,"q":"研究発表の学会抄録の「結果」として最も適切な書き方はどれか。","ch":["粘膜病変は内服群で少ない傾向にあり、DPP-4 阻害薬が粘膜を守ると考えられた","粘膜病変について様々な検討を行い、いくつかの重要な新しい知見が得られた","粘膜病変は内服群 4/40 例（10%）、非内服群 21/80 例（26%）であった","粘膜病変の頻度には差があり、興味深い結果が得られたので当日詳しく発表する"],"a":2,"cx":["結果に解釈（粘膜を守る）が混ざっている。解釈は結論に分けて書く。","何が分かったのか分からない。数字を書く。","","「当日発表する」では中身が分からず、採択されにくい。"],"core":"学会抄録も論文と同じく、結果は数字で（分母・割合・P 値）、結論は言える範囲で。","e":"抄録を読んで「聞きに行きたい」と思わせるのは、具体的な数字と明確な結論。\n抄録の締め切り時点で解析が終わっていなければ、途中の結果でもよいので数字を書き、本番で最終結果を示す（変わった点は発表で説明する）。","tg":["cs","sl"]},{"id":"talk-399ba873","f":"talk","u":31,"o":140,"lv":1,"q":"発表の練習のしかたとして最も適切なのはどれか。","ch":["時間を計って声に出し、指導医に聞いてもらう","恥ずかしいので、一人で原稿を黙読するだけにする","原稿を書かずに、当日その場で考えて話す","頭の中で一度、流れを考えておくだけにする"],"a":0,"cx":["","黙読では話す速さが分からない。声に出す。","その場で考えると時間が読めず、要点が抜ける。","頭の中では時間が短く感じられ、本番で超過しやすい。"],"core":"声に出して時間を計る通し練習を数回。日本語の話す速さはおよそ1分に300字前後が目安。7分なら原稿は約2,000字。指導医の予演会で指摘をもらう。","e":"コツ：\n・最初の30秒（あいさつ・はじめに）と最後の結語は、ほぼ暗記しておくと落ち着く\n・スライドを読み上げず、聴衆のほうを向いて話す\n・「えー」を減らすには、文を短くする\n・時間が余るより、少し早く終わるほうがよい\n・発表用のファイルは USB と別の場所の2か所に保存し、会場の PC で動くか（フォント・動画）を試写で確かめる","tg":["sl"],"mt":["slidetime"]},{"id":"talk-24505bce","f":"talk","u":31,"o":141,"lv":2,"q":"質疑応答での答え方として最も適切なのはどれか。","ch":["答えにくい質問は、聞こえなかったふりをする","分からない質問にも、推測で断定して答える","質問の途中でさえぎって、すぐに答え始める","感謝し、短く答え、分からないことは正直に言う"],"a":3,"cx":["無視は失礼。聞き取れなければ聞き返してよい。","推測の断定は誤りを広める。「調べておりません」「今後検討します」と正直に。","最後まで聞いて質問の意図をつかんでから答える。",""],"core":"質疑＝①「ご質問ありがとうございます」②質問を短く言い直して確認（意図がずれていないか）③結論から短く答える ④分からなければ正直に。座長や指導医が補ってくれることもある。","e":"予想される質問を準備する：診断の根拠（鑑別は何を除外したか）、治療を選んだ理由、既報との違い、その後の経過。\n予備のスライド（appendix）を用意しておくと、質問に図で答えられる。","tg":["sl"]},{"id":"talk-02667933","f":"talk","u":31,"o":142,"lv":2,"q":"発表中のレーザーポインターの使い方として最も適切なのはどれか。","ch":["話している間ずっと画面の上で回し続ける","聴衆の顔に向けて注意を引く","大事な所ほど速く何度も往復させる","示す所に向けて止め、必要な時だけ使う"],"a":3,"cx":["動き続ける点は気が散り、どこを見ればよいか分からない。","目に向けるのは危険で禁止。","速く動かすと追えない。",""],"core":"ポインターは「示して止める」。手が震えて見えるなら、両手で持つか、肘を体に付ける。スライドに矢印を入れておけば、ポインターはほぼいらない。","e":"オンライン発表では、ポインターが聴衆に見えないことが多い。スライドの矢印や丸で示す。\n話すときは画面ではなく聴衆（会場の後ろのほう）を見る。","tg":["sl"]},{"id":"talk-5177d45c","f":"talk","u":31,"o":143,"lv":2,"q":"発表時間が残り1分なのに、まだ考察の途中だった。最も適切な対応はどれか。","ch":["座長の合図を無視して、用意した内容を最後まで全部話す","話す速さを2倍にして、残りのすべてのスライドを見せる","その場で発表をやめて、残りの時間を質疑だけにしてもらう","残りを省いて結語に進み、伝えたいことを言う"],"a":3,"cx":["超過は他の演者と会場全体の迷惑になる。","速すぎると何も伝わらない。","結語を言わずに終わると、伝えたいことが残らない。",""],"core":"時間が足りないときは、途中を飛ばして結語へ。最も大事なのは最後の1文（伝えたいこと）。事前に「時間が足りないときに飛ばすスライド」を決めておく。","e":"予演会で時間を計り、本番より30秒ほど短く終わるように調整しておく。\n本番は緊張で早口になる人も、遅くなる人もいる。自分の傾向を練習で知っておく。","tg":["sl"]},{"id":"talk-1d143176","f":"talk","u":32,"o":144,"lv":2,"q":"ポスター発表の作り方として最も適切なのはどれか。","ch":["写真は小さくして、文字の量をできるだけ多くする","論文の本文をそのまま小さな字で全部貼り付ける","読む順番はばらばらに配置して、興味を引くようにする","タイトルを大きくし、読む順がすぐ分かる配置にする"],"a":3,"cx":["写真・図が主役。文字は少なく。","ポスターの前で立ち止まる時間は短い。要点だけにする。","流れが分からないと読んでもらえない。",""],"core":"ポスター＝遠くから見えるタイトル、上から下・左から右の流れ（2〜3列）、図と写真を大きく、結語を目立つ位置に。サイズは学会の規定（例：横90 cm×縦180 cm など）に合わせる。","e":"1〜2 m 離れて読める文字の大きさにする（本文でも20〜24ポイント以上を目安に、タイトルはもっと大きく）。\nポスター前で説明を求められたときのために、1分と3分の説明を用意しておく。\n印刷は布ポスターにすると持ち運びやすい。","tg":["sl"],"fig":["poster"]},{"id":"talk-be57e6b6","f":"talk","u":32,"o":145,"lv":2,"q":"オンライン（Web）開催の学会での発表について正しいものはどれか。","ch":["オンラインなら、患者のプライバシーへの配慮はいらない","事前録画が多く、時間と音声を確認して提出する","録画での発表なら、時間を大きく超えてもかまわない","オンライン開催なら、COI（conflict of interest：利益相反） の開示は不要とされている"],"a":1,"cx":["オンラインでも同じく個人情報に配慮する（画面の保存・拡散のおそれはむしろ大きい）。","","指定の時間を守る。超えると受け付けられないことがある。","COI の開示は開催の形にかかわらず必要。"],"core":"オンライン発表＝事前録画か当日の画面共有。マイクの音質、カメラの位置、通信を事前に確認。録画は時間内に収める。","e":"画面共有では、通知（メール・メッセージ）が映らないよう切っておく。\nポスターの電子掲示（e-poster）では、1枚の画面で読めるように文字を大きく、内容を絞る。","tg":["sl"]},{"id":"talk-a5a17655","f":"talk","u":33,"o":146,"lv":3,"q":"学会抄録の書き出しの直し方として最もよいのはどれか。元：「今回我々は、非常に興味深い経過をたどった症例を経験したので報告する。」","ch":["近年、皮膚科の分野ではさまざまな病気が報告されている","本症例について、当日の発表でその詳細を説明する予定である","今回我々は、非常に珍しく貴重で興味深い経過の症例を経験した","72歳、女性。初診の2か月前から両下腿に浸潤を触れる紫斑が出現した"],"a":3,"cx":["一般論で、字数を使っても情報がない。","中身がないと採択されにくい。","評価の語を増やしただけで字数の無駄。",""],"core":"抄録は字数が限られる。最初の1文から症例の中身（年齢・性別・所見）を書く。","e":"決まり文句（「今回我々は〜を経験したので報告する」）は、字数に余裕があるときだけ最後に短く。","tg":["cs","sl"]},{"id":"talk-87675a28","f":"talk","u":33,"o":147,"lv":3,"q":"発表の最初の話し方として最もよいのはどれか。","ch":["「〇〇の1例を報告します。本例は〜の点が特徴です。」と要点から入る","「緊張していてうまく話せるか分かりませんが、よろしくお願いします」","「えー、それでは、始めさせていただきたいと思います。えー」","「スライドが多いので早口になりますが、ご了承ください」"],"a":0,"cx":["","自信のなさを先に言う必要はない。","前置きと「えー」が長いと、聴衆の注意がそれる。","早口になる前提は準備不足。枚数を減らす。"],"core":"最初の30秒で「何の話か・何が特徴か」を言う。最初と最後の言葉は暗記しておく。","e":"時間配分の目安：表紙15秒・COI（conflict of interest：利益相反） 10秒。症例に入る前に特徴を一言言うと、聴衆はどこに注目すればよいか分かる。","tg":["cs","sl"]},{"id":"talk-27e68f3f","f":"talk","u":33,"o":148,"lv":3,"q":"質疑応答で、分からない質問をされたときの答え方として最もよいのはどれか。","ch":["何も答えずに黙ったまま、座長が次に進めてくれるのをじっと待つ","「その点は検討しておりません。ご指摘ありがとうございます。確認します」","「それは本発表とは関係ありませんので、お答えできません」と打ち切る","「おそらく〜だと思いますが、たぶん大丈夫だと思います」と推測で答える"],"a":1,"cx":["黙るより、正直に「分からない」と言うほうがよい。","","関係の薄い質問でも、丁寧に答えられる範囲で答える。","推測を答えると、誤りが広まる。"],"core":"分からないときは正直に、感謝とともに。指導医や共同演者が補ってくれることもある。","e":"事前の予想質問：診断の根拠・鑑別・治療を選んだ理由・既報との違い・その後の経過。","tg":["cs","sl"]}];
const FIGS={"imrad":{"t":"IMRaD の形。序論は広い話から自分の問いへ絞り、方法・結果は自分の研究だけ、考察は結果から広い意味へ広げる。","s":"<svg viewBox=\"0 0 600 440\" role=\"img\" aria-label=\"IMRaD\"><defs><marker id=\"ra\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--ink)\"/></marker><marker id=\"rr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--maru)\"/></marker></defs><text class=\"M\" x=\"300\" y=\"26\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">論文の形は「砂時計」：広い話 → 自分の研究 → 広い意味</tspan></text><path class=\"bx2\" d=\"M60 45 L540 45 L380 145 L220 145 Z\"/><text class=\"L\" x=\"300\" y=\"85\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">序論（Introduction）</tspan></text><text class=\"S\" x=\"300\" y=\"112\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">分かっていること → 分かっていないこと → 目的</tspan></text><rect class=\"bx\" x=\"220\" y=\"155\" width=\"160\" height=\"60\" rx=\"10\"/><text class=\"M\" x=\"300.0\" y=\"180.375\" text-anchor=\"middle\"><tspan x=\"300.0\" dy=\"0\">方法</tspan><tspan x=\"300.0\" dy=\"1.25em\">（Methods）</tspan></text><rect class=\"bx\" x=\"220\" y=\"225\" width=\"160\" height=\"60\" rx=\"10\"/><text class=\"M\" x=\"300.0\" y=\"250.375\" text-anchor=\"middle\"><tspan x=\"300.0\" dy=\"0\">結果</tspan><tspan x=\"300.0\" dy=\"1.25em\">（Results）</tspan></text><path class=\"bx3\" d=\"M220 295 L380 295 L540 395 L60 395 Z\"/><text class=\"L\" x=\"300\" y=\"335\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">考察（Discussion）</tspan></text><text class=\"S\" x=\"300\" y=\"362\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">本研究の要点 → 既報との比較 → 意味・限界</tspan></text><path class=\"ln\" d=\"M396 174.75 L382 185\"/><circle class=\"dot\" cx=\"382\" cy=\"185\" r=\"4\"/><text class=\"S\" x=\"400\" y=\"180\" text-anchor=\"start\"><tspan x=\"400\" dy=\"0\">どうやって？</tspan><tspan x=\"400\" dy=\"1.25em\">（再現できる詳しさ）</tspan></text><path class=\"ln\" d=\"M396 244.75 L382 255\"/><circle class=\"dot\" cx=\"382\" cy=\"255\" r=\"4\"/><text class=\"S\" x=\"400\" y=\"250\" text-anchor=\"start\"><tspan x=\"400\" dy=\"0\">何が分かった？</tspan><tspan x=\"400\" dy=\"1.25em\">（事実・数字だけ）</tspan></text><path class=\"ln\" d=\"M121 179.75 L218 185\"/><circle class=\"dot\" cx=\"218\" cy=\"185\" r=\"4\"/><text class=\"S\" x=\"12\" y=\"185\" text-anchor=\"start\"><tspan x=\"12\" dy=\"0\">ここは細く：</tspan><tspan x=\"12\" dy=\"1.25em\">自分の研究だけ</tspan></text><text class=\"S\" x=\"300\" y=\"425\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">前：タイトル・抄録　　後ろ：結論・謝辞・COI・文献・図表</tspan></text></svg>"},"order":{"t":"効率のよい書く順番。事実（図表・方法・結果）を先に固め、解釈（考察）→ 導入（序論）→ 要約（抄録・タイトル）の順にすると書き直しが減る。","s":"<svg viewBox=\"0 0 600 425\" role=\"img\" aria-label=\"書く順番\"><defs><marker id=\"ra\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--ink)\"/></marker><marker id=\"rr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--maru)\"/></marker></defs><text class=\"L\" x=\"300\" y=\"26\" text-anchor=\"middle\"><tspan x=\"300\" dy=\"0\">書く順番（読む順番とは違う）</tspan></text><rect class=\"bx2\" x=\"40\" y=\"45\" width=\"300\" height=\"48\" rx=\"10\"/><text class=\"M\" x=\"190.0\" y=\"75.0\" text-anchor=\"middle\"><tspan x=\"190.0\" dy=\"0\">① 伝えたいこと1文</tspan></text><text class=\"S\" x=\"360\" y=\"75\" text-anchor=\"start\"><tspan x=\"360\" dy=\"0\">最初に決める</tspan></text><path class=\"ln\" d=\"M190 93 L190 105\" marker-end=\"url(#ra)\"/><rect class=\"bx\" x=\"40\" y=\"107\" width=\"300\" height=\"48\" rx=\"10\"/><text class=\"M\" x=\"190.0\" y=\"137.0\" text-anchor=\"middle\"><tspan x=\"190.0\" dy=\"0\">② 図表・写真</tspan></text><text class=\"S\" x=\"360\" y=\"137\" text-anchor=\"start\"><tspan x=\"360\" dy=\"0\">話の筋になる</tspan></text><path class=\"ln /* ---------- 自分メモ（問題ごとのメモと画像）：3つの学習アプリで共通の部品 ----------
   使い方：MyNote.init("保存名")。問題の画面に MyNote.slot(問題ID) を入れるだけ。
   画面を描き直すたびに、空の枠を自動で見つけて中身を入れる（MutationObserver）。
   保存：文字と画像は IndexedDB（この端末だけ）。メモのある問題の一覧だけ localStorage にも持つ（ホームの件数表示用）。 */
const MyNote = (() => {
  let DBN = "", IDXK = "", dbp = null, idx = {};
  /* 2026-11-25 不具合修正：メモを書いて0.5秒以内に「要復習」「大丈夫」などを押すと画面が描き直され、

     → live＝問題ごとの最新の中身（枠をまたいで共有）、pend＝まだ保存していない枠。ボタンに触れた瞬間・画面を離れる時にすぐ保存する。 */
  const live = {}, pend = new Map();
  function flush() { pend.forEach((f, el) => { try { f(); } catch (e) {} }); }
  const MAXW = 1600, QUAL = 0.85;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const css = `
.mynote{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;background:var(--card);display:flex;flex-direction:column;gap:8px}

.mynote .mn-imgs{display:flex;flex-wrap:wrap;gap:8px}
.mynote .mn-im{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}

  function db() {
    if (!dbp) dbp = new Promise((ok, ng) => {
      const r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = () => r.result.createObjectStore("notes");
      r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const d = await db();
    return new Promise((ok, ng) => { const t = d.transaction("notes", mode); const s = t.objectStore("notes"); const p = Promise.resolve(fn(s)); t.oncomplete = () => p.then(ok, ng); t.onerror = () => ng(t.error); t.onabort = () => ng(t.error); });
  }
  const req = r => new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });
  const get = id => tx("readonly", s => req(s.get(id)));
  const put = (id, v) => tx("readwrite", s => { s.put(v, id); });
  const del = id => tx("readwrite", s => { s.delete(id); });
  /* 2つの読み出しを同時に出す（await をはさむと、途中で取引が閉じるブラウザがある） */
  const all = () => tx("readonly", s => Promise.all([req(s.getAllKeys()), req(s.getAll())]).then(([ks, vs]) => ks.map((k, i) => [k, vs[i]])));

  const saveIdx = () => { try { localStorage.setItem(IDXK, JSON.stringify(idx)); } catch (e) {} };
  function setIdx(id, v) { const has = !!(v && ((v.text || "").trim() || (v.imgs || []).length)); if (has) idx[id] = 1; else delete idx[id]; saveIdx(); return has; }

  function shrink(file) {
    return new Promise((ok, ng) => {
      const url = URL.createObjectURL(file); const im = new Image();
      im.onload = () => {
        const k = Math.min(1, MAXW / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);

      im.onerror = () => { URL.revokeObjectURL(url); ng(new Error("この画像は読み込めませんでした")); };

    });
  }

    if (el.dataset.mnOn) return; el.dataset.mnOn = "1";

      v = live[id] || (live[id] = Object.assign({ text: "", imgs: [], ts: 0 }, d || {}));   // 読み込み中に別の枠が作っていればそちらを使う
    }
    const urls = [];
    const draw = () => {
      urls.forEach(u => URL.revokeObjectURL(u)); urls.length = 0;
      el.classList.toggle("has", !!((v.text || "").trim() || v.imgs.length));
      el.innerHTML = `<div class="mn-h"><span>自分メモ</span><small>${v.ts ? "保存：" + new Date(v.ts).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "この端末にだけ保存されます"}</small></div>
        <textarea placeholder="覚えたいこと・まちがえた理由・教科書のページなどを書けます" aria-label="この問題の自分メモ">${esc(v.text || "")}</textarea>
        <div class="mn-imgs">${v.imgs.map((b, i) => { const u = URL.createObjectURL(b); urls.push(u); return `<div class="mn-im"><img src="${u}" alt="メモの画像${i + 1}" data-i="${i}"><button type="button" aria-label="この画像を消す" data-del="${i}">×</button></div>`; }).join("")}</div>
        <div class="mn-row"><label class="mn-add">＋ 画像を追加<input type="file" accept="image/*" multiple></label><span class="mn-st" aria-live="polite"></span></div>`;
      const ta = el.querySelector("textarea"), st = el.querySelector(".mn-st");
      /* メモの入力中に、アプリの答えのキー（1〜4・O・X・Enter など）が反応しないようにする */
      ta.addEventListener("keydown", e => e.stopPropagation());
      let tm = null;
      const now = () => { if (tm) { clearTimeout(tm); v.text = ta.value; save(); } };
      ta.addEventListener("input", () => { v.text = ta.value; st.textContent = "保存中…"; clearTimeout(tm); tm = setTimeout(save, 500); pend.set(el, now); });
      ta.addEventListener("compositionend", () => { v.text = ta.value; });

  function scan(root) { (root || document).querySelectorAll(".mynote:not([data-mn-on])").forEach(mount); }

  /* ---- 書き出し・読み込み（機種変更やブラウザのデータ消去に備える） ---- */
  const b64 = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
  async function exportAll() {
    const rows = await all(); const out = [];
    for (const [k, v] of rows) out.push({ id: k, text: v.text || "", ts: v.ts || 0, imgs: await Promise.all((v.imgs || []).map(b64)) });
    const blob = new Blob([JSON.stringify({ app: DBN, v: 1, notes: out })], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = DBN + "-" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return out.length;
  }
  async function importFile(file) {
    const j = JSON.parse(await file.text()); if (!j || !Array.isArray(j.notes)) throw new Error("メモのファイルではありません");
    let n = 0;
    for (const r of j.notes) {
      const imgs = await Promise.all((r.imgs || []).map(u => fetch(u).then(x => x.blob())));
      const cur = await get(r.id);
      /* すでにメモがあるときは、新しい方を残す */
      if (cur && (cur.ts || 0) > (r.ts || 0)) continue;
      const v = { text: r.text || "", imgs, ts: r.ts || Date.now() };
      if (setIdx(r.id, v)) { await put(r.id, v); live[r.id] = v; n++; }
    }
    return n;
  }
  /* ホームに置く道具（件数・書き出し・読み込み）。onChange で画面を描き直す */
  function tools(onChange) {
    const wrap = document.createElement("div"); wrap.className = "mn-tools";
    wrap.innerHTML = `<button type="button" class="btn sub" data-mn="exp">メモを書き出す（保存用ファイル）</button><label class="btn sub">メモを読み込む<input type="file" accept="application/json,.json"></label><span class="mn-st mini"></span>`;
    const st = wrap.querySelector(".mn-st");
    wrap.querySelector("[data-mn=exp]").addEventListener("click", async () => { try { const n = await exportAll(); st.textContent = n + "問分のメモを書き出しました"; } catch (e) { st.textContent = "書き出せませんでした"; } });
    wrap.querySelector("input").addEventListener("change", async e => { const f = e.target.files[0]; if (!f) return; try { const n = await importFile(f); st.textContent = n + "問分のメモを読み込みました"; if (onChange) setTimeout(onChange, 800); } catch (err) { st.textContent = err.message || "読み込めませんでした"; } });
    return wrap;
  }

  return {
    init(name) {
      DBN = name; IDXK = name + "-idx";
      try { idx = JSON.parse(localStorage.getItem(IDXK) || "{}") || {}; } catch (e) { idx = {}; }
      const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
      /* ブラウザに「消さないで」と頼む（ホーム画面のアプリでは通常そのまま残る） */
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
      new MutationObserver(() => scan()).observe(document.body, { childList: true, subtree: true });
      ["pointerdown", "touchstart", "mousedown"].forEach(t => document.addEventListener(t, e => { if (!(e.target.closest && e.target.closest(".mynote textarea"))) flush(); }, true));
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
      window.addEventListener("pagehide", flush);
      /* 記録の一覧を IndexedDB から作り直す（localStorage が消えた場合の保険） */
      all().then(rows => { idx = {}; rows.forEach(([k, v]) => setIdx(k, v)); }).catch(() => {});
      scan();
    },
    slot: id => `<div class="mynote" data-q="${esc(id)}"></div>`,
    ids: () => Object.keys(idx),
    has: id => !!idx[id],
    count: () => Object.keys(idx).length,
    tools
  };
})();

/* ---------- 問題の移動バーと問題一覧：3つの学習アプリで共通の部品 ----------
   問題画面の進み具合のバー（.qhead のすぐ後ろの .meter）を、指でなぞって問題を移動できるようにする。
   バーを長押し、または「一覧」ボタンで、問題の一覧（○×・まだ）を開き、タップでその問題へ移動する。
   QNav.init({ state: () => ({ n, cur, status: ["ok"|"mid"|"ng"|"", ...], text: k => "問題文" }) | null, jump: k => {...}, mark: (k, g) => {...} })
   state は問題画面のときだけ値を返す（それ以外は null）。画面の描き直しは MutationObserver で検出する。
   mark を渡すと、一覧の各行に ○・△・× のボタンが出て、評価を付け直せる（復習の予定 srs.js に反映する）。 */
const QNav = (() => {
  let OPT = null, sheet = null;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = s => String(s || "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  const css = `
.qn-wrap{position:relative;padding:10px 0;margin:-10px 0;touch-action:pan-y}
.qn-wrap .meter{position:relative}
.qn-range{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100%;height:34px;margin:0;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.qn-knob{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--card,#fff);border:3px solid var(--acc,#1f6b5c);box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:none}
.qn-tip{position:absolute;bottom:100%;transform:translateX(-50%);margin-bottom:6px;background:var(--ink,#222);color:var(--card,#fff);font-size:12px;line-height:1.4;border-radius:8px;padding:4px 8px;white-space:nowrap;max-width:70vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none;display:none;z-index:5}
.qn-wrap.drag .qn-tip{display:block}
.qn-btn{border:1px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.6}
.qn-sheet{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.qn-panel{background:var(--card,#fff);color:var(--ink,#222);width:100%;max-width:640px;max-height:82vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.qn-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line,#ddd)}
.qn-head b{font-size:16px}
.qn-head small{color:var(--muted,#666);font-size:12px;display:block}
.qn-close{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted,#666);padding:4px 8px}
.qn-list{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 8px 16px}
.qn-item{display:grid;grid-template-columns:44px 28px 1fr;align-items:center;gap:6px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line,#eee);background:transparent;color:inherit;padding:10px 8px;font-size:14px;line-height:1.5;cursor:pointer}
.qn-row{display:flex;align-items:center;border-bottom:1px solid var(--line,#eee)}
.qn-row .qn-item{border-bottom:0;flex:1;min-width:0}
.qn-row.cur{background:var(--acc-soft,#e1efeb);border-radius:8px}
.qn-row.cur .qn-item{background:transparent}
.qn-marks{display:flex;gap:4px;padding-right:6px;flex:none}
.qn-mk{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line,#ccc);background:var(--card,#fff);font-size:16px;font-weight:900;line-height:1;cursor:pointer;color:var(--muted,#888);padding:0}
.qn-mk.ok.on{background:var(--maru,#cf3b2a);border-color:var(--maru,#cf3b2a);color:#fff}
.qn-mk.mid.on{background:var(--sankaku,#d08a12);border-color:var(--sankaku,#d08a12);color:#fff}
.qn-mk.ng.on{background:var(--batsu,#46566a);border-color:var(--batsu,#46566a);color:#fff}
.qn-item .st.mid{color:var(--sankaku,#d08a12)}
.qn-item:hover{background:var(--paper,#f6f6f6)}
.qn-item.cur{background:var(--acc-soft,#e1efeb);border-radius:8px}
.qn-item .no{font-weight:700;color:var(--muted,#666);font-variant-numeric:tabular-nums}
.qn-item .st{font-weight:900;font-size:16px;text-align:center}
.qn-item .st.ok{color:var(--maru,#cf3b2a)}
.qn-item .st.ng{color:var(--batsu,#46566a)}
.qn-item .st.no{color:var(--line,#bbb)}
.qn-item .tx{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qn-legend{display:flex;gap:12px;font-size:12px;color:var(--muted,#666);padding:6px 16px 0}`;

  function status() { try { return OPT && OPT.state(); } catch (e) { return null; } }
  /* バーの背景を、1問ずつ ○（赤）・×（灰青）・まだ（薄い色）で塗り分ける */
  function paint(meter, st) {
    const n = st.n, seg = [];
    for (let k = 0; k < n; k++) {
      const c = st.status[k] === "ok" ? "var(--maru,#cf3b2a)" : st.status[k] === "ng" ? "var(--batsu,#46566a)" : st.status[k] === "mid" ? "var(--sankaku,#d08a12)" : "transparent";
      seg.push(`${c} ${(k / n * 100).toFixed(3)}% ${((k + 1) / n * 100).toFixed(3)}%`);
    }
    const i = meter.querySelector("i"); if (i) i.style.opacity = ".35";
    meter.style.backgroundImage = `linear-gradient(90deg,${seg.join(",")})`;
  }
  function place(wrap, st, k) {
    const pos = st.n > 1 ? k / (st.n - 1) * 100 : 50;
    const kn = wrap.querySelector(".qn-knob"), tip = wrap.querySelector(".qn-tip");
    kn.style.left = pos + "%"; tip.style.left = Math.min(85, Math.max(15, pos)) + "%";
    tip.textContent = `${k + 1} / ${st.n}　${plain(st.text(k)).slice(0, 28)}`;
  }

  function enhance() {
    const st = status(); if (!st || !st.n) return;
    const head = document.querySelector(".qhead"); if (!head) return;
    const meter = head.nextElementSibling; if (!meter || !meter.classList.contains("meter") || meter.dataset.qn) return;
    meter.dataset.qn = "1";
    const wrap = document.createElement("div"); wrap.className = "qn-wrap";
    meter.parentNode.insertBefore(wrap, meter); wrap.appendChild(meter);
    wrap.insertAdjacentHTML("beforeend", `<span class="qn-knob" aria-hidden="true"></span><span class="qn-tip" aria-hidden="true"></span><input class="qn-range" type="range" min="1" max="${st.n}" step="1" value="${st.cur + 1}" aria-label="問題を移動（左右にずらす。長押しで一覧）">`);
    paint(meter, st); place(wrap, st, st.cur);
    if (!head.querySelector(".qn-btn")) head.insertAdjacentHTML("beforeend", `<button type="button" class="qn-btn" aria-label="問題の一覧を開く">一覧</button>`);
    head.querySelector(".qn-btn").addEventListener("click", open);
    const r = wrap.querySelector(".qn-range");
    let timer = null, moved = false, startX = 0;
    r.addEventListener("pointerdown", e => { moved = false; startX = e.clientX; clearTimeout(timer); timer = setTimeout(() => { if (!moved) { wrap.classList.remove("drag"); r.value = st.cur + 1; place(wrap, st, st.cur); open(); } }, 550); });
    r.addEventListener("pointermove", e => { if (Math.abs(e.clientX - startX) > 6) { moved = true; clearTimeout(timer); } });
    ["pointerup", "pointercancel", "pointerleave"].forEach(t => r.addEventListener(t, () => clearTimeout(timer)));
    /* 長押しで出るメニュー（iPhone）を出さない */
    r.addEventListener("contextmenu", e => { e.preventDefault(); clearTimeout(timer); open(); });
    r.addEventListener("input", () => { moved = true; clearTimeout(timer); wrap.classList.add("drag"); place(wrap, st, +r.value - 1); });
    r.addEventListener("change", () => { wrap.classList.remove("drag"); const k = +r.value - 1; if (k !== st.cur) OPT.jump(k); });
    /* キー操作が答えのキー（1〜4 など）に化けないようにする */
    r.addEventListener("keydown", e => e.stopPropagation());
  }

  function close() { if (sheet) { sheet.remove(); sheet = null; document.body.style.overflow = ""; } }
  const SYM = { ok: "○", mid: "△", ng: "×" };
  function listHtml(st) {
    const cnt = g => st.status.filter(s => s === g).length;
    const ok = cnt("ok"), mid = cnt("mid"), ng = cnt("ng"), canMark = !!OPT.mark;
    const rows = Array.from({ length: st.n }, (_, k) => {
      const s = st.status[k] || "";
      const item = `<button type="button" class="qn-item ${!canMark && k === st.cur ? "cur" : ""}" data-k="${k}"><span class="no">${k + 1}</span><span class="st ${s || "no"}">${SYM[s] || "－"}</span><span class="tx">${esc(plain(st.text(k)).slice(0, 80))}</span></button>`;
      if (!canMark) return item;
      return `<div class="qn-row ${k === st.cur ? "cur" : ""}">${item}<span class="qn-marks" role="group" aria-label="${k + 1}問目の評価">${["ok", "mid", "ng"].map(g => `<button type="button" class="qn-mk ${g} ${s === g ? "on" : ""}" data-k="${k}" data-g="${g}" aria-pressed="${s === g}" aria-label="${k + 1}問目を${{ ok: "○（できた）", mid: "△（あいまい）", ng: "×（まちがい）" }[g]}にする">${SYM[g]}</button>`).join("")}</span></div>`;
    }).join("");
    return `<div class="qn-panel"><div class="qn-head"><div><b>問題の一覧（全${st.n}問）</b><small>○ ${ok}・△ ${mid}・× ${ng}・まだ ${st.n - ok - mid - ng}　${canMark ? "問題文をタップで移動、右の○△×で評価を変更" : "タップでその問題へ"}</small></div><button type="button" class="qn-close" aria-label="閉じる">×</button></div>
      <div class="qn-legend"><span><b style="color:var(--maru,#cf3b2a)">○</b> できた</span><span><b style="color:var(--sankaku,#d08a12)">△</b> あいまい</span><span><b style="color:var(--batsu,#46566a)">×</b> まちがい</span><span><b style="color:var(--line,#bbb)">－</b> まだ</span></div>
      ${canMark ? `<div class="qn-legend" style="padding-top:2px">評価に合わせて、ホームの「今日の復習」に出ます（×・△は明日。○は明日→3日後→1週間後→2週間後→1か月後と間隔をのばす）。</div>` : ""}
      <div class="qn-list">${rows}</div></div>`;
  }
  function open() {
    const st = status(); if (!st) return; close();
    sheet = document.createElement("div"); sheet.className = "qn-sheet"; sheet.setAttribute("role", "dialog"); sheet.setAttribute("aria-label", "問題の一覧");
    sheet.innerHTML = listHtml(st);
    sheet.addEventListener("click", e => {
      if (e.target === sheet || e.target.closest(".qn-close")) { close(); return; }
      const m = e.target.closest(".qn-mk");
      if (m) {
        const k = +m.dataset.k, g = m.dataset.g;
        OPT.mark(k, g);
        /* 一覧を開いたまま、行の表示と見出しの数を更新する（スクロール位置は保つ） */
        const ns = status(); if (!ns) return;
        const list = sheet.querySelector(".qn-list"), top = list ? list.scrollTop : 0;
        sheet.innerHTML = listHtml(ns);
        const nl = sheet.querySelector(".qn-list"); if (nl) nl.scrollTop = top;
        const b = sheet.querySelector(`.qn-mk[data-k="${k}"][data-g="${g}"]`); if (b) b.focus();
        return;
      }
      const b = e.target.closest(".qn-item"); if (b) { const k = +b.dataset.k; close(); if (k !== st.cur) OPT.jump(k); }
    });
    sheet.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Escape") close(); });
    document.body.appendChild(sheet); document.body.style.overflow = "hidden";
    const cur = sheet.querySelector(".qn-row.cur, .qn-item.cur"); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "center" });
    const c = sheet.querySelector(".qn-close"); if (c) c.focus();
  }

  return {
    init(opt) {
      OPT = opt;
      const s = document.createElement("style"); s.textContent = css; document.head.appendChild(s);
      new MutationObserver(() => enhance()).observe(document.body, { childList: true, subtree: true });
      enhance();
    },
    open, close
  };
})();

/* ---------- 復習の予定（エビングハウスの忘却曲線）：3つの学習アプリで共通の部品 ----------
   問題ごとに ○（できた）・△（あいまい）・×（まちがい）の評価を持ち、次に出す日を決める。
   ○を重ねるほど間隔をのばす：翌日 → 3日後 → 1週間後 → 2週間後 → 1か月後 → 2か月後。
   △と×は翌日にもう一度（×は最初の段階からやり直し、△は段階を進めない）。
   同じ日に評価を付け直したときは、その日の最初の評価の前の段階から計算し直す（一覧で△に直したとき用）。
   hold（SRS.init(保存名, {hold:true})）：復習が残っている間は「復習の日」を進めない。
   前の復習を全部済ませるまで次の日の分は出さず、たまらない（済ませた翌日に次の1日分が出る）。
   予定日は「復習の日」で数えるので、休んだ日の分だけ予定全体が後ろにずれる。SRS.scope(ids) で今ある問題に限る。
   SRS.init(保存名) / SRS.set(id, "ok"|"mid"|"ng") / SRS.grade(id) / SRS.isDue(id) / SRS.dueIds(ids) / SRS.seed(id, ok) */
const SRS = (() => {
  let GAP = [1, 3, 7, 14, 30, 60];   // SRS.init(保存名, {gap:[…]}) でアプリごとに変えられる
  let KEY = null, D = {}, HOLD = false, C = null, SCOPE = null;
  const css = `
.review{margin:14px 0;padding:14px 16px;border:2px solid var(--maru,#cf3b2a);border-radius:16px;background:var(--card,#fff)}
.review .rvhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.review .rvhead b{font-size:18px}
.review .rvhead small{color:var(--muted,#666);font-size:12px}
.review .rvnum{margin:8px 0 10px;font-size:15px}
.review .rvnum strong{font-size:26px;color:var(--maru,#cf3b2a);margin-right:2px}
.review .rvnote{margin:10px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted,#666)}
.review .btn{width:100%}
.selfmark{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:12px;background:var(--card,#fff)}
.selfmark>span{font-size:13px;font-weight:700;margin-right:2px}
.selfmark small{flex-basis:100%;color:var(--muted,#666);font-size:12px}
.smk{border:1.5px solid var(--line,#ccc);background:var(--card,#fff);color:var(--ink,#222);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:38px}
.smk.ok.on{background:var(--maru,#cf3b2a);border-color:var(--maru,#cf3b2a);color:#fff}
.smk.mid.on{background:var(--sankaku,#d08a12);border-color:var(--sankaku,#d08a12);color:#fff}
.smk.ng.on{background:var(--batsu,#46566a);border-color:var(--batsu,#46566a);color:#fff}`;
  const day = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return day(d.getTime()); };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); if (C) localStorage.setItem(KEY + "-clock", JSON.stringify(C)); } catch (e) {} };
  /* 復習の日：hold のときは、前の復習が残っている間は進めない（C.v＝復習の日、C.r＝最後に見た本当の日） */
  const pending = () => Object.keys(D).some(id => (!SCOPE || SCOPE.has(id)) && D[id].due <= C.v);
  function vt() {
    const real = day(Date.now());
    if (!HOLD) return real;
    if (!C || !(C.v > 0) || !(C.r > 0) || C.r > real) { C = { v: real, r: real }; save(); return real; }
    if (C.r < real) { while (C.r < real) { C.r = addDays(C.r, 1); if (!pending()) C.v = addDays(C.v, 1); } save(); }
    return C.v;
  }
  function set(id, g) {
    const now = Date.now(), today = day(now), vd = vt();
    const r = D[id] || { st: 0 };
    if (r.t === undefined || day(r.t) !== today) r.base = r.st || 0;   // その日の最初の評価の前の段階
    const b = r.base || 0;
    if (g === "ok") { r.st = Math.min(b + 1, GAP.length); r.due = addDays(vd, GAP[r.st - 1]); }
    else if (g === "mid") { r.st = b; r.due = addDays(vd, 1); }
    else { r.st = 0; r.due = addDays(vd, 1); }
    r.g = g; r.t = now; D[id] = r; save();
  }
  return {
    GAP,
    init(key, opt) { KEY = key; HOLD = !!(opt && opt.hold); if (opt && opt.gap) GAP = opt.gap; try { C = HOLD ? JSON.parse(localStorage.getItem(KEY + "-clock") || "null") : null; } catch (e) { C = null; } try { const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st); } catch (e) {} try { D = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { D = {}; } },
    set,
    scope(ids) { SCOPE = new Set(ids); },
    /* 復習の日（hold でなければ今日）。今日の復習の続きを保存する名前に使う */
    vday: () => vt(),
    /* 本当の日より遅れている日数（前の復習が残っていて止まっている日数） */
    held: () => Math.round((day(Date.now()) - vt()) / 864e5),
    has: id => !!D[id],
    grade: id => (D[id] && D[id].g) || "",
    stage: id => (D[id] && D[id].st) || 0,
    /* 今日（または前から）予定日になっている問題 */
    isDue: id => !!(D[id] && D[id].due <= vt()),
    dueIds(ids) { const t = vt(); return ids.filter(id => D[id] && D[id].due <= t).sort((a, b) => ({ ng: 0, mid: 1, ok: 2 }[D[a].g] - { ng: 0, mid: 1, ok: 2 }[D[b].g]) || D[a].due - D[b].due); },
    /* 明日・1週間以内に予定がある問題の数 */
    /* 次に出す予定日（hold の「復習の日」で数える） */
    due: id => D[id] ? D[id].due : 0,
    upcoming(ids) { const t = vt(), t1 = addDays(t, 1), t7 = addDays(t, 7); let a = 0, w = 0; ids.forEach(id => { const r = D[id]; if (!r || r.due <= t) return; if (r.due <= t1) a++; if (r.due <= t7) w++; }); return { tomorrow: a, week: w }; },
    /* 今日つけた評価か */
    today: id => !!(D[id] && day(D[id].t) === day(Date.now())),
    /* この部品を入れる前の記録（○×だけ）から予定を作る：×は今日、○は3日後 */
    seed(id, ok) { if (D[id]) return; const t = vt(); D[id] = ok ? { st: 1, g: "ok", due: addDays(t, 3), t: 0 } : { st: 0, g: "ng", due: t, t: 0 }; },
    seedRaw(id, r) { if (!D[id]) D[id] = r; },
    /* 次に出す日の説明（「明日」「3日後」など） */
    nextLabel(id) { const r = D[id]; if (!r) return ""; const n = Math.round((r.due - vt()) / 864e5); return n <= 0 ? "今日" : n === 1 ? "明日" : n === 7 ? "1週間後" : n === 14 ? "2週間後" : n === 30 ? "1か月後" : n === 60 ? "2か月後" : n + "日後"; },
    flush: save,
    clear() { D = {}; if (C) C = { v: day(Date.now()), r: day(Date.now()) }; save(); },
    /* 指定した問題の予定だけ消す（分野ごと・1問ごとのリセット） */
    del(ids) { ids.forEach(id => { delete D[id]; }); save(); },
    dump: () => D
  };
})();

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function start(ids, label, key) { S = { view: "quiz", list: ids, i: 0, picked: null, picks: {}, results: [], label, key: key || null }; saveSes(); render(); window.scrollTo(0, 0); }
function resumeOr(key, make, label) {
  if (validSes(key)) {
    const v = store.ses[key]; let i = v.i, picked = v.picked; const picks = v.picks || {};
    if (picked !== null && i + 1 < v.list.length) { i++; picked = picks[i] !== undefined && picks[i] !== null ? picks[i] : null; }
    S = { view: "quiz", list: v.list, i, picked, picks, results: v.results || [], label: v.label, key }; saveSes(); render(); window.scrollTo(0, 0);
  } else { const ids = make(); if (ids.length) start(ids, label, key); }
}

const svgHtml = k => `<figure class="fig svgfig">${FIGS[k].s}<figcaption class="cap">図解　${esc(FIGS[k].t)}</figcaption></figure>`;
function openZoom(f) {
  const z = document.createElement("div"); z.className = "zoomer"; z.setAttribute("role", "dialog"); z.setAttribute("aria-label", "図を拡大して見る");
  const body = f.cloneNode(true); body.classList.add("zbody"); body.classList.remove("fig");
  const cap = body.querySelector("figcaption"); if (cap) cap.remove();
  z.innerHTML = `<div class="zbar"><button type="button" class="ghost" data-z="-" aria-label="小さくする">－ 縮小</button><span class="zpct"></span><button type="button" class="ghost" data-z="+" aria-label="大きくする">＋ 拡大</button><button type="button" class="btn" data-z="x">閉じる</button></div><div class="zscroll"></div>${cap ? `<div class="zcap">${cap.innerHTML}</div>` : ""}`;
  z.querySelector(".zscroll").appendChild(body);
  const steps = [100, 150, 200, 300, 400]; let si = 1;
  const apply = () => { body.style.width = steps[si] + "%"; z.querySelector(".zpct").textContent = steps[si] + "%"; };
  apply();
  const close = () => { z.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", onKey, true); };
  const onKey = e => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  z.addEventListener("click", e => { const b = e.target.closest("[data-z]"); if (!b) return; const v = b.dataset.z; if (v === "x") close(); else { si = Math.max(0, Math.min(steps.length - 1, si + (v === "+" ? 1 : -1))); apply(); } });
  document.addEventListener("keydown", onKey, true);
  document.body.appendChild(z); document.body.style.overflow = "hidden"; z.querySelector('[data-z="x"]').focus();
}
document.addEventListener("click", e => { const f = e.target.closest(".fig"); if (!f || e.target.closest("a, button, .zoomer")) return; openZoom(f); });

/* 文字検索：問題文・選択肢・答え・解説・覚え方・まとめ表から探す（ひらがな/カタカナ・全角/半角・大文字/小文字を区別しない） */
const normS = t => String(t || "").normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
let SIDX = null;
const mtText = q => (q.mt || []).filter(k => MT[k]).map(k => MT[k].t + " " + MT[k].r.map(r => r.join(" ")).join(" ")).join(" ");
function searchIdx() { if (!SIDX) SIDX = Q.map(q => [q.id, normS([q.q, (q.ch || []).join(" "), q.core, q.e, q.m, (q.cx || []).join(" "), UNITS[q.u][1]].join(" ")), normS(mtText(q))]); return SIDX; }
let SQ = "";
function searchHits(qs) { const ws = normS(qs).split(/\s+/).filter(Boolean); if (!ws.length) return []; const a = searchIdx(); const main = a.filter(([, t]) => ws.every(w => t.includes(w))).map(([id]) => id); const mset = new Set(main); return main.concat(a.filter(([id, t, m]) => !mset.has(id) && ws.every(w => (t + m).includes(w))).map(([id]) => id)); }
function searchResHtml() {
  if (!SQ.trim()) return "";
  const ids = searchHits(SQ), show = ids.slice(0, 60);
  return `<p class="srcount">「${esc(SQ)}」：<b>${ids.length}問</b>${ids.length > show.length ? `（上の${show.length}問を表示）` : ""}</p>${ids.length ? `<button class="btn" data-act="srun">この${ids.length}問をまとめて解く</button>` : ""}
  <ul class="srlist">${show.map(id => { const q = QI[id], f = FIELDS[q.f], r = store.res[id]; return `<li><button class="sritem" data-act="one" data-id="${id}" style="--fc:${f.color}"><span class="tag">${esc(f.short)}${r ? (r.ok ? "・○" : "・×") : ""}</span>${esc(q.q.replace(/\n.*$/s, "").slice(0, 80))}</button></li>`; }).join("")}</ul>`;
}
function searchHtml() { return `<section class="search"><label for="sbox" class="lbl">文字で探す</label><div class="srow"><input id="sbox" type="search" inputmode="search" enterkeyhint="search" placeholder="例：考察、STROBE、スライド、生成AI" value="${esc(SQ)}" autocomplete="off"><button class="btn sub" data-act="sclear" ${SQ ? "" : "hidden"}>消す</button></div><div id="sres">${searchResHtml()}</div></section>`; }
document.addEventListener("input", e => { if (e.target && e.target.id === "sbox") { SQ = e.target.value; clearTimeout(window.__st); window.__st = setTimeout(() => { const r = document.getElementById("sres"); if (r) r.innerHTML = searchResHtml(); const c = document.querySelector('[data-act="sclear"]'); if (c) c.hidden = !SQ; }, 200); } });

/* 解説の編集（自分の端末に保存：localStorage paper4-edits） */
const EDK = "paper4-edits";
let EDIT = {}; try { EDIT = JSON.parse(localStorage.getItem(EDK) || "{}") || {}; } catch (e) { EDIT = {}; }
const edSave = () => { try { localStorage.setItem(EDK, JSON.stringify(EDIT)); } catch (e) {} };
const coreOf = q => (EDIT[q.id] && EDIT[q.id].core != null) ? EDIT[q.id].core : (q.core || "");
const eOf = q => (EDIT[q.id] && EDIT[q.id].e != null) ? EDIT[q.id].e : (q.e || "");
function editorHtml(q) {
  if (S.edit !== q.id) return `<button type="button" class="ghost edbtn" data-act="edopen">✎ 解説を編集</button>`;
  return `<div class="editor"><label>ここだけ読めば大丈夫（1〜3行）<textarea id="edcore" rows="3">${esc(coreOf(q))}</textarea></label>
    <label>理由と周辺知識<textarea id="ede" rows="8">${esc(eOf(q))}</textarea></label>
    <div class="edrow"><button type="button" class="btn" data-act="edsave">保存</button><button type="button" class="ghost" data-act="edcancel">やめる</button>${EDIT[q.id] ? `<button type="button" class="ghost" data-act="edreset">元の解説に戻す</button>` : ""}</div>
    <p class="ednote">この端末にだけ保存されます。ホームのいちばん下で書き出し・読み込みができます。</p></div>`;
}
/* 共有とバックアップ（ホームのいちばん下） */
const APPURL = () => { try { if (/^https?:/.test(location.href)) return location.origin + location.pathname; } catch (e) {} return DEFURL; };
function shareHtml() {
  const n = Object.keys(EDIT).length;
  return `<section class="share"><h2>共有・バックアップ</h2>
  <p>このアプリのアドレス：<span class="url">${esc(APPURL())}</span></p>
  <div class="shrow"><button type="button" class="btn" data-act="share">共有する</button><button type="button" class="ghost" data-act="copyurl">アドレスをコピー</button></div>
  <p class="shnote">問題・解説・実践ワークはすべて自作なので、同僚や後輩に共有しても問題ありません。実践ワークに書いた内容はこの端末にだけ保存され、共有されません。</p>
  <h3>学習の記録を引き継ぐ</h3>
  <p class="shnote">正解・まちがい、○△×の評価、復習の予定、途中の続き、編集した解説をまとめて1つのファイルにします。機種変更やデータが消えたときは、新しい方でこのファイルを読み込むと今の状態から続けられます（今の記録は読み込んだ内容に置きかわります）。アプリの更新では記録はそのまま残ります。自分メモ（画像つき）は上の「メモを書き出す」で別に保存してください。</p>
  <div class="shrow"><button type="button" class="btn" data-act="lgexport">記録を書き出す（ファイル）</button><label class="ghost filebtn">記録を読み込む<input type="file" id="lgimport" accept=".json,application/json" hidden></label></div>
  <h3>自分で編集した解説（${n}問）</h3>
  <div class="shrow"><button type="button" class="ghost" data-act="edexport" ${n ? "" : "disabled"}>書き出す（ファイル）</button><label class="ghost filebtn">読み込む<input type="file" id="edimport" accept=".json,application/json" hidden></label></div>
  </section>`;
}
document.addEventListener("change", e => { if (e.target && e.target.id === "edimport" && e.target.files[0]) { const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); const ed = d.edits || d; let n = 0; Object.keys(ed).forEach(k => { if (QI[k]) { EDIT[k] = ed[k]; n++; } }); edSave(); alert(n + "問の解説を読み込みました"); render(); } catch (err) { alert("読み込めませんでした"); } }; r.readAsText(e.target.files[0]); } });
const LOGKEYS = ["paper4-v1", "paper4-srs", "paper4-srs-clock", "paper4-edits", "paper4-work"];
function logExport() {
  const data = {}; LOGKEYS.forEach(k => { try { const v = localStorage.getItem(k); if (v !== null) data[k] = v; } catch (e) {} });
  const d = new Date(), ymd = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const blob = new Blob([JSON.stringify({ app: "paper4-log", v: 1, date: d.toISOString(), solved: Object.keys(store.res).length, data })], { type: "application/json" });
  const ua = document.createElement("a"); ua.href = URL.createObjectURL(blob); ua.download = "論文スライド_学習記録_" + ymd + ".json"; document.body.appendChild(ua); ua.click(); setTimeout(() => { URL.revokeObjectURL(ua.href); ua.remove(); }, 1000);
}
document.addEventListener("change", e => { if (!(e.target && e.target.id === "lgimport" && e.target.files[0])) return; const f = e.target.files[0]; e.target.value = ""; const r = new FileReader();
  r.onload = () => { let j; try { j = JSON.parse(r.result); } catch (err) { alert("読み込めませんでした（ファイルが壊れています）"); return; }
    if (!j || j.app !== "paper4-log" || !j.data || !j.data["paper4-v1"]) { alert("このアプリの学習記録のファイルではありません"); return; }
    let st; try { st = JSON.parse(j.data["paper4-v1"]); } catch (err) { st = null; } if (!st || !st.res) { alert("読み込めませんでした（記録が見つかりません）"); return; }
    const when = j.date ? new Date(j.date).toLocaleString("ja-JP") : "不明";
    if (!confirm(when + " に書き出した記録（" + Object.keys(st.res).length + "問ぶん）を読み込みます。\nこの端末の今の記録（" + Object.keys(store.res).length + "問ぶん）は置きかわります。自分メモはそのまま残ります。" + ASK)) return;
    try { LOGKEYS.forEach(k => { if (k in j.data) localStorage.setItem(k, j.data[k]); else localStorage.removeItem(k); }); } catch (err) { alert("保存できませんでした"); return; }
    alert("読み込みました。アプリを開き直します。"); location.reload(); };
  r.readAsText(f); });
function selfMarkHtml(id) {
  const g = SRS.grade(id), lab = { ok: "○ できた", mid: "△ あいまい", ng: "× まちがい" };
  return `<div class="selfmark" role="group" aria-label="この問題の評価"><span>この問題の評価</span>${["ok", "mid", "ng"].map(k => `<button type="button" class="smk ${k} ${g === k ? "on" : ""}" data-act="smark" data-g="${k}" aria-pressed="${g === k}">${lab[k]}</button>`).join("")}<small>次は${SRS.nextLabel(id)}の「今日の復習」に出ます（○を続けるほど間隔がのびます）</small></div>`;
}
function end() {
  const n = S.results.length, ok = S.results.filter(r => r.ok).length; const miss = S.results.filter(r => !r.ok);
  const msg = ok === n ? "全問正解！ この調子で次へ。" : n && ok / n >= .8 ? "8割をこえています。まちがえた所だけ、もう一度見ておきましょう。" : "だいじょうぶ。「ここだけ読めば大丈夫」を読んで、もう一度解けば必ず覚えられます。";
  app.innerHTML = header() + `<section class="end">
    <span class="qhead">${esc(S.label)} の結果</span>
    <div class="score">${ok}<small> / ${n}問</small></div>
    <p style="margin:0">${msg}</p>
    ${miss.length ? `<div class="miss"><b style="font-size:14px">まちがえた問題</b>${miss.map(r => { const q = QI[r.id]; return `<button data-act="one" data-id="${q.id}"><b>×</b>${esc(q.q.slice(0, 80))}</button>`; }).join("")}</div>` : ""}
    <div class="row">${miss.length ? `<button class="btn" data-act="retry">まちがえた${miss.length}問をやり直す</button>` : ""}<button class="btn sub" data-act="home">ホームへ</button></div>
  </section>`;
}

function render() { S.view === "home" ? home() : S.view === "quiz" ? quiz() : S.view === "work" ? work() : S.view === "model" ? model() : S.view === "step" ? step() : S.view === "drill" ? drill() : S.view === "drillend" ? drillEnd() : end(); if (S.view === "quiz") resetBar(); }
/* 問題画面のいちばん下のリセット（この問題／この単元を選ぶ） */
function resetBar() { const q = QI[S.list[S.i]]; if (!q) return; const d = document.createElement("div"); d.className = "rbar";
  d.innerHTML = `<button type="button" class="ghost" data-act="rmenu">リセット</button><div class="rmenu" hidden><p>どちらをリセットしますか？（まだ解いていない状態に戻します）</p><button type="button" class="ghost" data-act="qclr">この問題をリセット</button><button type="button" class="ghost" data-act="uclr" data-u="${q.u}">この単元（${esc(UNITS[q.u][1])}）をリセット</button><button type="button" class="ghost" data-act="rmenu">やめる</button></div>`;
  app.appendChild(d); }

function pick(v) {
  if (S.picked !== null) return;
  const q = QI[S.list[S.i]];
  S.picked = v; S.picks = S.picks || {}; S.picks[S.i] = v; S.sel = []; const ok = isOk(q, v); const r = store.res[q.id] || { n: 0 };
  store.res[q.id] = { ok, n: r.n + 1 }; S.results.push({ id: q.id, ok }); SRS.set(q.id, ok ? "ok" : "ng"); saveSes(); save();
  render();
  const vd = document.querySelector(".verdict"); if (vd && vd.scrollIntoView) vd.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
function prev() { if (S.i > 0) { S.i--; S.picked = pickAt(S.i); S.sel = []; S.edit = null; saveSes(); render(); window.scrollTo(0, 0); } }
function next() {
  S.edit = null;
  if (S.i + 1 < S.list.length) { S.i++; S.picked = pickAt(S.i); S.sel = []; saveSes(); render(); window.scrollTo(0, 0); }
  else { dropSes(S.key); S.view = "end"; render(); window.scrollTo(0, 0); }
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act;
  if (a === "home") { S.view = "home"; render(); window.scrollTo(0, 0); }
  else if (workAct(a, b) || courseAct(a, b) || drillAct(a, b)) {}
  else if (a === "today5") { const k = "today5:" + todayKey(); if (validSes(k)) resumeOr(k, () => [], ""); else { const ids = todayIds(); if (ids.length) start(ids, "今日の5問", k); } }
  else if (a === "klv") { const n = +b.dataset.n, k = "k2:lv:" + n, lb = KN[n].replace("　", " "); if (validSes(k)) resumeOr(k, () => [], lb); else startAtYet(kIds(n), lb, k); }
  else if (a === "kf") { const c = b.dataset.c; resumeOr("k:f:" + c, () => KO.filter(q => q.f === c).map(q => q.id), FIELDS[c].name); }
  else if (a === "kall") { if (validSes("k:all")) resumeOr("k:all", () => [], ""); else startAtYet(KO.map(q => q.id), "全問（章の順）", "k:all"); }
  else if (a === "ku") { const u = +b.dataset.u; resumeOr("k:u:" + u, () => kuIds(u), UNITS[u][1]); }
  else if (a === "tag") { const t = b.dataset.t; resumeOr("all:tag:" + t, () => KO.filter(q => (q.tg || []).includes(t)).map(q => q.id), TAGN[t] + "だけ"); }
  else if (a === "all") resumeOr("all:all", () => shuffle(Q.map(q => q.id)), "全問シャッフル");
  else if (a === "yet") resumeOr("all:yet", () => yetIds(), "まだの問題");
  else if (a === "wrong") resumeOr("all:wrong", () => shuffle(wrongIds()), "まちがえた問題");
  else if (a === "review") resumeOr(todayKey(), () => SRS.dueIds(Q.map(q => q.id)), "今日の復習");
  else if (a === "smark") { rate(S.list[S.i], b.dataset.g); render(); }
  else if (a === "memo") { const ids = MyNote.ids().filter(id => QI[id]); if (ids.length) start(KO.filter(q => ids.includes(q.id)).map(q => q.id), "メモした問題"); }
  else if (a === "resume") { const k = b.dataset.k; if (validSes(k)) resumeOr(k, () => [], ""); }
  else if (a === "drop") { dropSes(b.dataset.k); render(); }
  else if (a === "retry") start(S.results.filter(r => !r.ok).map(r => r.id), "やり直し");
  else if (a === "one") start([b.dataset.id], "1問だけ");
  else if (a === "srun") { const ids = searchHits(SQ); if (ids.length) start(ids, "検索：" + SQ); }
  else if (a === "sclear") { SQ = ""; render(); }
  else if (a === "edopen") { S.edit = S.list[S.i]; render(); const t = document.getElementById("edcore"); if (t) t.focus(); }
  else if (a === "edcancel") { S.edit = null; render(); }
  else if (a === "edsave") { const id = S.list[S.i], q = QI[id], c = document.getElementById("edcore").value, ee = document.getElementById("ede").value; const o = {}; if (c !== (q.core || "")) o.core = c; if (ee !== (q.e || "")) o.e = ee; if (Object.keys(o).length) EDIT[id] = Object.assign(o, { t: Date.now() }); else delete EDIT[id]; edSave(); S.edit = null; render(); }
  else if (a === "edreset") { const id = S.list[S.i]; if (confirm("この問題の解説を元に戻します。自分で編集した内容は消えます。\n\n本当に戻しますか？")) { delete EDIT[id]; edSave(); S.edit = null; render(); } }
  else if (a === "share") { const u = APPURL(); if (navigator.share) navigator.share({ title: "論文とスライドの書き方（皮膚科）", url: u }).catch(() => {}); else { try { navigator.clipboard.writeText(u); alert("アドレスをコピーしました"); } catch (e) { prompt("このアドレスをコピーしてください", u); } } }
  else if (a === "copyurl") { const u = APPURL(); try { navigator.clipboard.writeText(u).then(() => alert("アドレスをコピーしました"), () => prompt("このアドレスをコピーしてください", u)); } catch (e) { prompt("このアドレスをコピーしてください", u); } }
  else if (a === "lgexport") logExport();
  else if (a === "edexport") { const blob = new Blob([JSON.stringify({ app: "paper4", date: new Date().toISOString(), edits: EDIT }, null, 1)], { type: "application/json" }); const ua = document.createElement("a"); ua.href = URL.createObjectURL(blob); ua.download = "論文スライド_編集した解説.json"; document.body.appendChild(ua); ua.click(); setTimeout(() => { URL.revokeObjectURL(ua.href); ua.remove(); }, 1000); }
  else if (a === "pickc") pick(+b.dataset.v);
  else if (a === "toggle") { const v = +b.dataset.v; const q = QI[S.list[S.i]]; S.sel = S.sel || []; S.sel = S.sel.includes(v) ? S.sel.filter(x => x !== v) : S.sel.length < q.a.length ? S.sel.concat(v) : S.sel; render(); }
  else if (a === "check") { const q = QI[S.list[S.i]]; if ((S.sel || []).length === q.a.length) pick(S.sel.slice().sort((x, y) => x - y)); }
  else if (a === "next") next();
  else if (a === "prev") prev();
  else if (a === "reset") {
    if (confirm("全部の問題を「まだ解いていない」状態に戻します（正解・まちがい、○△×の評価、復習の予定、途中の続きを消します）。自分メモは残ります。" + ASK)) { store = { res: {}, ses: {} }; save(); SRS.clear(); render(); }
  }
  else if (a === "rmenu") { const m = document.querySelector(".rmenu"); if (m) { m.hidden = !m.hidden; if (!m.hidden) m.scrollIntoView({ block: "nearest" }); } }
  else if (a === "resetf") {
    const c = b.dataset.c, f = FIELDS[c], ids = qsOf(c).map(q => q.id), n = ids.filter(id => store.res[id] || SRS.has(id)).length;
    if (confirm(`「${f.name}」の${n}問を「まだ解いていない」状態に戻します。\n正解・まちがい、○△×の評価、復習の予定、この章の途中の続きが消えます。自分メモは残ります。` + ASK)) { clearIds(ids, Object.keys(store.ses).filter(k => k === "k:f:" + c)); render(); }
  }
  else if (a === "uclr") {
    const u = +b.dataset.u, ids = kuIds(u), n = ids.filter(id => store.res[id] || SRS.has(id)).length;
    if (confirm(`単元「${UNITS[u][1]}」の${ids.length}問（記録あり${n}問）を「まだ解いていない」状態に戻します。\n正解・まちがい、○△×の評価、復習の予定が消えます。自分メモは残ります。` + ASK)) { clearIds(ids, ["k:u:" + u]); render(); }
  }
  else if (a === "qclr") {
    const id = S.list[S.i];
    if (confirm("この問題を「まだ解いていない」状態に戻します（正解・まちがい、○△×の評価、復習の予定を消します）。自分メモは残ります。" + ASK)) { clearIds([id]); render(); }
  }
});
document.addEventListener("keydown", e => {
  if (S.view !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase(); const q = QI[S.list[S.i]];
  if (k === "arrowleft" || k === "p") { e.preventDefault(); prev(); return; }
  if (S.picked === null) { if (/^[1-5]$/.test(k) && +k <= q.ch.length) { if (isMulti(q)) { const v = +k - 1; S.sel = S.sel || []; S.sel = S.sel.includes(v) ? S.sel.filter(x => x !== v) : S.sel.length < q.a.length ? S.sel.concat(v) : S.sel; render(); } else pick(+k - 1); } }
  else if (k === "arrowright") { e.preventDefault(); next(); }
  else if (k === "enter" || k === "n" || k === " ") { if (document.activeElement && document.activeElement.id !== "nextBtn") { e.preventDefault(); next(); } }
});
render();
